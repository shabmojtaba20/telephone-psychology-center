<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بررسی سفارش | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:32px auto}.card{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #18233a0a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f8f9ff;border-radius:12px;padding:14px}.label{color:#667085;font-size:13px}.value{font-size:17px;font-weight:700;margin-top:4px}.muted{color:#667085}.btn{display:inline-block;border:0;background:#5b5bd6;color:#fff;text-decoration:none;padding:12px 18px;border-radius:11px;font:inherit;cursor:pointer;margin:5px}.danger{background:#fff;color:#b42318;border:1px solid #f1b8b2}.msg{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>🧾 بررسی سفارش</h1><p class="muted">قبل از پرداخت، اطلاعات سفارش خود را بررسی کنید.</p></div><div id="orderBox" class="card"><div class="muted">در حال دریافت سفارش…</div></div><div class="card"><button id="payBtn" class="btn" disabled>ادامه به پرداخت</button><button id="deleteBtn" class="btn danger" disabled>حذف سفارش</button><a class="btn" href="/">بازگشت به صفحه اصلی</a><div id="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fa=v=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tehran'}).format(new Date(v))}catch{return v}};const msg=(t,ok=false)=>{$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t};let order=null,appointments=[];async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.replace('/?login=1');return}const id=new URLSearchParams(location.search).get('order_id');if(!id){$('orderBox').innerHTML='<p>شناسه سفارش پیدا نشد.</p>';return}const o=await db.from('booking_orders').select('id,user_id,service_id,consultant_id,session_count,total_amount,payment_status,created_at').eq('id',id).eq('user_id',user.id).maybeSingle();if(o.error||!o.data){$('orderBox').innerHTML='<p>سفارش پیدا نشد یا متعلق به حساب شما نیست.</p>';return}order=o.data;if(order.payment_status!=='pending'){$('orderBox').innerHTML='<p>این سفارش دیگر در وضعیت قابل پرداخت نیست.</p>';return}const [a,s,c]=await Promise.all([db.from('appointments').select('id,scheduled_at,status,payment_status,amount,client_reason,notes').eq('booking_order_id',id).eq('user_id',user.id).order('scheduled_at'),db.from('services').select('name').eq('id',order.service_id).maybeSingle(),db.from('consultants').select('name').eq('id',order.consultant_id).maybeSingle()]);appointments=a.data||[];if(a.error||!appointments.length){$('orderBox').innerHTML='<p>جزئیات نوبت سفارش پیدا نشد.</p>';return}const dates=appointments.map(x=>'<div class="item"><div class="label">زمان نوبت</div><div class="value">'+esc(fa(x.scheduled_at))+'</div></div>').join('');$('orderBox').innerHTML='<div class="grid"><div class="item"><div class="label">شماره سفارش</div><div class="value">'+esc(order.id)+'</div></div><div class="item"><div class="label">خدمت</div><div class="value">'+esc(s.data?.name||'—')+'</div></div><div class="item"><div class="label">مشاور</div><div class="value">'+esc(c.data?.name||'—')+'</div></div><div class="item"><div class="label">تعداد جلسات</div><div class="value">'+Number(order.session_count||appointments.length).toLocaleString('fa-IR')+'</div></div><div class="item"><div class="label">مبلغ کل</div><div class="value">'+Number(order.total_amount||0).toLocaleString('fa-IR')+' تومان</div></div><div class="item"><div class="label">وضعیت</div><div class="value">در انتظار پرداخت</div></div>'+dates+'</div>';$('payBtn').disabled=false;$('deleteBtn').disabled=false}$('payBtn').onclick=()=>{if(order)location.href='/payment.html?order_id='+encodeURIComponent(order.id)};$('deleteBtn').onclick=async()=>{if(!order||!appointments.length)return;if(!confirm('آیا از حذف این سفارش و نوبت‌های مربوط به آن مطمئن هستید؟'))return;$('deleteBtn').disabled=true;$('payBtn').disabled=true;for(const a of appointments){const r=await db.rpc('remove_pending_booking_session',{p_appointment_id:a.id});if(r.error){msg(r.error.message||'حذف سفارش انجام نشد.');$('deleteBtn').disabled=false;$('payBtn').disabled=false;return}}msg('سفارش با موفقیت حذف شد و نوبت‌های رزرو‌شده آزاد شدند.',true);setTimeout(()=>location.replace('/'),900)};load();</script></body></html>
