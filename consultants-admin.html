<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرست مشاوران | پنل مدیریت</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182033;--muted:#6b7280;--line:#e5e7eb;--primary:#5b5bd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}h1{margin:0;font-size:24px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;cursor:pointer;font:inherit;text-decoration:none}.btn.gray{background:#64748b}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 18px #11182708}.notice{display:none;padding:12px 14px;border-radius:10px;margin-bottom:12px;background:#ecfdf5;color:#166534}.notice.err{background:#fff1f2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.consultant{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.name{font-size:18px;font-weight:700;margin-bottom:6px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.photo{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#f1f5f9}.empty,.loading{text-align:center;padding:30px;color:var(--muted)}@media(max-width:600px){.wrap{padding:12px}h1{font-size:20px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>👨‍⚕️ فهرست مشاوران</h1><span class="muted">مدیریت حرفه‌ای مرکز مشاوره تلفنی روان</span></div><div class="actions"><button class="btn" id="refresh">🔄 به‌روزرسانی</button><a class="btn gray" href="/admin-professional.html">بازگشت به پنل مدیریت</a></div></div><div id="notice" class="notice"></div><section class="card"><div id="list" class="loading">در حال دریافت فهرست مشاوران...</div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://aserkyiwwyggtixckjsv.supabase.co',SB_KEY='sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX',db=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(msg,bad=false){const n=$('notice');n.textContent=msg;n.className='notice'+(bad?' err':'');n.style.display='block'}
async function guard(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace('/admin-login.html?redirect=/consultants-admin.html');return false}const role=sessionStorage.getItem('activeAdminRole')||'super_admin';const {data:ok,error:permissionError}=await db.rpc('has_admin_role_permission',{p_role:role,p_permission:'consultants.manage'});if(permissionError||ok!==true){note('این حساب/نقش دسترسی مشاهده فهرست مشاوران را ندارد.',true);return false}return true}
async function loadConsultants(){const list=$('list');list.className='loading';list.textContent='در حال دریافت فهرست مشاوران...';const r=await db.from('consultants').select('id,name,specialty,bio,is_active,sort_order,education,photo_url,intro_video_url').order('sort_order',{ascending:true}).order('name',{ascending:true});if(r.error){list.className='';list.innerHTML='<div class="notice err" style="display:block">دریافت فهرست مشاوران ناموفق بود: '+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){list.className='empty';list.textContent='هنوز مشاوری ثبت نشده است.';return}list.className='grid';list.innerHTML=rows.map(x=>{const photo=x.photo_url?'<img class="photo" src="'+esc(x.photo_url)+'" alt="'+esc(x.name||'مشاور')+'">':'';return '<article class="consultant">'+photo+'<div class="name">'+esc(x.name||'بدون نام')+'</div><div class="muted">'+esc(x.specialty||'تخصص ثبت نشده')+'</div>'+(x.education?'<p>'+esc(x.education)+'</p>':'')+'<span class="badge '+(x.is_active?'':'off')+'">'+(x.is_active?'فعال':'غیرفعال')+'</span>'+(x.bio?'<p class="muted">'+esc(x.bio)+'</p>':'')+'</article>'}).join('')}
async function start(){if(await guard())await loadConsultants()}$('refresh').onclick=loadConsultants;start();
</script></body></html>
