<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرست مشاوران | پنل مدیریت</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182033;--muted:#6b7280;--line:#e5e7eb;--primary:#5b5bd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}h1{margin:0;font-size:24px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;cursor:pointer;font:inherit;text-decoration:none}.btn.gray{background:#64748b}.btn.red{background:#dc2626}.btn.green{background:#15803d}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 18px #11182708;margin-bottom:16px}.notice{display:none;padding:12px 14px;border-radius:10px;margin-bottom:12px;background:#ecfdf5;color:#166534}.notice.err{background:#fff1f2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.consultant{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.name{font-size:18px;font-weight:700;margin-bottom:6px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.photo{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#f1f5f9}.empty,.loading{text-align:center;padding:30px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field label{display:block;font-size:13px;margin:0 0 6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}.field textarea{min-height:90px;resize:vertical}.formactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.itemactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.itemactions .btn{font-size:13px;padding:8px 12px}@media(max-width:600px){.wrap{padding:12px}h1{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div><h1>👨‍⚕️ فهرست مشاوران</h1><span class="muted">مدیریت حرفه‌ای مرکز مشاوره تلفنی روان</span></div><div class="actions"><button class="btn green" id="add">➕ افزودن مشاور</button><button class="btn" id="refresh">🔄 به‌روزرسانی</button><a class="btn gray" href="/admin-professional.html">بازگشت به پنل مدیریت</a></div></div><div id="notice" class="notice"></div><section class="card" id="editor" hidden><h2 id="formTitle">افزودن مشاور جدید</h2><form id="consultantForm"><input type="hidden" id="cid"><div class="formgrid"><div class="field"><label for="name">نام و نام خانوادگی *</label><input id="name" required maxlength="180"></div><div class="field"><label for="specialty">تخصص</label><input id="specialty" maxlength="250"></div><div class="field"><label for="education">تحصیلات</label><input id="education" maxlength="500"></div><div class="field"><label for="photo">نشانی تصویر (URL)</label><input id="photo" type="url"></div><div class="field"><label for="video">نشانی ویدیوی معرفی (URL)</label><input id="video" type="url"></div><div class="field"><label for="sort">ترتیب نمایش</label><input id="sort" type="number" value="0"></div><div class="field" style="grid-column:1/-1"><label for="bio">معرفی مشاور</label><textarea id="bio" maxlength="5000"></textarea></div><div class="field"><label><input id="active" type="checkbox" checked style="width:auto"> مشاور فعال است</label></div></div><div class="formactions"><button class="btn green" type="submit" id="save">ذخیره اطلاعات</button><button class="btn gray" type="button" id="cancel">انصراف</button></div></form></section><section class="card"><div id="list" class="loading">در حال دریافت فهرست مشاوران...</div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://aserkyiwwyggtixckjsv.supabase.co',SB_KEY='sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX',db=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(msg,bad=false){const n=$('notice');n.textContent=msg;n.className='notice'+(bad?' err':'');n.style.display='block'}
async function guard(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace('/admin-login.html?redirect=/consultants-admin.html');return false}const {data:allowed,error:permissionError}=await db.rpc('has_admin_permission',{p_permission:'consultants.manage'});if(permissionError){note('بررسی مجوز ناموفق بود: '+permissionError.message,true);return false}if(allowed!==true){note('این حساب مجوز مدیریت مشاوران را ندارد.',true);return false}return true}
function openForm(row=null){$('consultantForm').reset();$('cid').value=row?.id||'';$('name').value=row?.name||'';$('specialty').value=row?.specialty||'';$('education').value=row?.education||'';$('photo').value=row?.photo_url||'';$('video').value=row?.intro_video_url||'';$('sort').value=row?.sort_order??0;$('bio').value=row?.bio||'';$('active').checked=row?row.is_active!==false:true;$('formTitle').textContent=row?'ویرایش اطلاعات مشاور':'افزودن مشاور جدید';$('editor').hidden=false;$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function closeForm(){$('editor').hidden=true;$('consultantForm').reset();$('cid').value=''}
async function loadConsultants(){const list=$('list');list.className='loading';list.textContent='در حال دریافت فهرست مشاوران...';const r=await db.from('consultants').select('id,name,specialty,bio,is_active,sort_order,education,photo_url,intro_video_url').order('sort_order',{ascending:true}).order('name',{ascending:true});if(r.error){list.className='';list.innerHTML='<div class="notice err" style="display:block">دریافت فهرست مشاوران ناموفق بود: '+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){list.className='empty';list.textContent='هنوز مشاوری ثبت نشده است.';return}list.className='grid';list.innerHTML=rows.map(x=>{const photo=x.photo_url?'<img class="photo" src="'+esc(x.photo_url)+'" alt="'+esc(x.name||'مشاور')+'">':'';return '<article class="consultant">'+photo+'<div class="name">'+esc(x.name||'بدون نام')+'</div><div class="muted">'+esc(x.specialty||'تخصص ثبت نشده')+'</div>'+(x.education?'<p>'+esc(x.education)+'</p>':'')+'<span class="badge '+(x.is_active?'':'off')+'">'+(x.is_active?'فعال':'غیرفعال')+'</span>'+(x.bio?'<p class="muted">'+esc(x.bio)+'</p>':'')+'<div class="itemactions"><button class="btn" data-edit="'+esc(x.id)+'">✏️ ویرایش</button><button class="btn red" data-delete="'+esc(x.id)+'">🗑 حذف</button></div></article>'}).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(rows.find(x=>String(x.id)===b.dataset.edit)));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteConsultant(b.dataset.delete,rows.find(x=>String(x.id)===b.dataset.delete)?.name||''))}
async function deleteConsultant(id,name){if(!confirm('آیا از حذف مشاور «'+name+'» مطمئن هستید؟ این عملیات قابل بازگشت نیست.'))return;if(!await guard())return;const {error}=await db.from('consultants').delete().eq('id',id);if(error){note('حذف انجام نشد: '+error.message,true);return}note('مشاور حذف شد.');closeForm();await loadConsultants()}
$('consultantForm').addEventListener('submit',async e=>{e.preventDefault();if(!await guard())return;const id=$('cid').value;const payload={name:$('name').value.trim(),specialty:$('specialty').value.trim()||null,education:$('education').value.trim()||null,photo_url:$('photo').value.trim()||null,intro_video_url:$('video').value.trim()||null,sort_order:Number($('sort').value)||0,bio:$('bio').value.trim()||null,is_active:$('active').checked};if(!payload.name){note('نام مشاور الزامی است.',true);return}$('save').disabled=true;const result=id?await db.from('consultants').update(payload).eq('id',id):await db.from('consultants').insert(payload);$('save').disabled=false;if(result.error){note('ذخیره انجام نشد: '+result.error.message,true);return}note(id?'اطلاعات مشاور با موفقیت ویرایش شد.':'مشاور جدید با موفقیت اضافه شد.');closeForm();await loadConsultants()});
$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('refresh').onclick=async()=>{if(await guard())await loadConsultants()};(async()=>{if(await guard())await loadConsultants()})();
</script></body></html>
