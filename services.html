<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت خدمات | مرکز مشاوره تلفنی روان</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f7f8fc;color:#172033;line-height:1.8}.wrap{max-width:1050px;margin:auto;padding:22px 14px 70px}.panel{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:20px;margin-bottom:18px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px;font-family:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.btn{border:0;border-radius:9px;padding:10px 15px;background:#6557d8;color:#fff;cursor:pointer;font-family:inherit}.secondary{background:#eef2ff;color:#4f46e5}.danger{background:#b91c1c}.warning{background:#d97706}.ok{color:#166534;background:#dcfce7;padding:8px;border-radius:8px}.err{color:#b91c1c;background:#fee2e2;padding:8px;border-radius:8px}.item{border:1px solid #e5e7eb;border-radius:13px;padding:15px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.status{font-weight:bold}.active{color:#166534}.inactive{color:#b91c1c}.edit{margin-top:12px;padding:14px;background:#fafaff;border:1px solid #ddd;border-radius:12px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.price{font-size:18px;font-weight:bold}</style></head><body><main class="wrap"><div class="panel"><div class="top"><div><h1>مدیریت خدمات</h1><p>افزودن، ویرایش، فعال/غیرفعال و حذف خدمات سایت</p></div><div><a class="btn secondary" href="/admin.html">بازگشت به پنل مدیریت</a> <a class="btn secondary" href="/" target="_blank">مشاهده سایت</a> <button class="btn danger" id="logout">خروج</button></div></div></div><section id="login" class="panel hidden"><h2>ورود مدیر</h2><input id="email" type="email" value="shabihi@chmail.ir" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button class="btn" id="loginBtn">ورود</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="panel"><h2>افزودن خدمت جدید</h2><div class="grid"><div><label>نام خدمت *</label><input id="name" placeholder="مثلاً مشاوره فردی"></div><div><label>مدت جلسه (دقیقه)</label><input id="duration" type="number" min="1" value="30"></div><div><label>قیمت (تومان)</label><input id="price" type="number" min="0" placeholder="مثلاً 500000"></div><div><label>ترتیب نمایش</label><input id="sort" type="number" value="0"></div></div><label>توضیحات</label><textarea id="description" rows="3" placeholder="توضیح کوتاه درباره خدمت"></textarea><button class="btn" id="add">ثبت خدمت</button><p id="msg"></p></div><div class="panel"><div class="top"><h2>خدمات ثبت‌شده</h2><button class="btn secondary" id="refresh">به‌روزرسانی</button></div><div id="list"></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');async function isAdmin(){const r=await supabase.rpc('is_admin');if(r.error)throw r.error;return r.data===true}async function init(){try{const{data:{session}}=await supabase.auth.getSession();if(session&&await isAdmin()){login.classList.add('hidden');app.classList.remove('hidden');await load()}else login.classList.remove('hidden')}catch(e){login.classList.remove('hidden');loginMsg.textContent=e.message}}loginBtn.onclick=async()=>{loginMsg.textContent='در حال ورود…';const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginMsg.textContent=error.message;return}await init()};logout.onclick=async()=>{await supabase.auth.signOut();location.reload()};refresh.onclick=load;async function load(){list.innerHTML='در حال بارگذاری…';const{data,error}=await supabase.from('services').select('*').order('sort_order').order('created_at');if(error){list.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}list.innerHTML=(data||[]).map(s=>`<div class="item"><div class="top"><div><h3>${esc(s.name)}</h3><span class="status ${s.is_active?'active':'inactive'}">${s.is_active?'● فعال':'● غیرفعال'}</span></div><div class="price">${s.price==null?'قیمت تعیین نشده':Number(s.price).toLocaleString('fa-IR')+' تومان'}</div></div><p>${esc(s.description||'بدون توضیحات')}</p><div>مدت جلسه: ${s.duration_minutes?Number(s.duration_minutes).toLocaleString('fa-IR')+' دقیقه':'تعیین نشده'} · ترتیب: ${Number(s.sort_order||0).toLocaleString('fa-IR')}</div><div class="actions"><button class="btn" data-edit="${s.id}">ویرایش</button><button class="btn ${s.is_active?'warning':''}" data-toggle="${s.id}" data-active="${s.is_active}">${s.is_active?'غیرفعال کردن':'فعال کردن'}</button><button class="btn danger" data-delete="${s.id}" data-name="${esc(s.name)}">حذف</button></div><div id="edit-${s.id}" class="edit hidden"><div class="grid"><div><label>نام خدمت</label><input id="n-${s.id}" value="${esc(s.name)}"></div><div><label>مدت (دقیقه)</label><input id="d-${s.id}" type="number" min="1" value="${s.duration_minutes??30}"></div><div><label>قیمت (تومان)</label><input id="p-${s.id}" type="number" min="0" value="${s.price??''}"></div><div><label>ترتیب</label><input id="o-${s.id}" type="number" value="${s.sort_order??0}"></div></div><label>توضیحات</label><textarea id="x-${s.id}" rows="3">${esc(s.description||'')}</textarea><button class="btn" data-save="${s.id}">ذخیره تغییرات</button> <button class="btn secondary" data-close="${s.id}">انصراف</button><p id="m-${s.id}"></p></div></div>`).join('')||'هنوز خدمتی ثبت نشده است.';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>$(('edit-'+b.dataset.edit)).classList.toggle('hidden'));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(('edit-'+b.dataset.close)).classList.add('hidden'));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const next=b.dataset.active!=='true';const{error}=await supabase.from('services').update({is_active:next,updated_at:new Date().toISOString()}).eq('id',b.dataset.toggle);if(error)alert(error.message);else load()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('خدمت «'+b.dataset.name+'» حذف شود؟ این عملیات قابل برگشت نیست.'))return;const{error}=await supabase.from('services').delete().eq('id',b.dataset.delete);if(error)alert('حذف انجام نشد: '+error.message);else load()})}async function save(id){const m=$('m-'+id);try{m.className='';m.textContent='در حال ذخیره…';const n=$('n-'+id).value.trim();if(!n){m.className='err';m.textContent='نام خدمت الزامی است.';return}const{error}=await supabase.from('services').update({name:n,description:$('x-'+id).value.trim()||null,duration_minutes:Number($('d-'+id).value)||null,price:$('p-'+id).value===''?null:Number($('p-'+id).value),sort_order:Number($('o-'+id).value)||0,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await load()}catch(e){m.className='err';m.textContent=e.message}}add.onclick=async()=>{try{const n=name.value.trim();if(!n){msg.className='err';msg.textContent='نام خدمت الزامی است.';return}msg.className='';msg.textContent='در حال ثبت…';const{error}=await supabase.from('services').insert({name:n,description:description.value.trim()||null,duration_minutes:Number(duration.value)||null,price:price.value===''?null:Number(price.value),sort_order:Number(sort.value)||0,is_active:true});if(error)throw error;msg.className='ok';msg.textContent='خدمت با موفقیت ثبت شد.';name.value='';description.value='';price.value='';duration.value=30;sort.value=0;await load()}catch(e){msg.className='err';msg.textContent=e.message}}init();</script></body></html>
