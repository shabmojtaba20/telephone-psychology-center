<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعلام گواهی کارگاه</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:620px;margin:70px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d7dce5;border-radius:12px;margin:10px 0;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#172554;color:#fff;cursor:pointer;font-size:15px}.result{margin-top:18px;padding:18px;border-radius:14px;background:#f8fafc;line-height:2}.ok{border:1px solid #86efac}.bad{border:1px solid #fecaca}</style></head><body><main class="wrap"><section class="card"><h1>🎓 استعلام گواهی کارگاه</h1><p>شماره گواهی را وارد کنید تا اعتبار آن از سامانه مرکز بررسی شود.</p><input id="code" placeholder="مثلاً WS-2026-XXXXXXXXXX" autocomplete="off"><button class="btn" id="verify">استعلام گواهی</button><div id="result"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));document.getElementById('verify').onclick=async()=>{const code=document.getElementById('code').value.trim();const out=document.getElementById('result');if(!code){out.innerHTML='<div class="result bad">شماره گواهی را وارد کنید.</div>';return}out.innerHTML='<div class="result">در حال بررسی...</div>';const {data,error}=await db.rpc('verify_workshop_certificate',{p_certificate_number:code});if(error)return out.innerHTML='<div class="result bad">خطا در استعلام گواهی.</div>';const r=data?.[0];if(!r)return out.innerHTML='<div class="result bad">گواهی معتبری با این شماره پیدا نشد.</div>';out.innerHTML='<div class="result ok"><b>✅ گواهی معتبر است</b><br>شرکت‌کننده: '+esc(r.participant_name)+'<br>کارگاه: '+esc(r.workshop_title)+'<br>مدرس: '+esc(r.instructor_name||'-')+'<br>تاریخ کارگاه: '+new Date(r.workshop_date).toLocaleDateString('fa-IR')+'<br>تاریخ صدور: '+new Date(r.issued_at).toLocaleDateString('fa-IR')+'<br>شماره گواهی: '+esc(r.certificate_number)+'</div>'};</script></body></html>
