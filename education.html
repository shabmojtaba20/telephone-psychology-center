<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطالب آموزشی و کارگاه‌ها | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f6f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.alt{background:#eef2ff;color:#4f46e5}.hero{background:linear-gradient(135deg,#5b5bd6,#7c3aed);color:#fff;padding:28px;border-radius:20px;margin:18px 0}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.tab.active{background:#5b5bd6;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 5px 18px #1118270b}.price{font-weight:700;margin:12px 0}.muted{color:#667085;font-size:13px}.section{display:none}.section.active{display:block}.badge{display:inline-block;background:#ecfdf3;color:#15803d;border-radius:999px;padding:4px 8px;font-size:11px}.badge.paid{background:#fff7ed;color:#c2410c}.danger{background:#fff1f2;color:#be123c}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><h1>📚 مطالب آموزشی و کارگاه‌ها</h1><div><button class="btn alt" onclick="location.href='/'">سایت</button><button class="btn" onclick="location.href='/admin.html'">پنل مدیریت</button></div></div><div class="hero"><h2>یادگیری، رشد و ارتباط حرفه‌ای</h2><p>فایل‌های آموزشی و کارگاه‌های آنلاین مرکز مشاوره تلفنی روان.</p></div><div class="tabs"><button class="tab active" data-tab="contents">📚 مطالب آموزشی</button><button class="tab" data-tab="workshops">🎓 کارگاه‌ها</button></div><section id="contents" class="section active"><div id="contentGrid" class="grid"></div></section><section id="workshops" class="section"><div id="workshopGrid" class="grid"></div></section><p id="msg" class="muted"></p></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});async function init(){const[{data:c,error:ce},{data:w,error:we}]=await Promise.all([db.from('educational_contents').select('id,title,description,access_type,price,content_type').eq('is_published',true).order('created_at',{ascending:false}),db.from('workshops').select('id,title,description,starts_at,access_type,price,meeting_type,max_participants,status').in('status',['scheduled','live']).order('starts_at')]);if(ce||we){$('msg').textContent='خطا در دریافت اطلاعات. لطفاً دوباره تلاش کنید.';return}renderContents(c||[]);renderWorkshops(w||[])}function money(n){return Number(n||0).toLocaleString('fa-IR')+' تومان'}function renderContents(rows){$('contentGrid').innerHTML=rows.length?rows.map(x=>`<article class="card"><span class="badge ${x.access_type==='paid'?'paid':''}">${x.access_type==='paid'?'فروشی':'رایگان'}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'')}</p><div class="price">${x.access_type==='paid'?money(x.price):'بدون هزینه'}</div><button class="btn" onclick="openContent('${x.id}')">${x.access_type==='paid'?'خرید / دریافت':'دریافت فایل'}</button></article>`).join(''):'<div class="card">هنوز مطلب آموزشی منتشر نشده است.</div>'}function renderWorkshops(rows){$('workshopGrid').innerHTML=rows.length?rows.map(x=>`<article class="card"><span class="badge ${x.access_type==='paid'?'paid':''}">${x.meeting_type==='video'?'🎥 تصویری':'🎙️ صوتی'} · ${x.access_type==='paid'?money(x.price):'رایگان'}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'')}</p><p>🗓 ${new Date(x.starts_at).toLocaleString('fa-IR')}</p><p class="muted">${x.max_participants?`ظرفیت: ${Number(x.max_participants).toLocaleString('fa-IR')} نفر`:''}</p><button class="btn" onclick="joinWorkshop('${x.id}')">ثبت‌نام / ورود</button></article>`).join(''):'<div class="card">کارگاه فعالی وجود ندارد.</div>'}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}window.openContent=async id=>{const{data:{session}}=await db.auth.getSession();if(!session){alert('برای دریافت یا خرید فایل ابتدا وارد حساب کاربری شوید.');location.href='/';return}const{data:c,error}=await db.from('educational_contents').select('id,title,access_type,price,file_path,is_published').eq('id',id).single();if(error||!c||!c.is_published){alert('مطلب پیدا نشد.');return}if(c.access_type==='free'){const{data,error:e}=await db.storage.from('educational-files').createSignedUrl(c.file_path,600);if(e){alert('دریافت فایل ممکن نیست.');return}location.href=data.signedUrl;return}const{data:p}=await db.from('educational_purchases').select('status').eq('content_id',id).eq('user_id',session.user.id).maybeSingle();if(p?.status==='paid'){const{data,error:e}=await db.storage.from('educational-files').createSignedUrl(c.file_path,600);if(e){alert('لینک امن فایل ساخته نشد.');return}location.href=data.signedUrl;return}try{const r=await fetch(db.supabaseUrl+'/functions/v1/education-zarinpal-request',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX','Content-Type':'application/json'},body:JSON.stringify({kind:'content',id})});const j=await r.json();if(!r.ok||!j.payment_url)throw new Error(j.error||'خطا در ایجاد پرداخت');location.href=j.payment_url}catch(e){alert(e.message)}};window.joinWorkshop=async id=>{const{data:{session}}=await db.auth.getSession();if(!session){alert('برای ثبت‌نام باید وارد حساب شوید.');location.href='/';return}const{data:w,error}=await db.from('workshops').select('id,access_type,status,max_participants').eq('id',id).single();if(error||!w){alert('کارگاه پیدا نشد.');return}if(!['scheduled','live'].includes(w.status)){alert('ثبت‌نام این کارگاه فعال نیست.');return}const{count}=await db.from('workshop_registrations').select('id',{count:'exact',head:true}).eq('workshop_id',id).in('payment_status',['free','paid']);if(w.max_participants&&Number(count||0)>=Number(w.max_participants)){const{data:mine}=await db.from('workshop_registrations').select('id,payment_status').eq('workshop_id',id).eq('user_id',session.user.id).maybeSingle();if(!mine){alert('ظرفیت این کارگاه تکمیل شده است.');return}}if(w.access_type==='free'){const{error:e}=await db.from('workshop_registrations').upsert({workshop_id:id,user_id:session.user.id,amount:0,payment_status:'free'},{onConflict:'workshop_id,user_id'});if(e){alert('ثبت‌نام انجام نشد.');return}location.href='/workshop-room.html?workshop='+encodeURIComponent(id);return}try{const r=await fetch(db.supabaseUrl+'/functions/v1/education-zarinpal-request',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX','Content-Type':'application/json'},body:JSON.stringify({kind:'workshop',id})});const j=await r.json();if(!r.ok||!j.payment_url)throw new Error(j.error||'خطا در ایجاد پرداخت');location.href=j.payment_url}catch(e){alert(e.message)}};init()</script></body></html>
