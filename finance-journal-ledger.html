<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر روزنامه و دفتر کل</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:1500px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}.head,.filters{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#4f46e5;color:white;padding:10px 14px;font:inherit;cursor:pointer}.gray{background:#64748b}.green{background:#15803d}input,select{padding:9px;border:1px solid #d6dbe5;border-radius:8px;font:inherit}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:right}.table{overflow:auto}.muted{font-size:13px;color:#667085}.notice{display:none;padding:10px;border-radius:9px;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}@media print{.no-print{display:none!important}.card{break-inside:avoid}}</style></head><body><div class="wrap">
<section class="card no-print"><div class="head"><div><h1>📚 دفتر روزنامه و دفتر کل</h1><div class="muted">گزارش رسمی بر مبنای اسناد حسابداری ثبت و تأییدشده</div></div><div><button class="btn" onclick="load()">بروزرسانی</button><button class="btn green" onclick="xlsx()">Excel</button><button class="btn gray" onclick="print()">چاپ / PDF</button><a class="btn gray" href="/finance-formal-reports.html">گزارش‌های رسمی</a></div></div></section>
<section class="card no-print"><div class="filters"><label>از <input id="from" type="date"></label><label>تا <input id="to" type="date"></label><label>حساب <select id="account"><option value="">همه حساب‌ها</option></select></label><button class="btn" onclick="load()">اعمال</button></div></section><div id="notice" class="notice"></div>
<section class="card"><h2>🧾 دفتر روزنامه</h2><div class="table"><table><thead><tr><th>شماره سند</th><th>تاریخ</th><th>کد حساب</th><th>حساب</th><th>سطح</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مرجع</th></tr></thead><tbody id="journal"></tbody></table></div></section>
<section class="card"><h2>📖 دفتر کل</h2><div class="table"><table><thead><tr><th>کد</th><th>حساب</th><th>شماره سند</th><th>تاریخ</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مانده تجمعی</th></tr></thead><tbody id="ledger"></tbody></table></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let last={journal:[],ledger:[]};
function note(t,e=false){$('notice').textContent=t;$('notice').className='notice '+(e?'err':'');$('notice').style.display='block'}
async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html?redirect=/finance-journal-ledger.html');return false}const r=await db.rpc('has_admin_permission',{p_permission:'finance.view'});if(r.error||r.data!==true){note('این حساب دسترسی گزارش مالی ندارد.',true);return false}return true}
async function accounts(){const r=await db.from('finance_accounts').select('id,account_code,account_name,account_level').order('account_code');if(!r.error)$('account').innerHTML='<option value="">همه حساب‌ها</option>'+r.data.map(a=>'<option value="'+a.id+'">'+esc(a.account_code)+' - '+esc(a.account_name)+' (سطح '+a.account_level+')</option>').join('')}
function q(){return{p_from:$('from').value||null,p_to:$('to').value||null,p_account_id:$('account').value||null}}
async function load(){if(!(await guard()))return;const r=await db.rpc('get_finance_journal_ledger_report',q());if(r.error){note(r.error.message,true);return}last=r.data||{};$('journal').innerHTML=(last.journal||[]).map(x=>'<tr><td>'+x.document_no+'</td><td>'+x.document_date+'</td><td>'+esc(x.account_code)+'</td><td>'+esc(x.account_name)+'</td><td>'+x.account_level+'</td><td>'+esc(x.line_description||x.document_description)+'</td><td>'+money(x.debit)+'</td><td>'+money(x.credit)+'</td><td>'+esc(x.reference||x.reference_type)+'</td></tr>').join('')||'<tr><td colspan="9">داده‌ای وجود ندارد.</td></tr>';$('ledger').innerHTML=(last.ledger||[]).map(x=>'<tr><td>'+esc(x.account_code)+'</td><td>'+esc(x.account_name)+'</td><td>'+x.document_no+'</td><td>'+x.document_date+'</td><td>'+esc(x.line_description||x.document_description)+'</td><td>'+money(x.debit)+'</td><td>'+money(x.credit)+'</td><td>'+money(x.running_balance)+'</td></tr>').join('')||'<tr><td colspan="8">داده‌ای وجود ندارد.</td></tr>'}
function xlsx(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(last.journal||[]),'دفتر روزنامه');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(last.ledger||[]),'دفتر کل');XLSX.writeFile(wb,'journal-ledger.xlsx')}
(async()=>{if(await guard()){await accounts();await load()}})();
</script></body></html>
