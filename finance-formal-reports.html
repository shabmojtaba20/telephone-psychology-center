<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش‌های رسمی مالی</title><style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#4f46e5;color:#fff;padding:10px 14px;cursor:pointer;font:inherit}.gray{background:#64748b}.green{background:#15803d}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters label{font-size:13px}.filters input,.filters select{display:block;margin-top:5px;padding:9px;border:1px solid #d6dbe5;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{display:none;padding:10px;border-radius:9px;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}.table{overflow:auto}.total{font-weight:bold}.muted{color:#667085;font-size:13px}.balance-ok{color:#15803d}.balance-bad{color:#b91c1c}@media(max-width:800px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;break-inside:avoid}h1{font-size:20px}}</style></head><body><div class="wrap">
<section class="card no-print"><div class="head"><div><h1>📑 گزارش‌های رسمی مالی</h1><div class="muted">ترازنامه، صورت سود و زیان و تراز آزمایشی کل/معین/تفصیلی</div></div><div><button class="btn" onclick="load()">🔄 بروزرسانی</button> <button class="btn green" onclick="excel()">📊 Excel</button> <button class="btn gray" onclick="window.print()">🖨️ چاپ / PDF</button> <a class="btn gray" href="/finance-advanced.html">بازگشت</a></div></div></section>
<section class="card no-print"><div class="filters"><label>از تاریخ<input id="from" type="date"></label><label>تا تاریخ<input id="to" type="date"></label><label>سطح گزارش<select id="level"><option value="1">کل</option><option value="2">معین</option><option value="3">تفصیلی</option></select></label><button class="btn" onclick="load()">اعمال</button></div><p class="muted">مبنای گزارش فقط اسناد حسابداری با وضعیت posted است.</p></section>
<div id="notice" class="notice"></div>
<section class="card"><h2>⚖️ تراز آزمایشی</h2><div class="table"><table><thead><tr><th>کد</th><th>حساب</th><th>نوع</th><th>بدهکار دوره</th><th>بستانکار دوره</th><th>مانده پایان</th></tr></thead><tbody id="trial"></tbody></table></div></section>
<section class="grid"><div class="card"><h2>📈 صورت سود و زیان</h2><div id="pl"></div></div><div class="card"><h2>🏦 ترازنامه</h2><div id="bs"></div></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function note(t,e=false){$('notice').textContent=t;$('notice').className='notice '+(e?'err':'');$('notice').style.display='block'}
async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html?redirect=/finance-formal-reports.html');return false}const r=await db.rpc('has_admin_permission',{p_permission:'finance.view'});if(r.error||r.data!==true){note('این حساب دسترسی گزارش مالی ندارد.',true);return false}return true}
function q(){return{p_from:$('from').value||null,p_to:$('to').value||null,p_level:Number($('level').value)}}
function rows(a){return (a||[]).map(x=>'<tr><td>'+esc(x.account_code)+'</td><td>'+esc(x.account_name)+'</td><td>'+esc({asset:'دارایی',liability:'بدهی',equity:'حقوق مالکانه',income:'درآمد',expense:'هزینه'}[x.account_type]||x.account_type)+'</td><td>'+money(x.period_debit)+'</td><td>'+money(x.period_credit)+'</td><td>'+money(x.closing_balance)+'</td></tr>').join('')}
async function load(){if(!(await guard()))return;const r=await db.rpc('get_finance_formal_reports',q());if(r.error){note('دریافت گزارش ناموفق بود: '+r.error.message,true);return}const d=r.data||{},tb=d.trial_balance||[],pl=d.profit_loss||{},bs=d.balance_sheet||{};$('trial').innerHTML=tb.length?rows(tb):'<tr><td colspan="6">داده‌ای وجود ندارد.</td></tr>';
const list=(title,a,field)=>'<h3>'+title+'</h3><table><thead><tr><th>کد</th><th>حساب</th><th>مبلغ</th></tr></thead><tbody>'+((a||[]).map(x=>'<tr><td>'+esc(x.account_code)+'</td><td>'+esc(x.account_name)+'</td><td>'+money(Math.abs(x.period_balance))+' تومان</td></tr>').join('')||'<tr><td colspan="3">موردی ثبت نشده است.</td></tr>')+'</tbody></table>';
$('pl').innerHTML=list('درآمدها',pl.income,'income')+list('هزینه‌ها',pl.expense,'expense')+'<p class="total">درآمد: '+money(pl.total_income)+' تومان</p><p class="total">هزینه: '+money(pl.total_expense)+' تومان</p><p class="total">سود / زیان خالص: '+money(pl.net_profit)+' تومان</p>';
$('bs').innerHTML=list('دارایی‌ها',bs.assets,'asset')+list('بدهی‌ها',bs.liabilities,'liability')+list('حقوق مالکانه',bs.equity,'equity')+'<p class="total">سود/زیان جاری: '+money(bs.current_profit)+' تومان</p><p class="total">جمع دارایی‌ها: '+money(bs.total_assets)+' تومان</p><p class="total">جمع بدهی و حقوق مالکانه: '+money(Number(bs.total_liabilities)+Number(bs.total_equity))+' تومان</p>';
}
async function excel(){if(!(await guard()))return;const r=await db.rpc('get_finance_formal_reports',q());if(r.error){note('خروجی آماده نشد.',true);return}const d=r.data||{},tb=d.trial_balance||[],pl=d.profit_loss||{},bs=d.balance_sheet||{};const data=[['گزارش‌های رسمی مالی'],['سطح', $('level').selectedOptions[0].text],[],['تراز آزمایشی'],['کد','حساب','نوع','بدهکار دوره','بستانکار دوره','مانده پایان'],...tb.map(x=>[x.account_code,x.account_name,x.account_type,x.period_debit,x.period_credit,x.closing_balance]),[],['صورت سود و زیان'],['درآمد کل',pl.total_income],['هزینه کل',pl.total_expense],['سود/زیان',pl.net_profit],[],['ترازنامه'],['دارایی‌ها',bs.total_assets],['بدهی‌ها',bs.total_liabilities],['حقوق مالکانه + سود جاری',bs.total_equity]];const csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='formal-financial-reports.csv';a.click();URL.revokeObjectURL(a.href)}
load();
</script></body></html>
