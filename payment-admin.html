<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت کارت‌به‌کارت | پنل مدیریت</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f7f8fc;color:#172033;line-height:1.9}.wrap{max-width:1050px;margin:auto;padding:24px 15px 70px}.panel,.item{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px;font-family:inherit}.btn{border:0;border-radius:9px;padding:10px 15px;background:#6557d8;color:#fff;cursor:pointer;font-family:inherit}.danger{background:#b91c1c}.secondary{background:#eef2ff;color:#4f46e5}.ok{color:#166534;background:#dcfce7;padding:8px;border-radius:8px}.err{color:#b91c1c;background:#fee2e2;padding:8px;border-radius:8px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{font-size:12px;color:#667085}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#fff7ed;color:#9a3412}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}</style></head><body><main class="wrap"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>مدیریت پرداخت کارت‌به‌کارت</h1><p>تنظیم اطلاعات کارت و بررسی رسیدهای کاربران</p></div><div><a class="btn secondary" href="/admin.html">بازگشت به پنل مدیریت</a> <button class="btn danger" id="logout">خروج</button></div></div></div><section id="login" class="panel hidden"><h2>ورود مدیر</h2><input id="email" type="email" value="shabihi@chmail.ir"><input id="password" type="password" placeholder="رمز عبور"><button class="btn" id="loginBtn">ورود</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="panel"><h2>اطلاعات کارت مرکز</h2><div class="grid"><div><label>نام بانک</label><input id="bank"></div><div><label>شماره کارت</label><input id="card" inputmode="numeric" placeholder="۱۶ رقم"></div><div><label>نام صاحب کارت</label><input id="holder"></div></div><label>راهنمای پرداخت</label><textarea id="instructions" rows="3" placeholder="مثلاً پس از کارت‌به‌کارت، رسید را در سایت ارسال کنید."></textarea><button class="btn" id="saveSettings">ذخیره و فعال‌سازی کارت‌به‌کارت</button><p id="settingsMsg"></p></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>رسیدهای ارسالی</h2><button class="btn secondary" id="refresh">به‌روزرسانی</button></div><div id="receipts"></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id);async function isAdmin(){const r=await s.rpc('is_admin');if(r.error)throw r.error;return r.data===true}async function init(){try{const{data:{session}}=await s.auth.getSession();if(session&&await isAdmin()){login.classList.add('hidden');app.classList.remove('hidden');await loadSettings();await loadReceipts()}else login.classList.remove('hidden')}catch(e){login.classList.remove('hidden');loginMsg.textContent=e.message}}loginBtn.onclick=async()=>{loginMsg.textContent='در حال ورود…';const{error}=await s.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return loginMsg.textContent=error.message;await init()};logout.onclick=async()=>{await s.auth.signOut();location.reload()};async function loadSettings(){const{data,error}=await s.from('card_payment_settings').select('*').eq('id',1).maybeSingle();if(error)return settingsMsg.textContent=error.message;if(data){bank.value=data.bank_name||'';card.value=data.card_number||'';holder.value=data.card_holder||'';instructions.value=data.instructions||''}}saveSettings.onclick=async()=>{settingsMsg.textContent='در حال ذخیره…';const num=card.value.replace(/\D/g,'');if(num.length!==16){settingsMsg.className='err';settingsMsg.textContent='شماره کارت باید ۱۶ رقم باشد.';return}const{error}=await s.from('card_payment_settings').upsert({id:1,bank_name:bank.value.trim(),card_number:num,card_holder:holder.value.trim(),instructions:instructions.value.trim()||null,is_active:true});settingsMsg.className=error?'err':'ok';settingsMsg.textContent=error?error.message:'کارت‌به‌کارت با موفقیت فعال شد.'};async function loadReceipts(){receipts.textContent='در حال دریافت رسیدها…';const{data,error}=await s.from('payment_receipts').select('id,appointment_id,user_id,amount,status,receipt_path,submitted_at,admin_note,appointments(scheduled_at,status,services(name),consultants(name))').order('submitted_at',{ascending:false});if(error){receipts.innerHTML='<p class="err">'+error.message+'</p>';return}receipts.innerHTML=(data||[]).map(r=>{const a=r.appointments||{};const st=r.status==='approved'?'تأیید شده':r.status==='rejected'?'رد شده':'در انتظار بررسی';return `<div class="item"><div><b>${a.services?.name||'خدمت'}</b> — ${a.consultants?.name||'مشاور'}</div><div>مبلغ: <b>${Number(r.amount).toLocaleString('fa-IR')} تومان</b></div><div>زمان نوبت: ${new Date(a.scheduled_at).toLocaleString('fa-IR')}</div><div>ارسال رسید: ${new Date(r.submitted_at).toLocaleString('fa-IR')}</div><div>وضعیت: <span class="badge ${r.status}">${st}</span></div><div class="actions"><button class="btn secondary" data-view="${r.id}" data-path="${r.receipt_path}">مشاهده رسید</button>${r.status==='pending'?`<button class="btn" data-approve="${r.id}" data-appointment="${r.appointment_id}">تأیید پرداخت</button><button class="btn danger" data-reject="${r.id}" data-appointment="${r.appointment_id}">رد رسید</button>`:''}</div><div id="note-${r.id}" class="hint">${r.admin_note||''}</div></div>`}).join('')||'هنوز رسیدی ارسال نشده است.';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{const{data,error}=await s.storage.from('payment-receipts').createSignedUrl(b.dataset.path,600);if(error)alert(error.message);else window.open(data.signedUrl,'_blank')});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,b.dataset.appointment,'approved'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>review(b.dataset.reject,b.dataset.appointment,'rejected'))}async function review(receiptId,appointmentId,status){const note=prompt(status==='approved'?'یادداشت اختیاری برای تأیید:':'علت رد رسید را وارد کنید:','');if(status==='rejected'&&!note)return;if(!confirm(status==='approved'?'پرداخت این رسید تأیید شود و نوبت قطعی شود؟':'رسید رد شود؟'))return;const{data:{user}}=await s.auth.getUser();const{error:e1}=await s.from('payment_receipts').update({status,admin_note:note||null,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',receiptId);if(e1)return alert(e1.message);const{error:e2}=await s.from('appointments').update({payment_status:status==='approved'?'paid':'failed',status:status==='approved'?'confirmed':'pending',payment_gateway:'card_transfer',paid_at:status==='approved'?new Date().toISOString():null}).eq('id',appointmentId);if(e2)return alert('رسید تغییر کرد اما وضعیت نوبت به‌روزرسانی نشد: '+e2.message);await loadReceipts()}refresh.onclick=loadReceipts;init();</script></body></html>
