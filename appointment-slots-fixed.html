<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت زمان‌های نوبت</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:10px;padding:10px 15px;background:#4f46e5;color:#fff;cursor:pointer;font:inherit}.btn.red{background:#dc2626}.btn.gray{background:#64748b}label{display:block;font-size:13px;margin:7px 0}input,select{width:100%;box-sizing:border-box;border:1px solid #d9dee8;border-radius:10px;padding:10px;margin:5px 0 12px;background:#fff;font:inherit}.muted{color:#6b7280;font-size:13px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0;background:#fff}.date{font-weight:800;color:#4338ca}.msg{padding:10px;border-radius:10px;background:#ecfdf5;color:#166534;margin:10px 0}.err{background:#fff1f2;color:#9f1239}.calendar{border:1px solid #e5e7eb;border-radius:16px;background:#fff;padding:14px;margin:5px 0 14px}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.cal-head strong{font-size:17px}.cal-nav{border:1px solid #d9dee8;background:#f8fafc;border-radius:9px;padding:7px 10px;cursor:pointer;font:inherit}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:#64748b;padding:4px}.day{border:1px solid #edf0f5;background:#fff;border-radius:9px;min-height:42px;cursor:pointer;font:inherit}.day:hover{background:#eef2ff}.day.muted-day{visibility:hidden}.day.disabled{color:#cbd5e1;background:#f8fafc;cursor:not-allowed}.day.selected{background:#4f46e5;color:#fff;border-color:#4f46e5;font-weight:800}.selected-date{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:9px 12px;margin:-2px 0 12px;font-weight:700}@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.day{min-height:38px;font-size:12px}.cal-head strong{font-size:14px}.cal-nav{padding:6px 8px;font-size:12px}}</style></head><body><main class="wrap"><div class="card"><h1>📅 مدیریت نوبت‌های از پیش تعیین‌شده</h1><p class="muted">تاریخ را فقط از تقویم هجری شمسی انتخاب کنید. با ثبت یک بازه مثل ۱۴:۰۰ تا ۱۸:۳۰، سیستم آن را خودکار به ۹ جلسه ۳۰ دقیقه‌ای قابل رزرو تبدیل می‌کند.</p><button class="btn gray" onclick="location.href='/admin-professional.html'">بازگشت به پنل مدیریت</button></div><div id="msg"></div><div class="card"><h2>ثبت زمان جدید</h2><div class="grid"><label>مشاور<select id="consultant"></select></label><div><label>تاریخ شمسی</label><div class="calendar"><div class="cal-head"><button class="cal-nav" id="prevMonth" type="button">‹ ماه قبل</button><strong id="monthTitle"></strong><button class="cal-nav" id="nextMonth" type="button">ماه بعد ›</button></div><div class="week"><div>شنبه</div><div>یکشنبه</div><div>دوشنبه</div><div>سه‌شنبه</div><div>چهارشنبه</div><div>پنجشنبه</div><div>جمعه</div></div><div class="days" id="days"></div></div><div id="selectedDate" class="selected-date">هنوز تاریخی انتخاب نشده است.</div><input id="jalaliDate" type="hidden"></div><label>ساعت شروع<input id="start" type="time"></label><label>ساعت پایان<input id="end" type="time"></label></div><button class="btn" id="save">ثبت زمان قابل رزرو</button></div><div class="card"><h2>زمان‌های ثبت‌شده</h2><div id="list"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];function jToG(jy,jm,jd){jy=Number(jy)-979;jm=Number(jm);jd=Number(jd);let days=365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=1600+400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor((days-1)/36524);days=(days-1)%36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1,leap=(gy%4===0&&gy%100!==0)||gy%400===0,md=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31],gm=1;while(gd>md[gm-1]){gd-=md[gm-1];gm++}return`${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}function gToJ(gy,gm,gd){const dt=new Date(Date.UTC(gy,gm-1,gd)),p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dt),o={};p.forEach(x=>o[x.type]=x.value);return{y:Number(o.year),m:Number(o.month),d:Number(o.day)}}function jDays(y,m){if(m<=6)return 31;if(m<=11)return 30;return[1,5,9,13,17,22,26,30].includes((y+12)%33)?30:29}function jLabel(y,m,d){return`${Number(y).toLocaleString('fa-IR')} ${MONTHS[m-1]} ${Number(d).toLocaleString('fa-IR')}`}function renderCalendar(){const{y,m}=cal,first=new Date(jToG(y,m,1)+'T00:00:00Z'),weekday=(first.getUTCDay()+1)%7;$('#monthTitle').textContent=`${y.toLocaleString('fa-IR')} / ${m.toLocaleString('fa-IR')} — ${MONTHS[m-1]}`;let html='';for(let i=0;i<weekday;i++)html+='<button class="day muted-day" tabindex="-1"></button>';const max=jDays(y,m),today=new Date();today.setHours(0,0,0,0);for(let d=1;d<=max;d++){const key=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`,iso=jToG(y,m,d),day=new Date(iso+'T00:00:00'),disabled=day<today,selected=$('jalaliDate').value===key;html+=`<button type="button" class="day ${disabled?'disabled':''} ${selected?'selected':''}" ${disabled?'disabled':''} data-j="${key}">${d.toLocaleString('fa-IR')}</button>`}$('#days').innerHTML=html;document.querySelectorAll('.day[data-j]').forEach(b=>b.onclick=()=>{const v=b.dataset.j,p=v.split('/');$('#jalaliDate').value=v;$('#selectedDate').textContent='تاریخ انتخاب‌شده: '+jLabel(p[0],Number(p[1]),Number(p[2]));renderCalendar()})}const now=new Date(),nowJ=gToJ(now.getUTCFullYear(),now.getUTCMonth()+1,now.getUTCDate());let cal={y:nowJ.y,m:nowJ.m};$('#prevMonth').onclick=()=>{if(--cal.m<1){cal.m=12;cal.y--}renderCalendar()};$('#nextMonth').onclick=()=>{if(++cal.m>12){cal.m=1;cal.y++}renderCalendar()};async function guard(){const{data}=await db.auth.getSession();if(!data.session){location.replace('/admin.html');return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){await db.auth.signOut();location.replace('/admin.html');return false}return true}function note(t,bad=false){$('#msg').className=bad?'msg err':'msg';$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',4000)}async function load(){const c=await db.from('consultants').select('id,name').eq('is_active',true).order('sort_order');if(c.error)return note(c.error.message,true);$('#consultant').innerHTML='<option value="">انتخاب مشاور</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const r=await db.from('consultant_slots').select('id,consultant_id,slot_date,start_time,end_time,is_active,consultants(name)').order('slot_date').order('start_time');if(r.error)return note(r.error.message,true);$('#list').innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<div class="item"><div class="date">${esc(new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date(x.slot_date+'T00:00:00Z')))}</div><b>${esc(x.consultants?.name||'')}</b> — ${esc(String(x.start_time).slice(0,5))} تا ${esc(String(x.end_time).slice(0,5))} — ${x.is_active?'فعال':'غیرفعال'} <button class="btn red" data-del="${x.id}">حذف</button></div>`).join(''):'<p class="muted">زمانی ثبت نشده است.</p>'}$('#save').onclick=async()=>{const cid=$('#consultant').value,j=$('#jalaliDate').value,st=$('#start').value,en=$('#end').value;if(!cid||!j||!st||!en)return note('مشاور، تاریخ شمسی و ساعت شروع/پایان را کامل کنید.',true);const p=j.split('/');if(p.length!==3)return note('تاریخ انتخاب‌شده صحیح نیست.',true);const gd=jToG(p[0],p[1],p[2]);if(!gd||en<=st)return note('تاریخ یا بازه زمانی صحیح نیست.',true);const a=st.split(':').map(Number),b=en.split(':').map(Number),count=((b[0]*60+b[1])-(a[0]*60+a[1]))/30;const r=await db.rpc('admin_save_consultant_slot',{p_id:null,p_consultant_id:cid,p_slot_date:gd,p_start_time:st,p_end_time:en,p_is_active:true});if(r.error)return note(r.error.message,true);note(`${Number(count).toLocaleString('fa-IR')} جلسه ۳۰ دقیقه‌ای برای این روز ایجاد شد.`);$('#jalaliDate').value='';$('#selectedDate').textContent='هنوز تاریخی انتخاب نشده است.';$('#start').value='';$('#end').value='';renderCalendar();load()};$('#list').onclick=async e=>{const id=e.target.dataset.del;if(!id)return;if(!confirm('این جلسه حذف شود؟'))return;const r=await db.rpc('admin_delete_consultant_slot',{p_id:id});if(r.error)return note(r.error.message,true);note('جلسه حذف شد.');load()};if(await guard()){renderCalendar();load()}</script></body></html>
