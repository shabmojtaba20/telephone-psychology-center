<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اطلاعات پرداخت | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:35px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f8f9ff;border-radius:12px;padding:14px}.label{color:#667085;font-size:13px}.value{font-size:18px;font-weight:700;margin-top:4px;word-break:break-word}.gateway{display:inline-block;background:#eef2ff;color:#3730a3;padding:8px 12px;border-radius:10px;margin:4px}.muted{color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1 id="title">اطلاعات پرداخت</h1><p class="muted">اطلاعات رسمی پرداخت مرکز را از این صفحه مشاهده کنید.</p></div><div id="bank" class="card"><h2>🏦 اطلاعات حساب مرکز</h2><div class="grid"><div class="item"><div class="label">بانک</div><div id="bank_name" class="value">—</div></div><div class="item"><div class="label">شماره حساب</div><div id="account" class="value">—</div></div><div class="item"><div class="label">شماره شبا</div><div id="iban" class="value">—</div></div><div class="item"><div class="label">شماره کارت مرکز</div><div id="card" class="value">—</div></div><div class="item"><div class="label">صاحب حساب/کارت</div><div id="holder" class="value">—</div></div></div><p id="notes" class="muted"></p></div><div class="card"><h2>💳 درگاه‌های پرداخت الکترونیک</h2><div id="gateways">در حال بارگذاری…</div></div><div class="card"><h2>🧾 صورتحساب</h2><p>صورتحساب هر نوبت پس از ثبت سفارش در حساب کاربری شما ایجاد می‌شود.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await db.from('center_financial_settings').select('center_name,bank_name,account_number,iban,card_number,card_holder,payment_notes,zarinpal_enabled,iran_dargah_enabled,parsian_enabled,pasargad_enabled').eq('id',1).maybeSingle();if(r.error){$('bank').innerHTML='<p>خطا در دریافت اطلاعات پرداخت.</p>';return}const x=r.data||{};$('title').textContent='پرداخت | '+(x.center_name||'مرکز مشاوره تلفنی روان');$('bank_name').textContent=x.bank_name||'—';$('account').textContent=x.account_number||'—';$('iban').textContent=x.iban||'—';$('card').textContent=x.card_number||'—';$('holder').textContent=x.card_holder||'—';$('notes').textContent=x.payment_notes||'';const g=[];if(x.zarinpal_enabled)g.push('زرین‌پال');if(x.iran_dargah_enabled)g.push('ایران‌درگاه');if(x.parsian_enabled)g.push('پارسیان');if(x.pasargad_enabled)g.push('پاسارگاد');$('gateways').innerHTML=g.length?g.map(v=>'<span class="gateway">'+esc(v)+'</span>').join(''):'در حال حاضر درگاه آنلاین فعالی اعلام نشده است.'}load();</script></body></html>
