<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت سفارش | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:35px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f8f9ff;border-radius:12px;padding:14px}.label{color:#667085;font-size:13px}.value{font-size:18px;font-weight:700;margin-top:4px}.muted{color:#667085}.btn{display:inline-block;border:0;background:#4f46e5;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;margin:5px;font:inherit;cursor:pointer}.btn.gray{background:#64748b}.msg{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>💳 پرداخت سفارش</h1><p class="muted">روش پرداخت سفارش خود را انتخاب کنید.</p></div><div id="orderBox" class="card">در حال دریافت سفارش…</div><div id="actions" class="card" style="display:none"><h2>روش پرداخت</h2><p id="methodText" class="muted"></p><a id="cardBtn" class="btn" href="#">💳 پرداخت کارت‌به‌کارت و ثبت رسید</a><button id="onlineBtn" class="btn" style="display:none">🌐 پرداخت آنلاین</button><a class="btn gray" href="/">بازگشت به سایت</a><div id="msg"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('fa-IR');function msg(t){$('msg').className='msg err';$('msg').textContent=t}async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.replace('/?login=1');return}const id=new URLSearchParams(location.search).get('order_id');if(!id){$('orderBox').textContent='شناسه سفارش پیدا نشد.';return}const{o,error}=await db.from('booking_orders').select('id,total_amount,payment_status,service_id,consultant_id,session_count,created_at').eq('id',id).eq('user_id',user.id).maybeSingle();if(error||!o){$('orderBox').textContent='سفارش پیدا نشد یا متعلق به حساب شما نیست.';return}if(o.payment_status!=='pending'){$('orderBox').innerHTML='<p>این سفارش دیگر در وضعیت قابل پرداخت نیست.</p>';return}const[s,c]=await Promise.all([db.from('services').select('name').eq('id',o.service_id).maybeSingle(),db.from('consultants').select('name').eq('id',o.consultant_id).maybeSingle()]);$('orderBox').innerHTML='<div class="grid"><div class="item"><div class="label">شماره سفارش</div><div class="value">'+esc(o.id)+'</div></div><div class="item"><div class="label">خدمت</div><div class="value">'+esc(s.data?.name||'—')+'</div></div><div class="item"><div class="label">مشاور</div><div class="value">'+esc(c.data?.name||'—')+'</div></div><div class="item"><div class="label">مبلغ کل</div><div class="value">'+money(o.total_amount)+' تومان</div></div><div class="item"><div class="label">وضعیت</div><div class="value">در انتظار پرداخت</div></div></div>';const{data:cfg}=await db.from('center_financial_settings').select('zarinpal_enabled,zarinpal_merchant_id,iran_dargah_enabled,parsian_enabled,pasargad_enabled').eq('id',1).maybeSingle();const online=!!(cfg?.zarinpal_enabled&&cfg?.zarinpal_merchant_id);$('actions').style.display='block';$('cardBtn').href='/card-payment.html?order_id='+encodeURIComponent(o.id);if(online){$('methodText').textContent='درگاه آنلاین زرین‌پال فعال است.';$('onlineBtn').style.display='inline-block';$('onlineBtn').onclick=async()=>{const b=$('onlineBtn');b.disabled=true;b.textContent='در حال اتصال…';const r=await db.functions.invoke('zarinpal-request',{body:{order_id:o.id}});if(r.error||!r.data?.payment_url){msg(r.data?.error||r.error?.message||'شروع پرداخت آنلاین ناموفق بود.');b.disabled=false;b.textContent='🌐 پرداخت آنلاین';return}location.href=r.data.payment_url}}else{$('methodText').textContent='درگاه آنلاین هنوز برای مرکز فعال نشده است؛ پرداخت کارت‌به‌کارت و ثبت رسید مالی فعال است.'}$('cardBtn').textContent='💳 پرداخت کارت‌به‌کارت و ثبت رسید';}load();</script></body></html>
