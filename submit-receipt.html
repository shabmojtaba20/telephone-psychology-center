<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت رسید پرداخت | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{width:min(720px,calc(100% - 28px));margin:30px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #00000008}label{display:block;font-weight:700;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6dbe5;border-radius:10px;font:inherit}input[type=file]{padding:9px}.btn{border:0;border-radius:10px;background:#4f46e5;color:#fff;padding:12px 18px;cursor:pointer;font:inherit;width:100%;margin-top:15px}.muted{color:#667085;font-size:13px}.notice{padding:12px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.loading{opacity:.6;pointer-events:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>🧾 ثبت رسید پرداخت</h1><p class="muted">پس از کارت‌به‌کارت یا پرداخت دستی، تصویر رسید را ارسال کنید. رسید فقط برای مدیر مالی قابل مشاهده است.</p><div id="notice"></div><div class="row"><div><label>مبلغ پرداختی (تومان)</label><input id="amount" type="number" min="1" inputmode="numeric" placeholder="مثلاً ۵۰۰۰۰۰"></div><div><label>کد پیگیری</label><input id="tracking" maxlength="100" placeholder="کد پیگیری بانک"></div></div><div class="row"><div><label>۴ رقم آخر کارت پرداخت‌کننده</label><input id="last4" inputmode="numeric" maxlength="4" placeholder="۱۲۳۴"></div><div><label>شناسه نوبت (اختیاری)</label><input id="appointment" placeholder="UUID نوبت"></div></div><label>فایل رسید</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><p class="muted">فرمت‌های مجاز: JPG، PNG، WEBP و PDF — حداکثر ۵ مگابایت.</p><button id="submit" class="btn" onclick="submitReceipt()">ارسال رسید برای بررسی</button></section><section class="card"><a href="/payment.html">← بازگشت به صفحه پرداخت</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);function notice(t,err=false){$('notice').className=err?'notice err':'notice';$('notice').textContent=t}async function submitReceipt(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='/admin-login.html?redirect=/submit-receipt.html';return}const file=$('file').files[0],amount=Number($('amount').value),tracking=$('tracking').value.trim(),last4=$('last4').value.trim(),appointment=$('appointment').value.trim()||null;if(!amount||amount<=0)return notice('مبلغ پرداختی را وارد کنید.',true);if(last4&&!/^\d{4}$/.test(last4))return notice('۴ رقم آخر کارت را صحیح وارد کنید.',true);if(!file)return notice('لطفاً فایل رسید را انتخاب کنید.',true);if(file.size>5*1024*1024)return notice('حجم فایل بیشتر از ۵ مگابایت است.',true);const allowed=['image/jpeg','image/png','image/webp','application/pdf'];if(!allowed.includes(file.type))return notice('فرمت فایل مجاز نیست.',true);$('submit').classList.add('loading');$('submit').textContent='در حال ارسال…';try{const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await db.storage.from('payment-receipts').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(up.error)throw up.error;const ins=await db.from('payment_receipts').insert({user_id:session.user.id,appointment_id:appointment,amount,status:'pending',receipt_path:path,tracking_code:tracking||null,payer_card_last4:last4||null}).select('id').single();if(ins.error){await db.storage.from('payment-receipts').remove([path]);throw ins.error}notice('رسید با موفقیت ثبت شد و برای بررسی مدیر مالی ارسال گردید.');$('submit').textContent='رسید ثبت شد';$('submit').disabled=true}catch(e){notice(e.message||'خطا در ثبت رسید.',true);$('submit').classList.remove('loading');$('submit').textContent='ارسال رسید برای بررسی'}}</script></body></html>
