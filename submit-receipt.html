<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت رسید کارت‌به‌کارت | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{width:min(720px,calc(100% - 28px));margin:30px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #00000008}label{display:block;font-weight:700;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6dbe5;border-radius:10px;font:inherit;background:#fff}.btn{border:0;border-radius:10px;background:#4f46e5;color:#fff;padding:12px 18px;cursor:pointer;font:inherit;width:100%;margin-top:15px}.muted{color:#667085;font-size:13px}.notice{padding:12px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.loading{opacity:.6;pointer-events:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.invoice{background:#f8f9ff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:8px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>🧾 ثبت رسید کارت‌به‌کارت</h1><p class="muted">صورتحساب خود را انتخاب کنید و اطلاعات فیش کارت‌به‌کارت را ارسال نمایید. مدیر مالی پس از تطبیق فیش با صورتحساب و گردش حساب بانک، فقط آن را تأیید یا رد می‌کند.</p><div id="notice"></div><label>صورتحساب</label><select id="invoice"><option value="">در حال دریافت صورتحساب‌ها…</option></select><div id="invoiceInfo" class="invoice" style="display:none"></div><div class="row"><div><label>مبلغ پرداختی (تومان)</label><input id="amount" type="number" min="1" inputmode="numeric" placeholder="مثلاً ۵۰۰۰۰۰"></div><div><label>کد پیگیری / شماره مرجع</label><input id="tracking" maxlength="100" placeholder="کد پیگیری بانک"></div></div><div><label>۴ رقم آخر کارت پرداخت‌کننده</label><input id="last4" inputmode="numeric" maxlength="4" placeholder="۱۲۳۴"></div><label>تصویر یا فایل فیش</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><p class="muted">فرمت‌های مجاز: JPG، PNG، WEBP و PDF — حداکثر ۵ مگابایت.</p><button id="submit" class="btn" onclick="submitReceipt()">ارسال رسید برای بررسی مالی</button></section><section class="card"><a href="/payment.html">← بازگشت به صفحه پرداخت</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);let sessionUser=null,invoiceMap=new Map();function notice(t,err=false){$('notice').className=err?'notice err':'notice';$('notice').textContent=t}function money(v){return Number(v||0).toLocaleString('fa-IR')+' تومان'}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function renderInvoice(){const id=$('invoice').value,x=invoiceMap.get(id);if(!x){$('invoiceInfo').style.display='none';$('amount').value='';return}$('invoiceInfo').style.display='block';$('invoiceInfo').innerHTML='<b>'+esc(x.invoice_number||'بدون شماره')+'</b><br>مبلغ صورتحساب: '+money(x.amount)+'<br>وضعیت: '+esc(x.status||'issued');$('amount').value=Number(x.amount||0)}async function loadInvoices(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='/customer-login.html?next='+encodeURIComponent('/submit-receipt.html');return}sessionUser=session.user;const r=await db.from('invoices').select('id,invoice_number,amount,status,appointment_id,issued_at').eq('user_id',session.user.id).in('status',['issued','pending']).order('issued_at',{ascending:false});if(r.error)throw r.error;const sel=$('invoice');sel.innerHTML='<option value="">یک صورتحساب را انتخاب کنید</option>';invoiceMap.clear();(r.data||[]).forEach(x=>{invoiceMap.set(x.id,x);const o=document.createElement('option');o.value=x.id;o.textContent=(x.invoice_number||'صورتحساب')+' — '+money(x.amount);sel.appendChild(o)});if(!r.data?.length){notice('صورتحساب پرداخت‌نشده‌ای برای این حساب پیدا نشد. ابتدا سفارش/نوبت شما باید صورتحساب داشته باشد.',true);$('submit').disabled=true}}async function submitReceipt(){const invoiceId=$('invoice').value,file=$('file').files[0],amount=Number($('amount').value),tracking=$('tracking').value.trim(),last4=$('last4').value.trim();const invoice=invoiceMap.get(invoiceId);if(!invoice)return notice('ابتدا صورتحساب را انتخاب کنید.',true);if(!amount||amount<=0)return notice('مبلغ پرداختی را وارد کنید.',true);if(amount!==Number(invoice.amount))return notice('مبلغ رسید باید با مبلغ صورتحساب برابر باشد.',true);if(last4&&!/^\d{4}$/.test(last4))return notice('۴ رقم آخر کارت را صحیح وارد کنید.',true);if(!file)return notice('لطفاً فایل فیش را انتخاب کنید.',true);if(file.size>5*1024*1024)return notice('حجم فایل بیشتر از ۵ مگابایت است.',true);const allowed=['image/jpeg','image/png','image/webp','application/pdf'];if(!allowed.includes(file.type))return notice('فرمت فایل مجاز نیست.',true);$('submit').classList.add('loading');$('submit').textContent='در حال ارسال…';try{const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=sessionUser.id+'/'+crypto.randomUUID()+'.'+ext;const up=await db.storage.from('payment-receipts').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(up.error)throw up.error;const ins=await db.from('payment_receipts').insert({user_id:sessionUser.id,invoice_id:invoice.id,appointment_id:invoice.appointment_id||null,amount,status:'pending',receipt_path:path,tracking_code:tracking||null,payer_card_last4:last4||null}).select('id').single();if(ins.error){await db.storage.from('payment-receipts').remove([path]);throw ins.error}notice('فیش با موفقیت ثبت شد و مستقیماً روی صورتحساب شما برای بررسی مدیر مالی قرار گرفت.');$('submit').textContent='رسید ثبت شد';$('submit').disabled=true}catch(e){notice(e.message||'خطا در ثبت رسید.',true);$('submit').classList.remove('loading');$('submit').textContent='ارسال رسید برای بررسی مالی'}}$('invoice').addEventListener('change',renderInvoice);loadInvoices().catch(e=>notice(e.message||'خطا در دریافت صورتحساب‌ها.',true));</script></body></html>
