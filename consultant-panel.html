<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مشاور | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #11182708}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.muted{color:#6b7280;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.gray{background:#64748b}.btn.green{background:#15803d}.reason{background:#f8fafc;border-radius:11px;padding:12px;white-space:pre-wrap}.ai{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:13px}.topic{display:inline-block;background:#fff;border:1px solid #c7d2fe;border-radius:999px;padding:4px 9px;margin:4px;font-size:12px}.msg{padding:10px;border-radius:9px;margin:10px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.hidden{display:none}.danger{color:#991b1b}.date{font-weight:800;font-size:18px}.time{color:#4f46e5;font-weight:700}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍⚕️ پنل مشاور</h1><div class="muted">نوبت‌ها، علت مراجعه و خلاصه هوشمند اولیه</div></div><div><button class="btn gray" onclick="location.href='/admin-professional.html'">پنل مدیریت</button> <button class="btn" id="logout">خروج</button></div></div><div id="msg"></div><div class="card"><h2>نوبت‌های مراجعه</h2><p class="muted">شرح مراجعه محرمانه است و فقط در محیط احراز‌شده نمایش داده می‌شود.</p><div id="list" class="grid"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faDateTime=v=>{if(!v)return'—';const d=new Date(v);return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tehran'}).format(d)};
const msg=(t,bad=false)=>{$('msg').className='msg '+(bad?'err':'');$('msg').textContent=t};async function guard(){const{data}=await db.auth.getSession();if(!data.session){location.replace('/admin.html');return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){await db.auth.signOut();location.replace('/admin.html');return false}return true}async function load(){const r=await db.rpc('get_consultant_appointments');if(r.error)return msg(r.error.message,true);const a=r.data||[];$('list').innerHTML=a.length?a.map(x=>`<article class="card"><div class="date">${esc(faDateTime(x.scheduled_at))}</div><p><b>مشاور:</b> ${esc(x.consultant_name||'—')}</p><p><b>وضعیت:</b> ${esc(x.status)} | <b>پرداخت:</b> ${esc(x.payment_status)}</p><div><b>علت مراجعه:</b><div class="reason">${esc(x.client_reason||'علتی توسط مراجعه‌کننده ثبت نشده است.')}</div></div><div class="ai"><b>🤖 خلاصه و سرفصل هوشمند</b>${x.ai_summary?`<p>${esc(x.ai_summary)}</p><div>${(x.ai_topics||[]).map(t=>`<span class="topic">${esc(t)}</span>`).join('')}</div><small class="muted">آخرین تولید: ${esc(faDateTime(x.ai_generated_at))}</small>`:'<p class="muted">هنوز تولید نشده است.</p>'}<br><button class="btn green" data-ai="${x.id}">تولید / به‌روزرسانی خلاصه</button></div></article>`).join(''):'<div class="card"><p class="muted">نوبتی برای نمایش وجود ندارد.</p></div>';document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>generate(b.dataset.ai,a.find(x=>x.id===b.dataset.ai)))}async function generate(id,x){if(!x?.client_reason)return msg('برای این نوبت علت مراجعه ثبت نشده است.',true);msg('در حال تولید خلاصه هوشمند...');const{data,error}=await db.functions.invoke('appointment-ai-summary',{body:{appointment_id:id,client_reason:x.client_reason}});if(error)return msg('اتصال به سرویس هوش مصنوعی انجام نشد. احتمالاً OPENAI_API_KEY هنوز در Secretهای Supabase تنظیم نشده است.',true);if(data?.error)return msg(data.error,true);const saved=await db.rpc('save_appointment_ai_summary',{p_appointment_id:id,p_summary:data.summary,p_topics:data.topics||[]});if(saved.error)return msg(saved.error.message,true);msg('خلاصه هوشمند با موفقیت ذخیره شد.');load()}$('logout').onclick=async()=>{await db.auth.signOut();location.replace('/admin.html')};if(await guard())load();</script></body></html>
