<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>پنل مشاور | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #11182708}.stat{font-size:28px;font-weight:900;color:#4f46e5}.muted{color:#64748b;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#4f46e5;color:#fff;cursor:pointer}.gray{background:#64748b}.msg{padding:11px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.row{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;background:#fff}.reason{background:#f8fafc;border-radius:9px;padding:9px;margin-top:7px;white-space:pre-wrap}.hidden{display:none}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍⚕️ پنل مشاور</h1><div id="who" class="muted">در حال بررسی حساب...</div></div><button id="logout" class="btn gray">خروج</button></div><div id="msg"></div><section id="app" class="hidden"><div class="grid"><div class="card"><div class="muted">نوبت‌های آینده</div><div id="up" class="stat">۰</div></div><div class="card"><div class="muted">نوبت‌های انجام‌شده</div><div id="done" class="stat">۰</div></div><div class="card"><div class="muted">نوبت‌های در انتظار</div><div id="pending" class="stat">۰</div></div><div class="card"><div class="muted">درآمد ثبت‌شده</div><div id="earned" class="stat">۰</div></div></div><div class="card"><h2>پروفایل مشاور</h2><div id="profile"></div></div><div class="card"><h2>نوبت‌های من</h2><div id="appointments"></div></div><div class="card"><h2>برنامه کاری</h2><div id="slots"></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString('fa-IR'),dt=v=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'}).format(new Date(v));function msg(t,b=false){$('msg').className='msg '+(b?'err':'');$('msg').textContent=t}async function start(){const s=await db.auth.getSession();if(!s.data.session)return location.replace('/admin.html');const d=await db.rpc('get_my_consultant_dashboard');if(d.error||!d.data?.length){msg('این حساب هنوز به یک مشاور متصل نشده است. ابتدا مدیر باید حساب مشاور را به پروفایل مشاور متصل کند.',true);return}const p=d.data[0];$('app').classList.remove('hidden');$('who').textContent=`${p.consultant_name} — ${p.specialty||'مشاور'}`;$('up').textContent=fmt(p.upcoming_count);$('done').textContent=fmt(p.completed_count);$('pending').textContent=fmt(p.pending_count);$('earned').textContent=fmt(p.total_earned)+' تومان';$('profile').innerHTML=`<b>${esc(p.consultant_name)}</b><p>${esc(p.specialty||'')}</p><p class="muted">${esc(p.bio||'معرفی مشاور ثبت نشده است.')}</p>`;const a=await db.rpc('get_my_consultant_appointments');$('appointments').innerHTML=a.error?`<div class="err">${esc(a.error.message)}</div>`:a.data?.length?a.data.map(x=>`<div class="row"><b>${esc(dt(x.scheduled_at))}</b><div>وضعیت: ${esc(x.status||'—')} | پرداخت: ${esc(x.payment_status||'—')} | مبلغ: ${fmt(x.amount)} تومان</div><div class="reason">علت مراجعه: ${esc(x.client_reason||'ثبت نشده')}</div>${x.notes?`<div class="muted">یادداشت: ${esc(x.notes)}</div>`:''}</div>`).join(''):'<div class="muted">نوبتی ثبت نشده است.</div>';const sl=await db.rpc('get_my_consultant_slots');$('slots').innerHTML=sl.error?`<div class="err">${esc(sl.error.message)}</div>`:sl.data?.length?sl.data.map(x=>`<div class="row">${esc(new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'full',timeZone:'Asia/Tehran'}).format(new Date(x.slot_date+'T12:00:00')))} — ${esc(String(x.start_time).slice(0,5))} تا ${esc(String(x.end_time).slice(0,5))} <b>${x.is_active?'فعال':'غیرفعال'}</b></div>`).join(''):'<div class="muted">برنامه کاری ثبت نشده است.</div>'}$('logout').onclick=async()=>{await db.auth.signOut();location.replace('/admin.html')};}start();</script></body></html>
