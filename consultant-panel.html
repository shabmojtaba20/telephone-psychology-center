<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>پنل مشاور | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #11182708}.stat{font-size:28px;font-weight:900;color:#4f46e5}.muted{color:#64748b;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#4f46e5;color:#fff;cursor:pointer}.gray{background:#64748b}.green{background:#059669}.red{background:#be123c}.orange{background:#d97706}.msg{padding:11px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.row{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;background:#fff}.reason{background:#f8fafc;border-radius:9px;padding:9px;margin-top:7px;white-space:pre-wrap}.hidden{display:none}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea,.field select{padding:10px;border:1px solid #dbe1ea;border-radius:9px;font:inherit;background:#fff}.field textarea{min-height:80px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.session{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc}.timer{font-weight:800;color:#4f46e5}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>👨‍⚕️ پنل عملیاتی مشاور</h1><div id="who" class="muted">در حال بررسی حساب...</div></div><button id="logout" class="btn gray">خروج</button></div><div id="msg"></div><section id="app" class="hidden"><div class="grid"><div class="card"><div class="muted">نوبت‌های آینده</div><div id="up" class="stat">۰</div></div><div class="card"><div class="muted">نوبت‌های انجام‌شده</div><div id="done" class="stat">۰</div></div><div class="card"><div class="muted">در انتظار</div><div id="pending" class="stat">۰</div></div><div class="card"><div class="muted">درآمد ثبت‌شده</div><div id="earned" class="stat">۰</div></div></div><div class="card"><h2>پروفایل مشاور</h2><div class="formgrid"><label class="field">نام<input id="pname"></label><label class="field">تخصص<input id="pspecialty"></label><label class="field">تحصیلات<input id="peducation"></label><label class="field">لینک تصویر<input id="pphoto"></label></div><label class="field" style="margin-top:10px">معرفی<textarea id="pbio"></textarea></label><div class="actions"><button id="saveProfile" class="btn">ذخیره پروفایل</button></div></div><div class="card"><h2>نوبت‌های من</h2><div id="appointments"></div></div><div class="card"><h2>برنامه کاری</h2><div class="formgrid"><label class="field">تاریخ<input id="sdate" type="date"></label><label class="field">شروع<input id="sstart" type="time"></label><label class="field">پایان<input id="send" type="time"></label><label class="field">وضعیت<select id="sactive"><option value="true">فعال</option><option value="false">غیرفعال</option></select></label></div><div class="actions"><button id="saveSlot" class="btn">افزودن زمان کاری</button><button id="cancelSlot" class="btn gray hidden">لغو ویرایش</button></div><div id="slots"></div></div><div class="card"><h2>خلاصه مالی</h2><div id="finance" class="muted">در حال بارگذاری...</div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString('fa-IR'),dt=v=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'}).format(new Date(v));function msg(t,b=false){$('msg').className='msg '+(b?'err':'');$('msg').textContent=t}let editingSlot=null;async function loadProfile(){const r=await db.rpc('get_my_consultant_profile');if(r.error||!r.data?.length)return;const p=r.data[0];$('pname').value=p.name||'';$('pspecialty').value=p.specialty||'';$('pbio').value=p.bio||'';$('peducation').value=p.education||'';$('pphoto').value=p.photo_url||''}async function sessionFor(id){const r=await db.rpc('get_my_consultant_session',{p_appointment_id:id});return r.error?null:r.data?.[0]||null}function sessionHtml(x,s){if(s?.status==='in_progress')return `<div class="session"><b>🟢 جلسه در حال برگزاری</b><div class="timer">شروع: ${esc(dt(s.started_at))}</div><div class="actions"><button class="btn green" data-finish="${x.id}">پایان جلسه و ثبت یادداشت</button><button class="btn red" data-cancel-session="${x.id}">لغو جلسه</button></div></div>`;if(s?.status==='completed')return `<div class="session"><b>✅ جلسه انجام شد</b>${s.duration_minutes!=null?`<div>مدت جلسه: ${fmt(s.duration_minutes)} دقیقه</div>`:''}${s.session_note?`<div class="muted">یادداشت: ${esc(s.session_note)}</div>`:''}</div>`;if(s?.status==='cancelled')return `<div class="session"><b>❌ جلسه لغو شد</b>${s.session_note?`<div class="muted">${esc(s.session_note)}</div>`:''}</div>`;if(x.status==='confirmed')return `<div class="session"><b>جلسه آماده است</b><div class="actions"><button class="btn orange" data-start="${x.id}">▶️ شروع جلسه</button></div></div>`;return ''}async function loadAppointments(){const a=await db.rpc('get_my_consultant_appointments');if(a.error){$('appointments').innerHTML='<div class="msg err">'+esc(a.error.message)+'</div>';return}const rows=[];for(const x of a.data||[]){rows.push({...x,session:await sessionFor(x.id)})}$('appointments').innerHTML=rows.length?rows.map(x=>`<div class="row"><b>${esc(dt(x.scheduled_at))}</b><div>وضعیت: <b>${esc(x.status||'—')}</b> | پرداخت: ${esc(x.payment_status||'—')} | مبلغ: ${fmt(x.amount)} تومان</div><div class="reason">علت مراجعه: ${esc(x.client_reason||'ثبت نشده')}</div>${x.notes?`<div class="muted">یادداشت: ${esc(x.notes)}</div>`:''}<div class="actions">${x.status==='pending'?`<button class="btn green" data-a="${x.id}" data-s="confirmed">تأیید نوبت</button><button class="btn red" data-a="${x.id}" data-s="cancelled">لغو نوبت</button>`:''}</div>${sessionHtml(x,x.session)}</div>`).join(''):'<div class="muted">نوبتی ثبت نشده است.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const note=prompt('یادداشت نوبت (اختیاری):','')??'';const r=await db.rpc('update_my_consultant_appointment',{p_appointment_id:b.dataset.a,p_status:b.dataset.s,p_notes:note});if(r.error)msg(r.error.message,true);else{msg('وضعیت نوبت ذخیره شد.');await loadAll()}});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{const r=await db.rpc('start_my_consultant_session',{p_appointment_id:b.dataset.start});if(r.error)msg(r.error.message,true);else{msg('جلسه با موفقیت شروع شد.');await loadAll()}});document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=async()=>{const note=prompt('یادداشت نهایی جلسه را وارد کنید:','')??'';const r=await db.rpc('finish_my_consultant_session',{p_appointment_id:b.dataset.finish,p_note:note});if(r.error)msg(r.error.message,true);else{msg('جلسه پایان یافت و نتیجه ثبت شد.');await loadAll()}});document.querySelectorAll('[data-cancel-session]').forEach(b=>b.onclick=async()=>{const note=prompt('علت لغو جلسه (اختیاری):','')??'';const r=await db.rpc('cancel_my_consultant_session',{p_appointment_id:b.dataset.cancelSession,p_note:note});if(r.error)msg(r.error.message,true);else{msg('جلسه لغو شد.');await loadAll()}})}async function loadSlots(){const sl=await db.rpc('get_my_consultant_slots');$('slots').innerHTML=sl.error?'<div class="msg err">'+esc(sl.error.message)+'</div>':sl.data?.length?sl.data.map(x=>`<div class="row"><b>${esc(x.slot_date)}</b> — ${esc(String(x.start_time).slice(0,5))} تا ${esc(String(x.end_time).slice(0,5))} — ${x.is_active?'فعال':'غیرفعال'}<div class="actions"><button class="btn" data-edit="${x.id}">ویرایش</button><button class="btn red" data-del="${x.id}">حذف</button></div></div>`).join(''):'<div class="muted">برنامه کاری ثبت نشده است.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=sl.data.find(v=>v.id===b.dataset.edit);if(!x)return;editingSlot=x.id;$('sdate').value=x.slot_date;$('sstart').value=String(x.start_time).slice(0,5);$('send').value=String(x.end_time).slice(0,5);$('sactive').value=String(x.is_active);$('saveSlot').textContent='ذخیره ویرایش';$('cancelSlot').classList.remove('hidden')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('این زمان کاری حذف شود؟'))return;const r=await db.rpc('delete_my_consultant_slot',{p_id:b.dataset.del});if(r.error)msg(r.error.message,true);else{msg(r.data?'زمان کاری حذف شد.':'این زمان به دلیل نوبت فعال قابل حذف نیست.');await loadSlots()}})}async function loadAll(){const d=await db.rpc('get_my_consultant_dashboard');if(d.error||!d.data?.length){msg('این حساب هنوز به یک مشاور متصل نشده است.',true);return false}const p=d.data[0];$('app').classList.remove('hidden');$('who').textContent=`${p.consultant_name} — ${p.specialty||'مشاور'}`;$('up').textContent=fmt(p.upcoming_count);$('done').textContent=fmt(p.completed_count);$('pending').textContent=fmt(p.pending_count);$('earned').textContent=fmt(p.total_earned)+' تومان';const f=await db.rpc('get_my_consultant_financial_summary');$('finance').textContent=f.error?'خطا در خلاصه مالی':`تعداد نوبت: ${fmt(f.data?.[0]?.appointment_count)} | پرداخت‌شده: ${fmt(f.data?.[0]?.paid_count)} | مبلغ کل: ${fmt(f.data?.[0]?.total_amount)} تومان | دریافتی: ${fmt(f.data?.[0]?.paid_amount)} تومان`;await loadProfile();await loadAppointments();await loadSlots();return true}async function start(){const s=await db.auth.getSession();if(!s.data.session)return location.replace('/admin.html');await loadAll();$('saveProfile').onclick=async()=>{const r=await db.rpc('update_my_consultant_profile',{p_name:$('pname').value,p_specialty:$('pspecialty').value,p_bio:$('pbio').value,p_education:$('peducation').value,p_photo_url:$('pphoto').value});if(r.error)msg(r.error.message,true);else{msg('پروفایل مشاور ذخیره شد.');await loadAll()}};$('saveSlot').onclick=async()=>{const r=await db.rpc('save_my_consultant_slot',{p_id:editingSlot,p_slot_date:$('sdate').value,p_start_time:$('sstart').value,p_end_time:$('send').value,p_is_active:$('sactive').value==='true'});if(r.error)msg(r.error.message,true);else{msg(editingSlot?'زمان کاری ویرایش شد.':'زمان کاری اضافه شد.');editingSlot=null;$('saveSlot').textContent='افزودن زمان کاری';$('cancelSlot').classList.add('hidden');await loadSlots()}};$('cancelSlot').onclick=()=>{editingSlot=null;$('sdate').value='';$('sstart').value='';$('send').value='';$('saveSlot').textContent='افزودن زمان کاری';$('cancelSlot').classList.add('hidden')};$('logout').onclick=async()=>{await db.auth.signOut();location.replace('/admin.html')}}start();</script></body></html>
