<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت شرکت‌کنندگان کارگاه</title><style>body{margin:0;background:#f6f8fc;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;background:#4f46e5;color:#fff;cursor:pointer;text-decoration:none;font:inherit}.btn.alt{background:#eef2ff;color:#4338ca}.btn.green{background:#15803d}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.muted{color:#667085;font-size:13px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;margin-top:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:middle}th{background:#f8fafc;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px}.badge.ok{background:#ecfdf3;color:#15803d}.badge.warn{background:#fff7ed;color:#c2410c}.field{box-sizing:border-box;width:100%;padding:7px;border:1px solid #d7dce5;border-radius:8px;font:inherit;background:#fff}.actions{display:flex;gap:5px;flex-wrap:wrap}.note{min-width:160px}.empty{text-align:center;padding:30px;color:#667085}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">مدیریت شرکت‌کنندگان</h1><div id="meta" class="muted">در حال بارگذاری...</div></div><div><a class="btn alt" href="/education-management.html">مدیریت آموزش</a> <a class="btn alt" href="/education-dashboard.html">داشبورد</a></div></div><div id="stats" class="stats"></div><div class="card"><h2>گزارش مالی کارگاه</h2><div id="finance" class="muted">در حال محاسبه...</div></div><div class="card"><div class="top"><h2>شرکت‌کنندگان</h2><div class="actions"><button class="btn alt" id="refresh">به‌روزرسانی</button><button class="btn green" id="issueAll">صدور گواهی واجدان شرایط</button></div></div><div class="table-wrap"><table><thead><tr><th>نام</th><th>موبایل</th><th>ایمیل</th><th>مبلغ</th><th>پرداخت</th><th>ثبت‌نام</th><th>حضور و غیاب</th><th>یادداشت</th><th>گواهی</th><th>عملیات</th></tr></thead><tbody id="people"></tbody></table></div></div><div id="msg" class="muted"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),status=v=>({paid:'پرداخت‌شده',free:'رایگان',registered:'ثبت اولیه',pending:'در انتظار',failed:'ناموفق',cancelled:'لغوشده'}[v]||v||'-');
async function guard(){const r=await db.rpc('has_admin_permission',{p_permission:'education.manage'});if(r.error||r.data!==true){document.body.innerHTML='<main class="wrap"><div class="card"><h2>دسترسی غیرمجاز</h2><p>مجوز education.manage لازم است.</p></div></main>';throw 0}}
async function load(){await guard();if(!id){$('msg').textContent='شناسه کارگاه مشخص نشده است.';return}const r=await db.rpc('get_workshop_admin_report',{p_workshop_id:id});if(r.error){$('msg').textContent='خطا: '+r.error.message;return}const d=r.data,w=d.workshop,s=d.stats||{},ps=d.participants||[];$('title').textContent='مدیریت شرکت‌کنندگان: '+w.title;$('meta').textContent=(w.instructor_name?'مدرس: '+w.instructor_name+' · ':'')+(w.starts_at?new Date(w.starts_at).toLocaleString('fa-IR'):'')+' · وضعیت: '+w.status;const cards=[['ثبت‌نام',s.registrations],['پرداخت‌شده',s.paid],['رایگان',s.free],['حاضر',s.attended],['غایب',s.absent],['گواهی صادرشده',s.certificates]];$('stats').innerHTML=cards.map(x=>'<div class="stat"><span class="muted">'+x[0]+'</span><b>'+Number(x[1]||0).toLocaleString('fa-IR')+'</b></div>').join('');$('finance').innerHTML='<b>درآمد قطعی:</b> '+money(s.revenue)+' &nbsp; | &nbsp; <b>ظرفیت:</b> '+(w.max_participants?Number(w.max_participants).toLocaleString('fa-IR'):'نامحدود')+' &nbsp; | &nbsp; <b>پرداخت موفق:</b> '+Number(s.paid||0).toLocaleString('fa-IR');$('people').innerHTML=ps.length?ps.map(p=>'<tr><td><b>'+esc(p.full_name||'-')+'</b></td><td>'+esc(p.mobile||'-')+'</td><td>'+esc(p.email||'-')+'</td><td>'+money(p.amount)+'</td><td><span class="badge '+(p.payment_status==='paid'||p.payment_status==='free'?'ok':'warn')+'">'+status(p.payment_status)+'</span></td><td>'+new Date(p.created_at).toLocaleDateString('fa-IR')+'</td><td><select class="field att" data-id="'+p.id+'"><option value="registered">ثبت‌نام‌شده</option><option value="attended">حاضر</option><option value="absent">غایب</option><option value="cancelled">لغوشده</option></select></td><td><input class="field note" data-note="'+p.id+'" value="'+esc(p.admin_note||'')+'" placeholder="یادداشت"></td><td>'+(p.certificate_number?'<span class="badge ok">'+esc(p.certificate_number)+'</span>':'<span class="badge warn">صادر نشده</span>')+'</td><td class="actions"><button class="btn save" data-save="'+p.id+'">ذخیره</button>'+(p.certificate_number?'':'<button class="btn green cert" data-cert="'+p.id+'">صدور گواهی</button>')+'</td></tr>').join(''):'<tr><td colspan="10" class="empty">هنوز شرکت‌کننده‌ای ثبت نشده است.</td></tr>';ps.forEach(p=>{const e=document.querySelector('[data-id="'+p.id+'"]');if(e)e.value=p.attendance_status||'registered'});document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const aid=document.querySelector('[data-id="'+b.dataset.save+'"]').value,note=document.querySelector('[data-note="'+b.dataset.save+'"]').value,z=await db.rpc('admin_workshop_update_participant',{p_registration_id:b.dataset.save,p_attendance_status:aid,p_admin_note:note||null});if(z.error)alert(z.error.message);else load()});document.querySelectorAll('.cert').forEach(b=>b.onclick=async()=>{if(!confirm('برای این شرکت‌کننده گواهی صادر شود؟'))return;const z=await db.rpc('issue_workshop_certificate',{p_registration_id:b.dataset.cert});if(z.error)alert(z.error.message);else{alert('گواهی صادر شد: '+z.data);load()}})}
$('refresh').onclick=load;$('issueAll').onclick=async()=>{if(!confirm('برای همه شرکت‌کنندگان واجد شرایط گواهی صادر شود؟'))return;const r=await db.rpc('get_workshop_admin_report',{p_workshop_id:id});if(r.error)return alert(r.error.message);let ok=0,fail=0;for(const p of r.data.participants||[]){if(p.certificate_number||p.attendance_status!=='attended'||!['paid','free'].includes(p.payment_status))continue;const z=await db.rpc('issue_workshop_certificate',{p_registration_id:p.id});z.error?fail++:ok++}alert('صدور انجام شد. موفق: '+ok+' | خطا: '+fail);load()};load().catch(e=>{if(e!==0)console.error(e)});
</script></body></html>
