<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت پرداخت‌های کارت‌به‌کارت</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1250px;margin:30px auto;padding:0 18px}
.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0000000a}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#667085}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}select,input,textarea{border:1px solid #d7ddea;border-radius:9px;padding:9px;background:#fff}button{border:0;border-radius:9px;padding:9px 14px;cursor:pointer}.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#eef2f7}.notice{margin:12px 0;padding:10px;border-radius:9px;background:#eef6ff}.err{background:#fff0f0;color:#b42318}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f5;text-align:right;vertical-align:top}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#f1f3f7}.actions{display:flex;gap:7px;flex-wrap:wrap}.receipt{display:flex;flex-direction:column;gap:7px}.receipt img{max-width:180px;max-height:130px;border-radius:8px;object-fit:contain}.empty{text-align:center;color:#667085;padding:25px}
</style></head><body><div class="wrap"><div class="card">
<div class="top"><div><h1>💳 مدیریت پرداخت‌های کارت‌به‌کارت</h1><p class="muted">مدیریت مستقل رسیدهای کارت‌به‌کارت؛ تأیید رسید، تراکنش مالی و صورتحساب مرتبط را به‌روزرسانی می‌کند.</p></div><button class="gray" onclick="location.href='/admin-v5.html'">↩ بازگشت به پنل مالی</button></div>
<div id="notice" class="notice"></div>
<div class="toolbar"><label>وضعیت <select id="filter"><option value="pending">در انتظار بررسی</option><option value="all">همه</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option></select></label><button class="gray" onclick="loadReceipts()">🔄 به‌روزرسانی</button></div>
<div class="table"><table><thead><tr><th>مبلغ</th><th>کاربر</th><th>نوبت/سفارش</th><th>وضعیت</th><th>کد پیگیری</th><th>رسید</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="body"></tbody></table></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t,e=false){$('notice').textContent=t;$('notice').className=e?'notice err':'notice'}
async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html');return false}const{data:ok,error}=await db.rpc('has_admin_permission',{p_permission:'finance.view'});if(error||ok!==true){note('این حساب به مشاهده مدیریت پرداخت‌های کارت‌به‌کارت دسترسی ندارد.',true);setTimeout(()=>location.replace('/admin-professional.html'),900);return false}return true}
function status(s){return s==='pending'?'در انتظار بررسی':s==='approved'?'تأییدشده':s==='rejected'?'ردشده':s}
async function loadReceipts(){if(!(await guard()))return;const r=await db.rpc('admin_list_payment_receipts');if(r.error){note(r.error.message,true);return}const all=r.data||[],f=$('filter').value,rows=f==='all'?all:all.filter(x=>x.status===f);$('body').innerHTML=rows.length?rows.map(x=>{const canManage=x.status==='pending';return '<tr><td>'+money(x.amount)+' تومان</td><td>'+esc(x.user_name||x.customer_name||x.email||x.user_id||'—')+'</td><td>'+esc(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('fa-IR'):(x.booking_order_id||'—'))+'</td><td><span class="badge">'+esc(status(x.status))+'</span></td><td>'+esc(x.tracking_code||'—')+'</td><td><div class="receipt">'+(x.receipt_url?'<a href="'+esc(x.receipt_url)+'" target="_blank" rel="noopener">مشاهده رسید</a>':'—')+'</div></td><td>'+esc(x.submitted_at?new Date(x.submitted_at).toLocaleString('fa-IR'):'—')+'</td><td>'+(canManage?'<div class="actions"><input id="track_'+x.id+'" placeholder="کد نهایی"><input id="note_'+x.id+'" placeholder="توضیح/علت"><button class="green" onclick="review(\''+x.id+'\',\'approved\')">تأیید</button><button class="red" onclick="review(\''+x.id+'\',\'rejected\')">رد</button></div>':'—')+'</td></tr>'}).join(''):'<tr><td colspan="8" class="empty">رسیدی در این وضعیت یافت نشد.</td></tr>'}
async function review(id,decision){const noteValue=$('note_'+id)?.value.trim()||null,track=$('track_'+id)?.value.trim()||null;if(decision==='rejected'&&!noteValue){note('برای رد رسید، علت رد را وارد کنید.',true);return}if(!(await guard()))return;if(!confirm(decision==='approved'?'رسید تأیید شود و تراکنش/صورتحساب ثبت شود؟':'رسید رد شود؟'))return;const{data,error}=await db.rpc('review_payment_receipt',{p_receipt_id:id,p_decision:decision,p_note:noteValue,p_tracking_code:track});if(error){note(error.message,true);return}note(decision==='approved'?'رسید تأیید شد؛ تراکنش و صورتحساب ثبت شد.':'رسید رد شد.');await loadReceipts()}
$('filter').onchange=loadReceipts;loadReceipts();
</script></body></html>
