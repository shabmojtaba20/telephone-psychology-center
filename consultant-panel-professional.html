<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل حرفه‌ای مشاور | مرکز مشاوره تلفنی روان</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}.shell{max-width:1200px;margin:auto;padding:14px}.top{background:linear-gradient(135deg,#111827,#312e81);color:#fff;border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#4f46e5;color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}.light{background:#ffffff20}.green{background:#059669}.red{background:#be123c}.orange{background:#d97706}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:28px;font-weight:900;color:#4f46e5}.muted{color:#667085;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:#eef2ff;color:#3730a3}.tab.active{background:#4f46e5;color:#fff}.hidden{display:none!important}.appointment{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:800}.ok{background:#dcfce7;color:#166534}.bad{background:#ffe4e6;color:#9f1239}.msg{padding:11px;border-radius:10px;margin:12px 0;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:700}input,textarea{width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #dfe3eb;border-radius:10px;padding:10px;font:inherit}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><h2 style="margin:0">🧠 پنل حرفه‌ای مشاور</h2><div id="who" style="margin-top:5px">در حال اتصال...</div></div><div class="actions"><a class="btn light" href="/">بازگشت به سایت</a><button id="logout" class="btn light">خروج</button></div></header>
<div id="msg"></div>
<section id="app" class="hidden">
<div class="grid">
<div class="card"><div class="muted">نوبت‌های آینده</div><div id="up" class="stat">۰</div></div>
<div class="card"><div class="muted">انجام‌شده</div><div id="done" class="stat">۰</div></div>
<div class="card"><div class="muted">در انتظار تأیید</div><div id="pending" class="stat">۰</div></div>
<div class="card"><div class="muted">درآمد ثبت‌شده</div><div id="earned" class="stat">۰</div></div>
</div>
<nav class="tabs"><button class="btn tab active" data-tab="appointments">📅 نوبت‌ها</button><button class="btn tab" data-tab="finance">💰 مالی</button><button class="btn tab" data-tab="profile">👤 پروفایل</button></nav>
<section id="appointments" class="tabpage">
<div class="card"><div class="row"><h3>نوبت‌های من</h3><button id="refresh" class="btn">به‌روزرسانی</button></div><div id="appointmentList"><div class="muted">در حال دریافت...</div></div></div>
<div class="card"><h3>🗓️ برنامه کاری</h3><div class="formgrid"><label>تاریخ<input id="slotDate" type="date"></label><label>شروع<input id="slotStart" type="time"></label><label>پایان<input id="slotEnd" type="time"></label><label>وضعیت<select id="slotActive"><option value="true">فعال</option><option value="false">غیرفعال</option></select></label></div><div class="actions"><button id="saveSlot" class="btn green">ثبت زمان کاری</button></div><div id="slots"></div></div>
</section>
<section id="finance" class="tabpage hidden"><div class="card"><h3>💰 خلاصه مالی</h3><div id="financeSummary"></div></div><div class="card"><h3>📄 سوابق تسویه</h3><div id="settlements"></div></div></section>
<section id="profile" class="tabpage hidden"><div class="card"><h3>👤 پروفایل حرفه‌ای</h3><div class="formgrid"><label>نام<input id="pname"></label><label>تخصص<input id="pspecialty"></label><label>تحصیلات<input id="peducation"></label><label>لینک تصویر<input id="pphoto"></label></div><label style="display:block;margin-top:10px">معرفی<textarea id="pbio" rows="5"></textarea></label><div class="actions"><button id="saveProfile" class="btn">ذخیره پروفایل</button></div></div></section>
</section>
</main>

<script>
(function(){
function el(id){return document.getElementById(id)}
function show(t,b){var m=el('msg');m.className='msg '+(b?'err':'');m.textContent=t}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){document.querySelectorAll('.tabpage').forEach(function(x){x.classList.add('hidden')});document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.remove('active')});var t=el(b.dataset.tab);if(t)t.classList.remove('hidden');b.classList.add('active');return}
});
window.addEventListener('error',function(e){show('خطای JavaScript: '+(e.message||'نامشخص'),true)});
window.addEventListener('unhandledrejection',function(e){show('خطای عملیات: '+(e.reason&&e.reason.message||e.reason||'نامشخص'),true)});
window.panelShow=show;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
if(!window.supabase||!window.supabase.createClient){panelShow('کتابخانه اتصال به سرور بارگذاری نشد. صفحه را یک‌بار تازه‌سازی کنید.',true);return}
var db=window.supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
var $=function(id){return document.getElementById(id)},fmt=function(n){return Number(n||0).toLocaleString('fa-IR')},esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function badge(s){var m={pending:['در انتظار',''],confirmed:['تأییدشده','ok'],completed:['انجام‌شده','ok'],cancelled:['لغوشده','bad'],in_progress:['در حال برگزاری','']};var x=m[s]||[s||'—',''];return '<span class="badge '+x[1]+'">'+esc(x[0])+'</span>'}
function dateText(v){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'}).format(new Date(v))}catch(e){return v}}
async function rpc(name,args){var r=await db.rpc(name,args||{});if(r.error)throw r.error;return r.data}
async function loadAppointments(){
 var data=await rpc('get_my_consultant_appointments');window.__appointments=data||[];
 $('appointmentList').innerHTML=window.__appointments.length?window.__appointments.map(function(x){
 var session=x.session||null;
 var action=x.status==='pending'?'<button class="btn green" data-a="'+x.id+'" data-s="confirmed">تأیید نوبت</button><button class="btn red" data-a="'+x.id+'" data-s="cancelled">لغو نوبت</button>':x.status==='confirmed'?'<button class="btn orange" data-start="'+x.id+'">▶️ شروع جلسه</button>':'';
 var sessionHtml=session&&session.status==='in_progress'?'<div class="msg"><b>🟢 جلسه در حال برگزاری</b><div class="actions"><button class="btn green" data-finish="'+x.id+'">پایان جلسه</button><button class="btn red" data-cancel-session="'+x.id+'">لغو جلسه</button></div></div>':session&&session.status==='completed'?'<div class="msg">✅ جلسه انجام شد — '+fmt(session.duration_minutes)+' دقیقه</div>':'';
 return '<article class="appointment"><div class="row"><div><b>'+esc(dateText(x.scheduled_at))+'</b><div class="muted">مبلغ: '+fmt(x.amount)+' تومان · پرداخت: '+esc(x.payment_status||'—')+'</div></div>'+badge(x.status)+'</div><div style="margin-top:8px"><b>علت مراجعه:</b> '+esc(x.client_reason||'ثبت نشده')+'</div><div class="actions">'+action+'</div>'+sessionHtml+'</article>'
 }).join(''):'<div class="muted">نوبتی برای نمایش وجود ندارد.</div>';
}
async function loadDashboard(){
 var d=await rpc('get_my_consultant_dashboard');var p=d&&d[0];if(!p)throw new Error('این حساب هنوز به یک مشاور متصل نشده است.');
 $('app').classList.remove('hidden');$('who').textContent=p.consultant_name+' — '+(p.specialty||'مشاور');$('up').textContent=fmt(p.upcoming_count);$('done').textContent=fmt(p.completed_count);$('pending').textContent=fmt(p.pending_count);$('earned').textContent=fmt(p.total_earned)+' تومان';
}
async function loadFinance(){var z=(await rpc('get_my_consultant_financial_summary')||[])[0]||{};$('financeSummary').innerHTML='<div class="formgrid"><div class="card">تعداد نوبت<br><b>'+fmt(z.appointment_count)+'</b></div><div class="card">پرداخت‌شده<br><b>'+fmt(z.paid_count)+'</b></div><div class="card">مبلغ کل<br><b>'+fmt(z.total_amount)+' تومان</b></div><div class="card">دریافتی پرداخت‌شده<br><b>'+fmt(z.paid_amount)+' تومان</b></div></div>';var rows=await rpc('get_my_consultant_settlements');$('settlements').innerHTML=(rows||[]).map(function(x){return '<div class="appointment"><b>'+esc(x.period_from)+' تا '+esc(x.period_to)+'</b><div>کارکرد: '+fmt(x.gross_amount)+' · حق‌العمل: '+fmt(x.commission_amount)+' · خالص: '+fmt(x.net_amount)+' تومان</div><div class="muted">وضعیت: '+esc(x.status)+'</div></div>'}).join('')||'<div class="muted">هنوز تسویه‌ای ثبت نشده است.</div>'}
async function loadProfile(){var p=(await rpc('get_my_consultant_profile')||[])[0];if(!p)return;$('pname').value=p.name||'';$('pspecialty').value=p.specialty||'';$('peducation').value=p.education||'';$('pphoto').value=p.photo_url||'';$('pbio').value=p.bio||''}
async function loadSlots(){try{var rows=await rpc('get_my_consultant_slots');$('slots').innerHTML=(rows||[]).slice(0,30).map(function(x){return '<div class="appointment"><b>'+esc(x.slot_date)+'</b> · '+esc(String(x.start_time).slice(0,5))+' تا '+esc(String(x.end_time).slice(0,5))+' <span class="badge">'+esc(x.slot_status||'')+'</span></div>'}).join('')||'<div class="muted">برنامه‌ای ثبت نشده است.</div>'}catch(e){$('slots').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function loadAll(){try{await loadDashboard();await Promise.all([loadAppointments(),loadFinance(),loadProfile(),loadSlots()]);panelShow('اطلاعات پنل با موفقیت بارگذاری شد.')}catch(e){panelShow('خطا در بارگذاری پنل: '+(e.message||e),true)}}
document.addEventListener('click',async function(e){
 var b=e.target.closest('button');if(!b)return;
 try{
  if(b.dataset.a){var note=prompt('یادداشت نوبت (اختیاری):','')||'';await rpc('update_my_consultant_appointment',{p_appointment_id:b.dataset.a,p_status:b.dataset.s,p_notes:note});panelShow('وضعیت نوبت ذخیره شد.');await loadAll();return}
  if(b.dataset.start){await rpc('start_my_consultant_session',{p_appointment_id:b.dataset.start});panelShow('جلسه شروع شد.');await loadAll();return}
  if(b.dataset.finish){var note2=prompt('یادداشت نهایی جلسه (اختیاری):','')||'';await rpc('finish_my_consultant_session',{p_appointment_id:b.dataset.finish,p_session_note:note2});panelShow('جلسه پایان یافت و ثبت شد.');await loadAll();return}
  if(b.dataset.cancelSession){var note3=prompt('علت لغو جلسه (اختیاری):','')||'';await rpc('finish_my_consultant_session',{p_appointment_id:b.dataset.cancelSession,p_session_note:note3,p_status:'cancelled'});panelShow('جلسه لغو شد.');await loadAll();return}
  if(b.id==='refresh'){await loadAll();return}
  if(b.id==='saveProfile'){await rpc('update_my_consultant_profile',{p_name:$('pname').value,p_specialty:$('pspecialty').value,p_bio:$('pbio').value,p_education:$('peducation').value,p_photo_url:$('pphoto').value});panelShow('پروفایل ذخیره شد.');return}
  if(b.id==='saveSlot'){if(!$('slotDate').value||!$('slotStart').value||!$('slotEnd').value){panelShow('تاریخ و ساعت را کامل کنید.',true);return}await rpc('save_my_consultant_slot',{p_id:null,p_slot_date:$('slotDate').value,p_start_time:$('slotStart').value,p_end_time:$('slotEnd').value,p_is_active:$('slotActive').value==='true'});panelShow('زمان کاری ثبت شد.');await loadSlots();return}
  if(b.id==='logout'){await db.auth.signOut();location.href='/admin.html';return}
 }catch(err){panelShow('خطا: '+(err.message||err),true)}
});
(async function(){try{var a=await db.auth.getUser();if(a.error)throw a.error;if(!a.data||!a.data.user){panelShow('حساب وارد نشده است. ابتدا وارد شوید.',true);$('who').textContent='حساب وارد نشده';return}await loadAll()}catch(e){panelShow('خطا در اتصال: '+(e.message||e),true)}})();
})();
</script>
</body></html>
