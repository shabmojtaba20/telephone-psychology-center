<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت | مرکز مشاوره تلفنی روان</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.side{position:fixed;right:0;top:0;bottom:0;width:240px;background:#111827;color:#fff;padding:16px;box-sizing:border-box}.side button{width:100%;padding:12px;margin:3px 0;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:right;cursor:pointer}.side button.active,.side button:hover{background:#29304b;color:#fff}.logout{background:#991b1b!important;text-align:center!important}.main{margin-right:272px;padding:22px}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:14px}.stat b{display:block;font-size:24px;margin-top:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d6dbe5;border-radius:8px;margin:5px 0 10px}textarea{min-height:80px}.btn{border:0;border-radius:8px;background:#4f46e5;color:#fff;padding:9px 13px;margin:3px;cursor:pointer}.green{background:#15803d}.red{background:#b91c1c}.gray{background:#64748b}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}.notice{display:none;padding:11px;border-radius:9px;margin-bottom:12px;background:#ecfdf5;color:#166534}.notice.err{background:#fff1f2;color:#9f1239}.mobile{display:none}@media(max-width:700px){.side{display:none}.side.open{display:block;width:255px;z-index:20}.main{margin:0;padding:12px}.mobile{display:flex;background:#111827;color:#fff;padding:10px;justify-content:space-between;position:sticky;top:0;z-index:10}.grid,.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mobile"><b>پنل مدیریت</b><button class="btn" id="menuBtn">☰ منو</button></div>
<aside id="side" class="side">
<h2>مرکز مشاوره تلفنی روان</h2>
<button class="nav active" data-page="dashboard">🏠 داشبورد</button>
<button class="nav" data-page="appointments">📅 نوبت‌ها</button>
<button class="nav" data-page="consultants">👨‍⚕️ مشاوران</button>
<button class="nav" data-page="services">🛎️ خدمات</button>
<button class="nav" data-page="finance">💰 مالی</button>
<button class="nav" data-page="general">⚙️ اطلاعات مرکز</button>
<button class="logout" id="logoutBtn">خروج</button>
</aside>
<main class="main">
<h1 id="title">داشبورد</h1><div id="notice" class="notice"></div>
<section id="dashboard" class="section active"><div class="grid">
<div class="card stat">کل نوبت‌ها<b id="nAppointments">۰</b></div><div class="card stat">مشاوران فعال<b id="nConsultants">۰</b></div><div class="card stat">خدمات فعال<b id="nServices">۰</b></div><div class="card stat">درآمد پرداخت‌شده<b id="nIncome">۰</b></div>
</div></section>
<section id="appointments" class="section"><div class="card"><h2>مدیریت نوبت‌ها</h2><div class="table"><table><thead><tr><th>زمان</th><th>مشاور</th><th>وضعیت نوبت</th><th>پرداخت</th><th>مبلغ</th><th>عملیات</th></tr></thead><tbody id="appointmentsList"></tbody></table></div></div></section>
<section id="consultants" class="section"><div class="card"><h2>مدیریت مشاوران</h2><button class="btn" id="addConsultant">➕ افزودن مشاور</button><div id="consultantForm"></div><div id="consultantsList"></div></div></section>
<section id="services" class="section"><div class="card"><h2>مدیریت خدمات</h2><button class="btn" id="addService">➕ افزودن خدمت</button><div id="serviceForm"></div><div id="servicesList"></div></div></section>
<section id="finance" class="section"><div class="grid"><div class="card stat">درآمد پرداخت‌شده<b id="financeIncome">۰</b></div><div class="card stat">تعداد تراکنش<b id="financeCount">۰</b></div></div><div class="card"><h2>تراکنش‌های مالی</h2><div class="table"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>درگاه</th><th>مبلغ</th><th>وضعیت</th><th>پیگیری</th></tr></thead><tbody id="financeList"></tbody></table></div></div></section>
<section id="general" class="section"><div class="card"><h2>اطلاعات مرکز</h2><div class="fields"><label>نام مرکز<input id="g_name"></label><label>تلفن<input id="g_phone"></label><label>موبایل<input id="g_mobile"></label><label>ایمیل<input id="g_email"></label></div><label>معرفی<textarea id="g_desc"></textarea></label><button class="btn green" id="saveGeneral">ذخیره اطلاعات</button></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
const $=id=>document.getElementById(id); const money=n=>Number(n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t,bad=false){const e=$('notice');e.textContent=t;e.className='notice'+(bad?' err':'');e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='/admin-login.html';return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){note('این حساب دسترسی مدیر ندارد.',true);return false}return true}
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(b.dataset.page).classList.add('active');$('title').textContent=b.textContent.trim();$('side').classList.remove('open');load()});
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.href='/admin-login.html'};
async function load(){if(!(await guard()))return;try{
const [a,c,s,t,g]=await Promise.all([
db.from('appointments').select('id,scheduled_at,status,payment_status,amount,consultant_id').order('scheduled_at',{ascending:false}),
db.from('consultants').select('id,name,specialty,bio,is_active,sort_order,education,photo_url').order('sort_order'),
db.from('services').select('id,name,description,duration_minutes,price,is_active,sort_order').order('sort_order'),
db.from('finance_transactions').select('id,transaction_type,amount,status,gateway,tracking_code,occurred_at,currency').order('occurred_at',{ascending:false}).limit(100),
db.from('center_public_settings').select('*').eq('id',1).maybeSingle()]);
for(const r of [a,c,s,t])if(r.error)throw r.error; const A=a.data||[],C=c.data||[],S=s.data||[],T=t.data||[];
$('nAppointments').textContent=money(A.length);$('nConsultants').textContent=money(C.filter(x=>x.is_active).length);$('nServices').textContent=money(S.filter(x=>x.is_active).length);const income=T.filter(x=>x.status==='paid').reduce((z,x)=>z+Number(x.amount||0),0);$('nIncome').textContent=money(income);$('financeIncome').textContent=money(income);$('financeCount').textContent=money(T.length);
const names=Object.fromEntries(C.map(x=>[x.id,x.name]));
$('appointmentsList').innerHTML=A.length?A.map(x=>`<tr><td>${new Date(x.scheduled_at).toLocaleString('fa-IR')}</td><td>${esc(names[x.consultant_id]||'انتخاب نشده')}</td><td><select data-action="astatus" data-id="${x.id}"><option value="pending" ${x.status==='pending'?'selected':''}>در انتظار</option><option value="confirmed" ${x.status==='confirmed'?'selected':''}>تأیید شده</option><option value="completed" ${x.status==='completed'?'selected':''}>انجام شده</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>لغو شده</option></select></td><td><select data-action="payment" data-id="${x.id}"><option value="pending" ${x.payment_status==='pending'?'selected':''}>در انتظار</option><option value="paid" ${x.payment_status==='paid'?'selected':''}>پرداخت شده</option><option value="failed" ${x.payment_status==='failed'?'selected':''}>ناموفق</option><option value="refunded" ${x.payment_status==='refunded'?'selected':''}>مرجوعی</option></select></td><td>${money(x.amount)} تومان</td><td><button class="btn red" data-action="deleteAppointment" data-id="${x.id}">حذف</button></td></tr>`).join(''):'<tr><td colspan="6">هنوز نوبتی ثبت نشده است.</td></tr>';
$('consultantsList').innerHTML=C.length?C.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${esc(x.specialty||'')} — ${x.is_active?'فعال':'غیرفعال'}${x.education?'<br>'+esc(x.education):''}<br><button class="btn" data-action="editConsultant" data-id="${x.id}">ویرایش</button><button class="btn red" data-action="deleteConsultant" data-id="${x.id}">حذف</button></div>`).join(''):'هنوز مشاوری ثبت نشده است.';
$('servicesList').innerHTML=S.length?S.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${money(x.price)} تومان — ${Number(x.duration_minutes||0)} دقیقه — ${x.is_active?'فعال':'غیرفعال'}${x.description?'<br>'+esc(x.description):''}<br><button class="btn" data-action="editService" data-id="${x.id}">ویرایش</button><button class="btn red" data-action="deleteService" data-id="${x.id}">حذف</button></div>`).join(''):'هنوز خدمتی ثبت نشده است.';
$('financeList').innerHTML=T.length?T.map(x=>`<tr><td>${new Date(x.occurred_at).toLocaleString('fa-IR')}</td><td>${esc(x.transaction_type)}</td><td>${esc(x.gateway||'')}</td><td>${money(x.amount)} ${esc(x.currency||'تومان')}</td><td>${esc(x.status)}</td><td>${esc(x.tracking_code||'')}</td></tr>`).join(''):'<tr><td colspan="6">هنوز تراکنشی ثبت نشده است.</td></tr>';
if(g.data){$('g_name').value=g.data.center_name||'';$('g_phone').value=g.data.phone||'';$('g_mobile').value=g.data.mobile||'';$('g_email').value=g.data.email||'';$('g_desc').value=g.data.description||''}
}catch(e){note(e.message||'خطا در دریافت اطلاعات',true)}}
async function updateAppointment(id,field,value){const v={};v[field]=value;v.updated_at=new Date().toISOString();const r=await db.from('appointments').update(v).eq('id',id);if(r.error)note(r.error.message,true);else{note('نوبت به‌روزرسانی شد');load()}}
$('appointmentsList').addEventListener('change',e=>{if(e.target.dataset.action==='astatus')updateAppointment(e.target.dataset.id,'status',e.target.value);if(e.target.dataset.action==='payment')updateAppointment(e.target.dataset.id,'payment_status',e.target.value)});
$('appointmentsList').addEventListener('click',async e=>{const b=e.target.closest('[data-action="deleteAppointment"]');if(!b)return;if(!confirm('نوبت حذف شود؟'))return;const r=await db.from('appointments').delete().eq('id',b.dataset.id);if(r.error)note(r.error.message,true);else{note('نوبت حذف شد');load()}});
let consultants=[];let services=[];
$('addConsultant').onclick=()=>consultantForm(); $('addService').onclick=()=>serviceForm();
function consultantForm(x=null){$('consultantForm').innerHTML=`<div class="item"><input id="cid" type="hidden" value="${x?.id||''}"><div class="fields"><label>نام<input id="cname" value="${esc(x?.name||'')}"></label><label>تخصص<input id="cspecialty" value="${esc(x?.specialty||'')}"></label><label>تحصیلات<input id="cedu" value="${esc(x?.education||'')}"></label><label>لینک عکس<input id="cphoto" value="${esc(x?.photo_url||'')}"></label></div><label>رزومه<textarea id="cbio">${esc(x?.bio||'')}</textarea></label><label><input id="cactive" type="checkbox" ${x?.is_active!==false?'checked':''}> فعال</label><br><button class="btn green" id="saveC">ذخیره</button><button class="btn gray" id="cancelC">انصراف</button></div>`;$('cancelC').onclick=()=>$('consultantForm').innerHTML='';$('saveC').onclick=saveConsultant}
async function saveConsultant(){const id=$('cid').value;const v={name:$('cname').value.trim(),specialty:$('cspecialty').value.trim(),bio:$('cbio').value,education:$('cedu').value.trim(),photo_url:$('cphoto').value.trim(),is_active:$('cactive').checked};if(!v.name)return note('نام مشاور الزامی است',true);const r=id?await db.from('consultants').update(v).eq('id',id):await db.from('consultants').insert({...v,sort_order:0});if(r.error)note(r.error.message,true);else{$('consultantForm').innerHTML='';note('مشاور ذخیره شد');load()}}
$('consultantsList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=consultants.find(y=>y.id===b.dataset.id);if(b.dataset.action==='editConsultant')consultantForm(x);if(b.dataset.action==='deleteConsultant')deleteConsultant(b.dataset.id)});
async function deleteConsultant(id){if(!confirm('مشاور حذف شود؟'))return;const r=await db.from('consultants').delete().eq('id',id);if(r.error)note(r.error.message,true);else{note('مشاور حذف شد');load()}}
function serviceForm(x=null){$('serviceForm').innerHTML=`<div class="item"><input id="sid" type="hidden" value="${x?.id||''}"><div class="fields"><label>نام خدمت<input id="sname" value="${esc(x?.name||'')}"></label><label>مدت (دقیقه)<input id="sduration" type="number" value="${x?.duration_minutes||30}"></label><label>قیمت (تومان)<input id="sprice" type="number" value="${x?.price||0}"></label></div><label>توضیحات<textarea id="sdesc">${esc(x?.description||'')}</textarea></label><label><input id="sactive" type="checkbox" ${x?.is_active!==false?'checked':''}> فعال</label><br><button class="btn green" id="saveS">ذخیره</button><button class="btn gray" id="cancelS">انصراف</button></div>`;$('cancelS').onclick=()=>$('serviceForm').innerHTML='';$('saveS').onclick=saveService}
async function saveService(){const id=$('sid').value;const v={name:$('sname').value.trim(),description:$('sdesc').value,duration_minutes:Number($('sduration').value||30),price:Number($('sprice').value||0),is_active:$('sactive').checked};if(!v.name)return note('نام خدمت الزامی است',true);const r=id?await db.from('services').update(v).eq('id',id):await db.from('services').insert({...v,sort_order:0});if(r.error)note(r.error.message,true);else{$('serviceForm').innerHTML='';note('خدمت ذخیره شد');load()}}
$('servicesList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=services.find(y=>y.id===b.dataset.id);if(b.dataset.action==='editService')serviceForm(x);if(b.dataset.action==='deleteService')deleteService(b.dataset.id)});
async function deleteService(id){if(!confirm('خدمت حذف شود؟'))return;const r=await db.from('services').delete().eq('id',id);if(r.error)note(r.error.message,true);else{note('خدمت حذف شد');load()}}
$('saveGeneral').onclick=async()=>{const v={id:1,center_name:$('g_name').value.trim(),phone:$('g_phone').value.trim(),mobile:$('g_mobile').value.trim(),email:$('g_email').value.trim(),description:$('g_desc').value};const r=await db.from('center_public_settings').upsert(v,{onConflict:'id'});if(r.error)note(r.error.message,true);else note('اطلاعات مرکز ذخیره شد')};
async function preload(){const c=await db.from('consultants').select('*').order('sort_order');if(!c.error)consultants=c.data||[];const s=await db.from('services').select('*').order('sort_order');if(!s.error)services=s.data||[];load()}
preload();
</script>
</body></html>
