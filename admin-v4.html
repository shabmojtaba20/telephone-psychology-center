<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | مرکز مشاوره تلفنی روان</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f6fb;color:#182033}.wrap{min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:250px;background:#111827;color:#fff;padding:16px;z-index:20;box-sizing:border-box}.side h2{font-size:17px}.side button{width:100%;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:right;padding:11px;margin:3px 0;cursor:pointer}.side button.active,.side button:hover{background:#29304b;color:#fff}.main{margin-right:282px;padding:24px}.section{display:none}.section.active{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:24px;margin-top:8px}.btn{border:0;border-radius:9px;background:#5b5bd6;color:#fff;padding:10px 14px;cursor:pointer;margin:3px}.danger{background:#b91c1c}.item{border:1px solid #e5e7eb;border-radius:11px;padding:13px;margin:8px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d9dee8;border-radius:8px;padding:10px;margin:5px 0 10px}textarea{min-height:90px}.error{display:none;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;padding:12px;border-radius:10px;margin-bottom:12px}.mobile{display:none}@media(max-width:700px){.side{display:none}.side.open{display:block;width:260px;box-shadow:-8px 0 30px #0005}.main{margin:0;padding:12px}.mobile{display:flex;position:sticky;top:0;z-index:15;background:#111827;color:#fff;padding:10px;justify-content:space-between}.grid,.fields{grid-template-columns:1fr}}</style></head><body><div class="mobile"><b>پنل مدیریت</b><button class="btn" onclick="toggleMenu()">☰</button></div><aside id="side" class="side"><h2>مرکز مشاوره تلفنی روان</h2><button class="nav active" data-s="dashboard">🏠 داشبورد</button><button class="nav" data-s="appointments">📅 نوبت‌ها</button><button class="nav" data-s="consultants">👨‍⚕️ مشاوران</button><button class="nav" data-s="services">🛎️ خدمات</button><button class="nav" data-s="finance">💰 مالی</button><button class="nav" data-s="general">⚙️ اطلاعات مرکز</button><button class="danger" onclick="logout()">خروج</button></aside><main class="main"><h1 id="title">داشبورد</h1><div id="error" class="error"></div><section id="dashboard" class="section active"><div class="grid"><div class="card stat">نوبت‌ها<b id="ac">۰</b></div><div class="card stat">مشاوران فعال<b id="cc">۰</b></div><div class="card stat">خدمات فعال<b id="sc">۰</b></div><div class="card stat">درآمد پرداخت‌شده<b id="inc">۰</b></div></div></section><section id="appointments" class="section"><div class="card"><h2>نوبت‌ها</h2><div id="appointmentsList"></div></div></section><section id="consultants" class="section"><div class="card"><h2>مدیریت مشاوران</h2><button class="btn" onclick="consultantForm()">➕ افزودن مشاور</button><div id="consultantForm"></div><div id="consultantsList"></div></div></section><section id="services" class="section"><div class="card"><h2>مدیریت خدمات</h2><button class="btn" onclick="serviceForm()">➕ افزودن خدمت</button><div id="serviceForm"></div><div id="servicesList"></div></div></section><section id="finance" class="section"><div class="card"><h2>داشبورد مالی</h2><p>درآمد پرداخت‌شده: <b id="financeIncome">۰</b> تومان</p></div></section><section id="general" class="section"><div class="card"><h2>اطلاعات مرکز</h2><div class="fields"><label>نام مرکز<input id="g_name"></label><label>تلفن<input id="g_phone"></label><label>موبایل<input id="g_mobile"></label><label>ایمیل<input id="g_email"></label></div><label>معرفی<textarea id="g_desc"></textarea></label><button class="btn" onclick="saveGeneral()">ذخیره</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('fa-IR');function err(x){$('error').textContent='خطا: '+x;$('error').style.display='block'}function toggleMenu(){$('side').classList.toggle('open')}function show(id,button){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('title').textContent=button.textContent.trim();$('side').classList.remove('open');if(id==='consultants'||id==='services'||id==='dashboard'||id==='appointments'||id==='finance')load()}document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s,b)));async function isAdmin(){const r=await sb.rpc('is_admin');return !r.error&&r.data===true}async function load(){try{const r=await Promise.all([sb.from('appointments').select('id,scheduled_at,status,payment_status,amount').order('scheduled_at',{ascending:false}),sb.from('consultants').select('id,name,specialty,bio,is_active,sort_order').order('sort_order'),sb.from('services').select('id,name,description,duration_minutes,price,is_active,sort_order').order('sort_order'),sb.from('finance_transactions').select('amount,status').limit(100)]);r.forEach(x=>{if(x.error)throw x.error});const A=r[0].data||[],C=r[1].data||[],S=r[2].data||[],T=r[3].data||[]);$('ac').textContent=money(A.length);$('cc').textContent=money(C.filter(x=>x.is_active).length);$('sc').textContent=money(S.filter(x=>x.is_active).length);const income=T.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0);$('inc').textContent=money(income);$('financeIncome').textContent=money(income);$('appointmentsList').innerHTML=A.length?A.map(x=>'<div class="item">'+new Date(x.scheduled_at).toLocaleString('fa-IR')+' | '+(x.status||'')+' | '+money(x.amount)+' تومان</div>').join(''):'هنوز نوبتی ثبت نشده است.';$('consultantsList').innerHTML=C.length?C.map(x=>'<div class="item"><b>'+safe(x.name)+'</b><br>'+safe(x.specialty||'')+' — '+(x.is_active?'فعال':'غیرفعال')+'<br><button class="btn" onclick="consultantForm(\''+x.id+'\',\''+js(x.name)+'\',\''+js(x.specialty||'')+'\',\''+js(x.bio||'')+'\','+x.is_active+')">ویرایش</button> <button class="btn danger" onclick="removeConsultant(\''+x.id+'\')">حذف</button></div>').join(''):'هنوز مشاوری ثبت نشده است.';$('servicesList').innerHTML=S.length?S.map(x=>'<div class="item"><b>'+safe(x.name)+'</b><br>'+Number(x.duration_minutes||0)+' دقیقه — '+money(x.price)+' تومان — '+(x.is_active?'فعال':'غیرفعال')+'<br><button class="btn" onclick="serviceForm(\''+x.id+'\',\''+js(x.name)+'\',\''+js(x.description||'')+'\','+Number(x.duration_minutes||30)+','+Number(x.price||0)+','+x.is_active+')">ویرایش</button> <button class="btn danger" onclick="removeService(\''+x.id+'\')">حذف</button></div>').join(''):'هنوز خدمتی ثبت نشده است.'}catch(e){err(e.message)}}function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function js(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' ')}function consultantForm(id='',name='',specialty='',bio='',active=true){$('consultantForm').innerHTML='<div class="item"><input id="cid" type="hidden" value="'+id+'"><label>نام<input id="cname" value="'+safe(name)+'"></label><label>تخصص<input id="cspecialty" value="'+safe(specialty)+'"></label><label>رزومه<textarea id="cbio">'+safe(bio)+'</textarea></label><label><input id="cactive" type="checkbox" '+(active?'checked':'')+'> فعال</label><button class="btn" onclick="saveConsultant()">ذخیره</button></div>'}async function saveConsultant(){const id=$('cid').value,v={name:$('cname').value.trim(),specialty:$('cspecialty').value.trim(),bio:$('cbio').value,is_active:$('cactive').checked};if(!v.name)return alert('نام را وارد کنید');const r=id?await sb.from('consultants').update(v).eq('id',id):await sb.from('consultants').insert({...v,sort_order:0});if(r.error)return alert(r.error.message);$('consultantForm').innerHTML='';load()}async function removeConsultant(id){if(!confirm('حذف شود؟'))return;const r=await sb.from('consultants').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}function serviceForm(id='',name='',desc='',duration=30,price=0,active=true){$('serviceForm').innerHTML='<div class="item"><input id="sid" type="hidden" value="'+id+'"><label>نام خدمت<input id="sname" value="'+safe(name)+'"></label><label>توضیحات<textarea id="sdesc">'+safe(desc)+'</textarea></label><div class="fields"><label>مدت<input id="sduration" type="number" value="'+duration+'"></label><label>قیمت<input id="sprice" type="number" value="'+price+'"></label></div><label><input id="sactive" type="checkbox" '+(active?'checked':'')+'> فعال</label><br><button class="btn" onclick="saveService()">ذخیره</button></div>'}async function saveService(){const id=$('sid').value,v={name:$('sname').value.trim(),description:$('sdesc').value,duration_minutes:Number($('sduration').value||30),price:Number($('sprice').value||0),is_active:$('sactive').checked};if(!v.name)return alert('نام خدمت را وارد کنید');const r=id?await sb.from('services').update(v).eq('id',id):await sb.from('services').insert({...v,sort_order:0});if(r.error)return alert(r.error.message);$('serviceForm').innerHTML='';load()}async function removeService(id){if(!confirm('حذف شود؟'))return;const r=await sb.from('services').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}async function saveGeneral(){const v={id:1,center_name:$('g_name').value,phone:$('g_phone').value,mobile:$('g_mobile').value,email:$('g_email').value,description:$('g_desc').value,updated_at:new Date().toISOString()};const r=await sb.from('center_public_settings').upsert(v);if(r.error)alert(r.error.message);else alert('ذخیره شد')}async function logout(){await sb.auth.signOut();location.replace('/admin-login.html')}async function boot(){const s=await sb.auth.getSession();if(!s.data.session||!(await isAdmin())){location.replace('/admin-login.html');return}await load()}boot();</script></body></html>
