<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوابق مالی و رسیدها</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1400px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #10182808}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h1{margin-left:auto}.btn{border:0;border-radius:9px;background:#4f46e5;color:#fff;padding:9px 13px;cursor:pointer;font:inherit}.muted{color:#667085;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:right;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.green{background:#15803d}.red{background:#b91c1c}.receipt{color:#3730a3;text-decoration:none}.notice{padding:11px;border-radius:10px;background:#ecfdf5;color:#166534;margin-bottom:12px}.err{background:#fff1f2;color:#9f1239}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;padding:25px;box-sizing:border-box}.modal.open{display:flex;align-items:center;justify-content:center}.modalbox{background:#fff;border-radius:16px;width:min(1000px,96vw);height:min(850px,92vh);display:flex;flex-direction:column}.modalhead{padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.modalbody{flex:1;overflow:auto;padding:10px;text-align:center}.modalbody img{max-width:100%;max-height:100%;object-fit:contain}.modalbody iframe{width:100%;height:100%;border:0}</style></head>
<body><div class="wrap"><div id="notice"></div><section class="card"><div class="toolbar"><h1>📜 سوابق عملیات مالی</h1><button class="btn" onclick="loadAll()">🔄 بروزرسانی</button><a class="btn" href="/admin-v5.html">بازگشت به پنل مالی</a></div><p class="muted">این بخش فقط برای مشاهده است. سوابق حسابداری به‌صورت append-only ثبت می‌شوند و عملیات تغییر/حذف از سطح کاربر مالی مسدود است.</p><div class="table"><table><thead><tr><th>تاریخ</th><th>مدیر</th><th>عملیات</th><th>رسید</th><th>توضیح</th><th>جزئیات تغییر</th></tr></thead><tbody id="audit"></tbody></table></div></section><section class="card"><div class="toolbar"><h2 style="margin-left:auto">🧾 رسیدهای پرداخت</h2></div><div class="table"><table><thead><tr><th>مبلغ</th><th>وضعیت</th><th>کد پیگیری</th><th>فایل رسید</th><th>ثبت</th></tr></thead><tbody id="receipts"></tbody></table></div></section></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><b id="modalTitle">پیش‌نمایش رسید</b><button class="btn red" onclick="closeModal()">بستن</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n||0).toLocaleString('fa-IR');
function note(t,b=false){$('notice').className=b?'notice err':'notice';$('notice').textContent=t;}
async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html?redirect=/finance-audit.html');return false}const role=sessionStorage.getItem('activeAdminRole')||'finance_manager';const{data:ok}=await db.rpc('has_admin_role_permission',{p_role:role,p_permission:'finance.view'});if(ok!==true){note('این حساب دسترسی مشاهده سوابق مالی را ندارد.',true);setTimeout(()=>location.replace('/admin-professional.html'),900);return false}return true}
function badge(s){return '<span class="badge">'+esc(s||'—')+'</span>'}
async function loadAudit(){const r=await db.from('finance_audit_logs').select('id,actor_id,action,entity_type,entity_id,before_data,after_data,note,created_at').order('created_at',{ascending:false}).limit(200);if(r.error){$('audit').innerHTML='<tr><td colspan="6">'+esc(r.error.message)+'</td></tr>';return}const rows=r.data||[];$('audit').innerHTML=rows.length?rows.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('fa-IR')+'</td><td>'+esc(String(x.actor_id||'').slice(0,12))+'</td><td>'+badge(x.action)+'</td><td>'+esc(x.entity_type)+'<br><span class="muted">'+esc(x.entity_id)+'</span></td><td>'+esc(x.note||'—')+'</td><td><details><summary>مشاهده</summary><div class="muted">قبل: '+esc(JSON.stringify(x.before_data||{}))+'<br>بعد: '+esc(JSON.stringify(x.after_data||{}))+'</div></details></td></tr>').join(''):'<tr><td colspan="6">سابقه‌ای ثبت نشده است.</td></tr>'}
async function loadReceipts(){const r=await db.from('payment_receipts').select('id,amount,status,tracking_code,receipt_path,submitted_at').order('submitted_at',{ascending:false}).limit(100);if(r.error){$('receipts').innerHTML='<tr><td colspan="5">'+esc(r.error.message)+'</td></tr>';return}const rows=r.data||[];$('receipts').innerHTML=rows.length?rows.map(x=>'<tr><td>'+money(x.amount)+' تومان</td><td>'+badge(x.status)+'</td><td>'+esc(x.tracking_code||'—')+'</td><td>'+(x.receipt_path?'<button class="btn" onclick="previewReceipt(\\''+x.id+'\\')">مشاهده امن</button>':'—')+'</td><td>'+new Date(x.submitted_at).toLocaleString('fa-IR')+'</td></tr>').join(''):'<tr><td colspan="5">رسیدی ثبت نشده است.</td></tr>'}
async function previewReceipt(id){const r=await db.from('payment_receipts').select('receipt_path').eq('id',id).single();if(r.error||!r.data?.receipt_path)return note('فایل رسید پیدا نشد.',true);const s=await db.storage.from('payment-receipts').createSignedUrl(r.data.receipt_path,300);if(s.error)return note('ساخت لینک امن رسید ناموفق بود: '+s.error.message,true);const url=s.data.signedUrl;const ext=(r.data.receipt_path.split('.').pop()||'').toLowerCase();$('modalTitle').textContent='پیش‌نمایش امن رسید';$('modalBody').innerHTML=['jpg','jpeg','png','webp'].includes(ext)?'<img src="'+esc(url)+'" alt="رسید">':'<iframe src="'+esc(url)+'" title="رسید PDF"></iframe>';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open');$('modalBody').innerHTML=''}
async function loadAll(){if(!(await guard()))return;await Promise.all([loadAudit(),loadReceipts()])}loadAll();
</script></body></html>
