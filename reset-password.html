<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6557d8"><title>بازیابی رمز عبور | مرکز مشاوره تلفنی روان</title><style>:root{--p:#6557d8;--ink:#172033;--muted:#667085;--bg:#f7f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}.card{width:min(520px,calc(100% - 30px));margin:60px auto;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 8px 28px #18233a08}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 14px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--p);color:#fff;font:inherit;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}.msg{padding:10px;border-radius:9px;margin-top:14px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#b91c1c}.muted{color:var(--muted)}.hidden{display:none!important}.back{display:inline-block;margin-top:15px;color:var(--p)}</style></head><body><main class="card"><h1>بازیابی رمز عبور</h1><p id="status" class="muted">در حال بررسی لینک بازیابی…</p><section id="form" class="hidden"><label>رمز عبور جدید</label><input id="p1" type="password" autocomplete="new-password" minlength="8" placeholder="حداقل ۸ کاراکتر"><label>تکرار رمز عبور جدید</label><input id="p2" type="password" autocomplete="new-password" minlength="8" placeholder="تکرار رمز جدید"><button id="save" class="btn">ذخیره رمز جدید</button><p id="msg"></p></section><a class="back" href="/admin.html">بازگشت به ورود پنل مدیریت</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id);async function init(){try{const q=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'').replace(/^\//,''));const tokenHash=q.get('token_hash')||hash.get('token_hash');const type=q.get('type')||hash.get('type');if(tokenHash&&type==='recovery'){const{error}=await supabase.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});if(error)throw error}const{data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(!session){$('status').textContent='لینک بازیابی معتبر نیست یا منقضی شده است.';$('status').className='msg err';return}$('status').textContent='لینک معتبر است. رمز جدید را تعیین کنید.';$('form').classList.remove('hidden')}catch(e){$('status').textContent='خطا در تأیید لینک بازیابی: '+(e?.message||String(e));$('status').className='msg err'}}$('save').onclick=async()=>{const p1=$('p1').value,p2=$('p2').value;if(p1.length<8){$('msg').className='msg err';$('msg').textContent='رمز جدید باید حداقل ۸ کاراکتر باشد.';return}if(p1!==p2){$('msg').className='msg err';$('msg').textContent='دو رمز یکسان نیستند.';return}$('save').disabled=true;$('msg').className='';$('msg').textContent='در حال ذخیره…';const{error}=await supabase.auth.updateUser({password:p1});$('save').disabled=false;if(error){$('msg').className='msg err';$('msg').textContent='ذخیره رمز انجام نشد: '+error.message;return}$('msg').className='msg ok';$('msg').textContent='رمز عبور با موفقیت تغییر کرد. در حال انتقال…';await supabase.auth.signOut();setTimeout(()=>location.href='/admin.html',900)};init();</script></body></html>
