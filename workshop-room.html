<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق کارگاه آنلاین</title><style>body{margin:0;background:#111827;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.red{background:#b91c1c}.btn.gray{background:#374151}.videos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.tile{background:#1f2937;border-radius:14px;overflow:hidden;min-height:250px;position:relative}.tile video{width:100%;height:100%;min-height:250px;object-fit:cover;background:#000}.name{position:absolute;right:10px;bottom:10px;background:#0009;padding:5px 9px;border-radius:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.status{color:#a7f3d0}.hint{color:#cbd5e1;font-size:13px;line-height:2}.count{color:#bfdbfe;font-size:13px}@media(max-width:700px){.videos{grid-template-columns:1fr}.tile,.tile video{min-height:210px}}</style></head><body><div class="wrap"><div class="bar"><div><h2 id="title">اتاق کارگاه</h2><div id="status" class="status">در حال اتصال...</div><div id="count" class="count">شرکت‌کنندگان آنلاین: 1</div></div><button class="btn gray" onclick="location.href='/education.html'">بازگشت</button></div><div class="controls"><button class="btn" id="cam">🎥 دوربین</button><button class="btn" id="mic">🎙️ میکروفن</button><button class="btn red" id="leave">خروج از اتاق</button></div><p class="hint">تماس با WebRTC برقرار می‌شود. ابتدا از TURN ایرانیِ مرکز استفاده می‌شود و در صورت در دسترس نبودن، مسیرهای عمومی STUN به‌عنوان پشتیبان فعال هستند. رسانه تماس روی سرور وب ذخیره نمی‌شود.</p><div id="videos" class="videos"><div class="tile"><video id="local" autoplay muted playsinline></video><span class="name">شما</span></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://aserkyiwwyggtixckjsv.supabase.co',KEY='sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX',db=createClient(URL,KEY),params=new URLSearchParams(location.search),workshopId=params.get('workshop'),clientId=crypto.randomUUID();let channel,localStream;const peers=new Map(),local=document.getElementById('local'),statusEl=document.getElementById('status'),countEl=document.getElementById('count'),videos=document.getElementById('videos');let rtc={iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}],bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'};function send(type,payload,to){return channel?.send({type:'broadcast',event:type,payload:{...payload,from:clientId,to:to||'*'}})}function addVideo(id,stream){if(document.getElementById('tile-'+id))return;const d=document.createElement('div');d.className='tile';d.id='tile-'+id;d.innerHTML='<video id="v-'+id+'" autoplay playsinline></video><span class="name">شرکت‌کننده</span>';videos.appendChild(d);document.getElementById('v-'+id).srcObject=stream}function removePeer(id){const p=peers.get(id);if(p){p.pc.close();peers.delete(id)}document.getElementById('tile-'+id)?.remove()}function updateCount(){countEl.textContent='شرکت‌کنندگان آنلاین: '+(Object.keys(channel?.presenceState?.()||{}).length||1)}function ensurePeer(id){if(id===clientId)return null;if(peers.has(id))return peers.get(id);const polite=clientId>id,pc=new RTCPeerConnection(rtc),state={pc,polite,makingOffer:false,ignoreOffer:false,remoteDescriptionSet:false,pendingIce:[]};peers.set(id,state);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>e.candidate&&send('ice',{candidate:e.candidate},id);pc.ontrack=e=>e.streams[0]&&addVideo(id,e.streams[0]);pc.onnegotiationneeded=async()=>{try{state.makingOffer=true;await pc.setLocalDescription();send('offer',{sdp:pc.localDescription},id)}catch(e){}finally{state.makingOffer=false}};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))removePeer(id);else if(pc.connectionState==='disconnected')setTimeout(()=>{if(pc.connectionState==='disconnected')removePeer(id)},5000)};return state}async function flushIce(state){if(!state.remoteDescriptionSet)return;while(state.pendingIce.length){const c=state.pendingIce.shift();try{await state.pc.addIceCandidate(c)}catch(e){}}}async function handleOffer(payload){if(!payload?.from||payload.from===clientId||(payload.to&&payload.to!==clientId))return;const state=ensurePeer(payload.from),pc=state.pc;const offerCollision=state.makingOffer||pc.signalingState!=='stable';state.ignoreOffer=!state.polite&&offerCollision;if(state.ignoreOffer)return;await pc.setRemoteDescription(payload.sdp);state.remoteDescriptionSet=true;await flushIce(state);await pc.setLocalDescription();send('answer',{sdp:pc.localDescription},payload.from)}async function handleAnswer(payload){if(!payload?.from||payload.to!==clientId)return;const state=peers.get(payload.from);if(!state)return;await state.pc.setRemoteDescription(payload.sdp);state.remoteDescriptionSet=true;await flushIce(state)}async function handleIce(payload){if(!payload?.from||payload.from===clientId||(payload.to&&payload.to!==clientId))return;const state=ensurePeer(payload.from);if(!state||state.ignoreOffer)return;if(state.remoteDescriptionSet)try{await state.pc.addIceCandidate(payload.candidate)}catch(e){}else state.pendingIce.push(payload.candidate)}async function connectTo(id){if(id!==clientId)ensurePeer(id)}async function loadIceServers(session){try{const res=await fetch(URL+'/functions/v1/workshop-ice-servers?workshop='+encodeURIComponent(workshopId),{headers:{Authorization:'Bearer '+session.access_token,apikey:KEY}});if(res.ok){const data=await res.json();if(Array.isArray(data.iceServers)&&data.iceServers.length)rtc={...rtc,iceServers:data.iceServers};if(data.relayConfigured)statusEl.textContent='اتصال امن؛ مسیر ارتباطی ایران فعال شد'}return data}catch(e){console.warn('ICE server endpoint unavailable',e);return null}}async function start(){if(!workshopId)throw new Error('شناسه کارگاه مشخص نیست.');const{data:{session}}=await db.auth.getSession();if(!session){alert('برای ورود به کارگاه باید وارد حساب کاربری شوید.');location.href='/';return}const{data:r,error:re}=await db.from('workshop_registrations').select('id,payment_status').eq('workshop_id',workshopId).eq('user_id',session.user.id).maybeSingle();if(re||!r||!['free','paid'].includes(r.payment_status)){alert('دسترسی شما به این کارگاه تأیید نشده است.');location.href='/education.html';return}const{data:w,error:we}=await db.from('workshops').select('title,meeting_type,status,max_participants').eq('id',workshopId).single();if(we||!w)throw new Error('کارگاه پیدا نشد.');if(!['scheduled','live'].includes(w.status))throw new Error('این کارگاه فعال نیست.');document.getElementById('title').textContent=(w.meeting_type==='video'?'🎥 ':'🎙️ ')+w.title;await loadIceServers(session);localStream=await navigator.mediaDevices.getUserMedia({video:w.meeting_type==='video',audio:true});local.srcObject=localStream;await db.realtime.setAuth();channel=db.channel('workshop:'+workshopId+':call',{config:{private:true,presence:{key:clientId},broadcast:{ack:true}}});channel.on('presence',{event:'sync'},async()=>{updateCount();const state=channel.presenceState();for(const id of Object.keys(state))await connectTo(id)}).on('presence',{event:'join'},async({key})=>{updateCount();await connectTo(key)}).on('presence',{event:'leave'},({key})=>{updateCount();removePeer(key)}).on('broadcast',{event:'offer'},({payload})=>handleOffer(payload).catch(()=>{})).on('broadcast',{event:'answer'},({payload})=>handleAnswer(payload).catch(()=>{})).on('broadcast',{event:'ice'},({payload})=>handleIce(payload).catch(()=>{})).subscribe(async s=>{if(s==='SUBSCRIBED'){if(!statusEl.textContent.includes('ایران'))statusEl.textContent='متصل؛ اتاق امن و آماده تماس است';await channel.track({userId:session.user.id,clientId,joinedAt:new Date().toISOString()});updateCount()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')statusEl.textContent='اتصال اتاق مجاز نیست یا Realtime در دسترس نیست.'})}document.getElementById('cam').onclick=()=>localStream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled);document.getElementById('mic').onclick=()=>localStream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled);document.getElementById('leave').onclick=()=>{if(channel)db.removeChannel(channel);peers.forEach(p=>p.pc.close());peers.clear();localStream?.getTracks().forEach(t=>t.stop());location.href='/education.html'};start().catch(e=>{console.error(e);statusEl.textContent=e.message||'خطا در ورود به اتاق کارگاه.'})</script></body></html>
