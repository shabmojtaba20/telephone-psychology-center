<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق کارگاه آنلاین</title><style>body{margin:0;background:#111827;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.red{background:#b91c1c}.btn.gray{background:#374151}.videos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.tile{background:#1f2937;border-radius:14px;overflow:hidden;min-height:250px;position:relative}.tile video{width:100%;height:100%;min-height:250px;object-fit:cover;background:#000}.name{position:absolute;right:10px;bottom:10px;background:#0009;padding:5px 9px;border-radius:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.status{color:#a7f3d0}.hint{color:#cbd5e1;font-size:13px;line-height:2}@media(max-width:700px){.videos{grid-template-columns:1fr}.tile,.tile video{min-height:210px}}
</style></head><body><div class="wrap"><div class="bar"><div><h2 id="title">اتاق کارگاه</h2><div id="status" class="status">در حال اتصال...</div></div><button class="btn gray" onclick="location.href='/education.html'">بازگشت</button></div><div class="controls"><button class="btn" id="cam">🎥 دوربین</button><button class="btn" id="mic">🎙️ میکروفن</button><button class="btn red" id="leave">خروج از اتاق</button></div><p class="hint">ارتباط صوتی/تصویری به‌صورت مستقیم بین شرکت‌کنندگان برقرار می‌شود. سیگنالینگ با Supabase Realtime و رسانه با WebRTC انجام می‌شود؛ ویدئو و صدای تماس روی سرور ذخیره نمی‌شود.</p><div id="videos" class="videos"><div class="tile"><video id="local" autoplay muted playsinline></video><span class="name">شما</span></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const params=new URLSearchParams(location.search),workshopId=params.get('workshop');let channel,localStream;const peers=new Map();const local=document.getElementById('local');const statusEl=document.getElementById('status');const videos=document.getElementById('videos');const rtc={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};const uid=()=>crypto.randomUUID();function send(type,payload,to='*'){channel.send({type:'broadcast',event:type,payload:{...payload,from:clientId,to}})}const clientId=uid();function addVideo(id,stream){if(document.getElementById('v-'+id))return;const d=document.createElement('div');d.className='tile';d.id='tile-'+id;d.innerHTML='<video id="v-'+id+'" autoplay playsinline></video><span class="name">شرکت‌کننده</span>';videos.appendChild(d);document.getElementById('v-'+id).srcObject=stream}async function makePeer(id,initiator){const pc=new RTCPeerConnection(rtc);peers.set(id,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)send('ice',{candidate:e.candidate},id)};pc.ontrack=e=>addVideo(id,e.streams[0]);pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){pc.close();peers.delete(id);document.getElementById('tile-'+id)?.remove()}};if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);send('offer',{sdp:pc.localDescription},id)}return pc}async function start(){const{data:{session}}=await db.auth.getSession();if(!session){alert('برای ورود به کارگاه باید وارد حساب کاربری شوید.');location.href='/';return}const{data:r}=await db.from('workshop_registrations').select('id,payment_status').eq('workshop_id',workshopId).eq('user_id',session.user.id).maybeSingle();if(!r||!['free','paid'].includes(r.payment_status)){alert('دسترسی شما به این کارگاه تأیید نشده است.');location.href='/education.html';return}const{data:w}=await db.from('workshops').select('title,meeting_type,status').eq('id',workshopId).single();if(!w){alert('کارگاه پیدا نشد.');return}document.getElementById('title').textContent=(w.meeting_type==='video'?'🎥 ':'🎙️ ')+w.title;localStream=await navigator.mediaDevices.getUserMedia({video:w.meeting_type==='video',audio:true});local.srcObject=localStream;await db.realtime.setAuth();channel=db.channel('workshop:'+workshopId+':call',{config:{private:true}});channel.on('broadcast',{event:'presence'},async({payload})=>{if(payload.from!==clientId)await makePeer(payload.from,true)}).on('broadcast',{event:'offer'},async({payload})=>{if(payload.to!=='*'&&payload.to!==clientId)return;let pc=peers.get(payload.from)||await makePeer(payload.from,false);await pc.setRemoteDescription(payload.sdp);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);send('answer',{sdp:pc.localDescription},payload.from)}).on('broadcast',{event:'answer'},async({payload})=>{if(payload.to!==clientId)return;const pc=peers.get(payload.from);if(pc)await pc.setRemoteDescription(payload.sdp)}).on('broadcast',{event:'ice'},async({payload})=>{if(payload.to!=='*'&&payload.to!==clientId)return;const pc=peers.get(payload.from);if(pc&&payload.candidate)try{await pc.addIceCandidate(payload.candidate)}catch(e){}}).subscribe(s=>{if(s==='SUBSCRIBED'){statusEl.textContent='متصل؛ آماده برقراری تماس';send('presence',{});setTimeout(()=>send('presence',{}),1500)}else if(s==='CHANNEL_ERROR')statusEl.textContent='خطا در اتصال اتاق'})}document.getElementById('cam').onclick=()=>{localStream?.getVideoTracks().forEach(t=>t.enabled=!t.enabled)};document.getElementById('mic').onclick=()=>{localStream?.getAudioTracks().forEach(t=>t.enabled=!t.enabled)};document.getElementById('leave').onclick=()=>{channel&&db.removeChannel(channel);peers.forEach(p=>p.close());localStream?.getTracks().forEach(t=>t.stop());location.href='/education.html'};start().catch(e=>{console.error(e);statusEl.textContent='دسترسی دوربین/میکروفن یا اتصال اتاق با خطا مواجه شد.'})</script></body></html>
