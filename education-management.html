<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مطالب و کارگاه‌ها</title><style>body{margin:0;background:#f6f8fc;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;background:#4f46e5;color:#fff;cursor:pointer;text-decoration:none;font:inherit}.btn.alt{background:#eef2ff;color:#4338ca}.btn.red{background:#b91c1c}.tabs{display:flex;gap:8px;margin:18px 0}.tab{padding:10px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer}.tab.on{background:#4f46e5;color:#fff}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:13px}.field{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d7dce5;border-radius:9px;margin-top:5px;font:inherit}textarea.field{min-height:90px}.list{display:grid;gap:10px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#667085;font-size:13px}.badge{background:#ecfdf3;color:#15803d;border-radius:999px;padding:4px 8px;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:750px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>🎓 مدیریت مطالب و کارگاه‌ها</h1><p class="muted">ایجاد، ویرایش، انتشار و کنترل وضعیت محتوای آموزشی و کارگاه‌ها</p></div><div><a class="btn alt" href="/education-dashboard.html">داشبورد آموزش</a> <a class="btn alt" href="/education.html">صفحه عمومی</a> <a class="btn" href="/admin-professional.html">پنل مدیریت</a></div></div><div class="tabs"><button class="tab on" data-p="contents">📚 مطالب</button><button class="tab" data-p="workshops">🎓 کارگاه‌ها</button></div><section id="contents" class="panel on"><div class="card"><h2>ایجاد مطلب</h2><div class="grid"><label>عنوان<input id="ctitle" class="field"></label><label>Slug<input id="cslug" class="field"></label><label>نوع محتوا<select id="ctype" class="field"><option value="article">مقاله</option><option value="pdf">PDF</option><option value="video">ویدئو</option><option value="audio">صوت</option><option value="ebook">کتاب الکترونیکی</option></select></label><label>دسترسی<select id="caccess" class="field"><option value="free">رایگان</option><option value="paid">فروشی</option></select></label><label>قیمت<input id="cprice" class="field" type="number" value="0"></label><label>دسته‌بندی<input id="ccat" class="field"></label><label>نام نویسنده<input id="cauthor" class="field"></label><label>مسیر فایل<input id="cfile" class="field"></label><label>تصویر بندانگشتی<input id="cthumb" class="field"></label><label>کاور<input id="ccover" class="field"></label></div><label>خلاصه<textarea id="cexcerpt" class="field"></textarea></label><label>توضیحات<textarea id="cdesc" class="field"></textarea></label><label><input id="cpub" type="checkbox"> انتشار فوری</label><button class="btn" id="saveC">ثبت مطلب</button></div><div class="card"><h2>مطالب موجود</h2><div id="clist" class="list">در حال بارگذاری...</div></div></section><section id="workshops" class="panel"><div class="card"><h2>ایجاد کارگاه</h2><div class="grid"><label>عنوان<input id="wtitle" class="field"></label><label>Slug<input id="wslug" class="field"></label><label>شروع<input id="wstart" class="field" type="datetime-local"></label><label>پایان<input id="wend" class="field" type="datetime-local"></label><label>دسترسی<select id="waccess" class="field"><option value="paid">فروشی</option><option value="free">رایگان</option></select></label><label>قیمت<input id="wprice" class="field" type="number" value="0"></label><label>نوع جلسه<select id="wmeeting" class="field"><option value="video">آنلاین تصویری</option><option value="audio">آنلاین صوتی</option></select></label><label>ظرفیت<input id="wcap" class="field" type="number"></label><label>وضعیت<select id="wstatus" class="field"><option value="draft">پیش‌نویس</option><option value="scheduled">زمان‌بندی‌شده</option><option value="live">در حال برگزاری</option><option value="finished">پایان‌یافته</option><option value="cancelled">لغوشده</option></select></label><label>مدرس<input id="winstructor" class="field"></label><label>مدت دقیقه<input id="wduration" class="field" type="number"></label><label>مهلت ثبت‌نام<input id="wdeadline" class="field" type="datetime-local"></label><label>محل/لینک<input id="wlocation" class="field"></label><label>مخاطبان<input id="waudience" class="field"></label></div><label>سرفصل<textarea id="wagenda" class="field"></textarea></label><label>توضیحات<textarea id="wdesc" class="field"></textarea></label><label>کاور<input id="wcover" class="field"></label><button class="btn" id="saveW">ثبت کارگاه</button></div><div class="card"><h2>کارگاه‌های موجود</h2><div id="wlist" class="list">در حال بارگذاری...</div></div></section><div id="msg" class="muted"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#039;'}[m])),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on')});async function guard(){const r=await db.rpc('has_admin_permission',{p_permission:'education.manage'});if(r.error||r.data!==true){document.body.innerHTML='<main class="wrap"><div class="card"><h2>دسترسی غیرمجاز</h2><p>مجوز education.manage لازم است.</p></div></main>';throw 0}}async function load(){await guard();const[c,w]=await Promise.all([db.from('educational_contents').select('*').order('created_at',{ascending:false}),db.from('workshops').select('*').order('starts_at',{ascending:false})]);if(c.error||w.error){$('msg').textContent='خطا در بارگذاری: '+(c.error?.message||w.error?.message);return}const cs=c.data||[],ws=w.data||[];$('clist').innerHTML=cs.length?cs.map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.category||'-')+' · '+esc(x.content_type)+' · '+(x.access_type==='paid'?money(x.price):'رایگان')+'</div></div><div class="actions"><span class="badge">'+(x.is_published?'منتشر':'پیش‌نویس')+'</span><button class="btn '+(x.is_published?'red':'')+'" data-cpub="'+x.id+'">'+(x.is_published?'لغو انتشار':'انتشار')+'</button></div></div>').join(''):'مطلبی ثبت نشده است.';$('wlist').innerHTML=ws.length?ws.map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><div class="muted">'+new Date(x.starts_at).toLocaleString('fa-IR')+' · '+(x.access_type==='paid'?money(x.price):'رایگان')+' · ظرفیت '+(x.max_participants||'نامحدود')+'</div></div><div class="actions"><span class="badge">'+esc(x.status)+'</span><button class="btn" data-wstatus="'+x.id+'">وضعیت</button><button class="btn alt" onclick="location.href=\'/education.html\'">صفحه عمومی</button></div></div>').join(''):'کارگاهی ثبت نشده است.';document.querySelectorAll('[data-cpub]').forEach(b=>b.onclick=async()=>{const z=await db.rpc('admin_education_set_content_published',{p_id:b.dataset.cpub,p_is_published:b.textContent==='انتشار'});if(z.error)return alert(z.error.message);load()});document.querySelectorAll('[data-wstatus]').forEach(b=>b.onclick=async()=>{const s=prompt('وضعیت جدید: draft / scheduled / live / finished / cancelled','scheduled');if(!s)return;const z=await db.rpc('admin_education_set_workshop_status',{p_id:b.dataset.wstatus,p_status:s});if(z.error)return alert(z.error.message);load()})}function dt(id){const v=$(id).value;return v?new Date(v).toISOString():null}$('saveC').onclick=async()=>{const z=await db.rpc('admin_education_create_content',{p_title:$('ctitle').value,p_slug:$('cslug').value,p_description:$('cdesc').value,p_content_type:$('ctype').value,p_access_type:$('caccess').value,p_price:Number($('cprice').value||0),p_file_path:$('cfile').value||null,p_thumbnail_url:$('cthumb').value||null,p_category:$('ccat').value||null,p_author_name:$('cauthor').value||null,p_excerpt:$('cexcerpt').value||null,p_cover_url:$('ccover').value||null,p_is_published:$('cpub').checked});if(z.error)return alert(z.error.message);alert('مطلب با موفقیت ثبت شد.');load()};$('saveW').onclick=async()=>{const z=await db.rpc('admin_education_create_workshop',{p_title:$('wtitle').value,p_slug:$('wslug').value,p_description:$('wdesc').value,p_cover_url:$('wcover').value||null,p_starts_at:dt('wstart'),p_ends_at:dt('wend'),p_access_type:$('waccess').value,p_price:Number($('wprice').value||0),p_currency:'IRR',p_meeting_type:$('wmeeting').value,p_max_participants:Number($('wcap').value||0)||null,p_status:$('wstatus').value,p_instructor_name:$('winstructor').value||null,p_agenda:$('wagenda').value||null,p_duration_minutes:Number($('wduration').value||0)||null,p_registration_deadline:dt('wdeadline'),p_audience:$('waudience').value||null,p_location:$('wlocation').value||null});if(z.error)return alert(z.error.message);alert('کارگاه با موفقیت ثبت شد.');load()};load().catch(e=>{if(e!==0)console.error(e)});</script></body></html>
