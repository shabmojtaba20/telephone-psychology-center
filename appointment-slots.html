<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت زمان‌های نوبت</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:9px 14px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.red{background:#b91c1c}.btn.gray{background:#64748b}label{display:block;font-size:13px;margin:6px 0}input,select{width:100%;box-sizing:border-box;border:1px solid #d9dee8;border-radius:9px;padding:10px;margin:5px 0 12px}.muted{color:#6b7280;font-size:13px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0}.date{font-weight:800;color:#4338ca}.msg{padding:10px;border-radius:9px;background:#ecfdf5;color:#166534;margin:10px 0}.err{background:#fff1f2;color:#9f1239}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>📅 مدیریت نوبت‌های از پیش تعیین‌شده</h1><p class="muted">مدیر، تاریخ شمسی و ساعت‌های قابل رزرو را تعیین می‌کند. همان زمان‌ها مستقیماً برای مراجعه‌کننده نمایش داده می‌شوند.</p><button class="btn gray" onclick="location.href='/admin-professional.html'">بازگشت به پنل مدیریت</button></div><div id="msg"></div><div class="card"><h2>ثبت زمان جدید</h2><div class="grid"><label>مشاور<select id="consultant"></select></label><label>تاریخ شمسی<input id="jalaliDate" inputmode="numeric" placeholder="مثلاً 1405/06/25"><span class="muted">فرمت: سال/ماه/روز</span></label><label>ساعت شروع<input id="start" type="time"></label><label>ساعت پایان<input id="end" type="time"></label></div><button class="btn" id="save">ثبت زمان قابل رزرو</button></div><div class="card"><h2>زمان‌های ثبت‌شده</h2><div id="list"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'});
function j2g(jy,jm,jd){jy=+jy;jm=+jm;jd=+jd;let gy=jy+621,days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let leap=0;while(days>=365+leap){let y=gy;leap=(((y%4===0)&&y%100!==0)||y%400===0)?1:0;if(days>=365+leap){days-=365+leap;gy++}else break}let leapYear=(((gy%4===0)&&gy%100!==0)||gy%400===0),md=[31,leapYear?29:28,31,30,31,30,31,31,30,31,30,31],gm=Math.max(1,Math.ceil(days/md[0]));let rem=days;gm=1;for(let i=0;i<12;i++){if(rem>md[i]){rem-=md[i];gm++}else break}return`${gy}-${String(gm).padStart(2,'0')}-${String(rem).padStart(2,'0')}`}
function g2j(v){const d=new Date(v+'T00:00:00Z');return fa.format(d)}
async function guard(){const{data}=await db.auth.getSession();if(!data.session){location.replace('/admin.html');return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){await db.auth.signOut();location.replace('/admin.html');return false}return true}
function note(t,bad=false){$('msg').className=bad?'msg err':'msg';$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)}
async function load(){const c=await db.from('consultants').select('id,name').eq('is_active',true).order('sort_order');if(c.error)return note(c.error.message,true);$('consultant').innerHTML='<option value="">انتخاب مشاور</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const r=await db.from('consultant_slots').select('id,consultant_id,slot_date,start_time,end_time,is_active,consultants(name)').order('slot_date').order('start_time');if(r.error)return note(r.error.message,true);$('list').innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<div class="item"><div class="date">${esc(g2j(x.slot_date))}</div><b>${esc(x.consultants?.name||'')}</b> — ${esc(String(x.start_time).slice(0,5))} تا ${esc(String(x.end_time).slice(0,5))} — ${x.is_active?'فعال':'غیرفعال'} <button class="btn red" data-del="${x.id}">حذف</button></div>`).join(''):'<p class="muted">زمانی ثبت نشده است.'}
$('save').onclick=async()=>{const cid=$('consultant').value,j=$('jalaliDate').value.trim().replace(/-/g,'/').split('/'),st=$('start').value,en=$('end').value;if(!cid||j.length!==3||!st||!en)return note('مشاور، تاریخ شمسی و ساعت شروع/پایان را کامل کنید.',true);const gd=j2g(j[0],j[1],j[2]);if(!gd||en<=st)return note('تاریخ یا بازه زمانی صحیح نیست.',true);const r=await db.rpc('admin_save_consultant_slot',{p_id:null,p_consultant_id:cid,p_slot_date:gd,p_start_time:st,p_end_time:en,p_is_active:true});if(r.error)return note(r.error.message,true);note('زمان قابل رزرو ثبت شد.');$('jalaliDate').value='';$('start').value='';$('end').value='';load()};
$('list').onclick=async e=>{const id=e.target.dataset.del;if(!id)return;if(!confirm('این زمان حذف شود؟'))return;const r=await db.rpc('admin_delete_consultant_slot',{p_id:id});if(r.error)return note(r.error.message,true);note('زمان حذف شد.');load()};if(await guard())load();</script></body></html>
