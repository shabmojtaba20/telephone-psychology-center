<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت زمان‌های نوبت</title><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:9px 14px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.red{background:#b91c1c}.btn.gray{background:#64748b}label{display:block;font-size:13px;margin:6px 0}input,select{width:100%;box-sizing:border-box;border:1px solid #d9dee8;border-radius:9px;padding:10px;margin:5px 0 12px}.muted{color:#6b7280;font-size:13px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0}.date{font-weight:800;color:#4338ca}.msg{padding:10px;border-radius:9px;background:#ecfdf5;color:#166534;margin:10px 0}.err{background:#fff1f2;color:#9f1239}.calendar{border:1px solid #e5e7eb;border-radius:16px;background:#fff;padding:14px;margin:5px 0 14px}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.cal-head strong{font-size:17px}.cal-nav{border:1px solid #d9dee8;background:#f8fafc;border-radius:8px;padding:6px 10px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:#64748b;padding:4px}.day{border:1px solid #edf0f5;background:#fff;border-radius:9px;min-height:40px;cursor:pointer;font:inherit}.day:hover{background:#f3f4ff}.day.muted-day{visibility:hidden}.day.disabled{color:#cbd5e1;background:#f8fafc;cursor:not-allowed}.day.selected{background:#5b5bd6;color:#fff;border-color:#5b5bd6;font-weight:800}.selected-date{background:#f5f3ff;border:1px solid #ddd6fe;color:#4338ca;border-radius:10px;padding:9px 12px;margin:-2px 0 12px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.day{min-height:36px;font-size:12px}}</style></head><body><main class="wrap"><div class="card"><h1>📅 مدیریت نوبت‌های از پیش تعیین‌شده</h1><p class="muted">تاریخ را از تقویم شمسی انتخاب کنید؛ نیازی به تایپ تاریخ نیست. زمان‌های انتخاب‌شده مستقیماً برای مراجعه‌کننده نمایش داده می‌شوند.</p><button class="btn gray" onclick="location.href='/admin-professional.html'">بازگشت به پنل مدیریت</button></div><div id="msg"></div><div class="card"><h2>ثبت زمان جدید</h2><div class="grid"><label>مشاور<select id="consultant"></select></label><div><label>تاریخ شمسی</label><div class="calendar"><div class="cal-head"><button class="cal-nav" id="prevMonth" type="button">‹ ماه قبل</button><strong id="monthTitle"></strong><button class="cal-nav" id="nextMonth" type="button">ماه بعد ›</button></div><div class="week"><div>شنبه</div><div>یکشنبه</div><div>دوشنبه</div><div>سه‌شنبه</div><div>چهارشنبه</div><div>پنجشنبه</div><div>جمعه</div></div><div class="days" id="days"></div></div><div id="selectedDate" class="selected-date">هنوز تاریخی انتخاب نشده است.</div><input id="jalaliDate" type="hidden"></div><label>ساعت شروع<input id="start" type="time"></label><label>ساعت پایان<input id="end" type="time"></label></div><button class="btn" id="save">ثبت زمان قابل رزرو</button></div><div class="card"><h2>زمان‌های ثبت‌شده</h2><div id="list"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function div(a,b){return[Math.floor(a/b),a%b]}function g2d(gy,gm,gd){let d=0;for(let y=1;y<gy;y++)d+=365+(((y%4===0&&y%100!==0)||y%400===0)?1:0);const md=[31,28,31,30,31,30,31,31,30,31,30,31];for(let m=1;m<gm;m++)d+=md[m-1]+(m===2&&((gy%4===0&&gy%100!==0)||gy%400===0)?1:0);return d+gd}function jalCal(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let bl=breaks.length,bp=breaks[0],jp=0;if(jy<bp||jy>=breaks[bl-1])return null;for(let i=1;i<bl&&jy>=breaks[i];i++){const bm=breaks[i];jp=bm-bp;bp=bm}let jump=bp-jy;let leapJ=-14,leapG=0;for(let i=-61;i<bp;i++){leapJ+=i>=0?div(i,33)[0]*8+div(i%33+3,4)[0]:div(i,33)[0]*8+div(i%33+3,4)[0];}leapJ+=div(jump,33)[0]*8+div(jump%33+3,4)[0];let gy=jy+621;leapG=div(gy,4)[0]-div((div(gy,100)[0]+1)*3,4)[0]-150;let march=20+leapJ-leapG;let n=0;let jp2=bp;for(let i=1;i<bl&&jy>=breaks[i];i++){const b=breaks[i];n=b-jp2;jp2=b}let leap=0;for(let i=0;i<n;i++){leap+=1;const x=jp2+i;if(x%33===1||x%33===5||x%33===9||x%33===13||x%33===17||x%33===22||x%33===26||x%33===30)leap+=0}return{gy,march,leap:((jy-bp)%33===0?0:0)}}
// Reliable compact Jalali conversion based on the standard 33-year cycle.
const J_MONTHS=[31,31,31,31,31,31,30,30,30,30,30,29];function jToG(jy,jm,jd){jy=Number(jy);jm=Number(jm);jd=Number(jd);let gy=jy+621;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let g=gy;while(true){const leap=(g%4===0&&g%100!==0)||g%400===0;if(days<=365+leap)break;days-=365+leap;g++}const md=[31,28,31,30,31,30,31,31,30,31,30,31];let gm=1;while(days>md[gm-1]+(gm===2&&((g%4===0&&g%100!==0)||g%400===0)?1:0)){days-=md[gm-1]+(gm===2&&((g%4===0&&g%100!==0)||g%400===0)?1:0);gm++}return`${g}-${String(gm).padStart(2,'0')}-${String(days).padStart(2,'0')}`}function gToJ(gy,gm,gd){const dt=new Date(Date.UTC(gy,gm-1,gd));const f=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'});const p=f.formatToParts(dt),o={};p.forEach(x=>o[x.type]=x.value);return{y:Number(o.year),m:Number(o.month),d:Number(o.day)}}function faJ(j){return`${j.y.toLocaleString('fa-IR')}/${String(j.m).padStart(2,'0')}/${String(j.d).padStart(2,'0')}`}
function jalaliMonthDays(y,m){if(m<=6)return 31;if(m<=11)return 30;const leap=[1,5,9,13,17,22,26,30].includes((y+12)%33);return leap?30:29}function renderCalendar(){const y=cal.y,m=cal.m;const first=jToG(y,m,1);const gd=new Date(first+'T00:00:00Z');const js=Number(new Intl.DateTimeFormat('en-US-u-ca-persian',{weekday:'short'}).format(gd));const weekday=(gd.getUTCDay()+1)%7;$('monthTitle').textContent=`${y.toLocaleString('fa-IR')} / ${m.toLocaleString('fa-IR')}`;let html='';for(let i=0;i<weekday;i++)html+='<button class="day muted-day" tabindex="-1"></button>';const max=jalaliMonthDays(y,m);for(let d=1;d<=max;d++){const key=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;const iso=jToG(y,m,d);const today=new Date();today.setHours(0,0,0,0);const day=new Date(iso+'T00:00:00');const disabled=day<today;const selected=$('jalaliDate').value===key;html+=`<button type="button" class="day ${disabled?'disabled':''} ${selected?'selected':''}" ${disabled?'disabled':''} data-j="${key}">${d.toLocaleString('fa-IR')}</button>`}$('days').innerHTML=html;document.querySelectorAll('.day[data-j]').forEach(b=>b.onclick=()=>{const v=b.dataset.j;$('jalaliDate').value=v;$('selectedDate').textContent='تاریخ انتخاب‌شده: '+v.split('/').map((x,i)=>i===0?Number(x).toLocaleString('fa-IR'):String(x).padStart(2,'0')).join('/');renderCalendar()})}
let nowJ=gToJ(new Date().getUTCFullYear(),new Date().getUTCMonth()+1,new Date().getUTCDate()),cal={y:nowJ.y,m:nowJ.m};$('prevMonth').onclick=()=>{cal.m--;if(cal.m<1){cal.m=12;cal.y--}renderCalendar()};$('nextMonth').onclick=()=>{cal.m++;if(cal.m>12){cal.m=1;cal.y++}renderCalendar()};
async function guard(){const{data}=await db.auth.getSession();if(!data.session){location.replace('/admin.html');return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){await db.auth.signOut();location.replace('/admin.html');return false}return true}function note(t,bad=false){$('msg').className=bad?'msg err':'msg';$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)}
async function load(){const c=await db.from('consultants').select('id,name').eq('is_active',true).order('sort_order');if(c.error)return note(c.error.message,true);$('consultant').innerHTML='<option value="">انتخاب مشاور</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const r=await db.from('consultant_slots').select('id,consultant_id,slot_date,start_time,end_time,is_active,consultants(name)').order('slot_date').order('start_time');if(r.error)return note(r.error.message,true);$('list').innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<div class="item"><div class="date">${esc(new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date(x.slot_date+'T00:00:00Z')))}</div><b>${esc(x.consultants?.name||'')}</b> — ${esc(String(x.start_time).slice(0,5))} تا ${esc(String(x.end_time).slice(0,5))} — ${x.is_active?'فعال':'غیرفعال'} <button class="btn red" data-del="${x.id}">حذف</button></div>`).join(''):'<p class="muted">زمانی ثبت نشده است.'}
$('save').onclick=async()=>{const cid=$('consultant').value,j=$('jalaliDate').value,st=$('start').value,en=$('end').value;if(!cid||!j||!st||!en)return note('مشاور، تاریخ شمسی و ساعت شروع/پایان را کامل کنید.',true);const p=j.split('/');if(p.length!==3)return note('تاریخ انتخاب‌شده صحیح نیست.',true);const gd=jToG(p[0],p[1],p[2]);if(!gd||en<=st)return note('تاریخ یا بازه زمانی صحیح نیست.',true);const r=await db.rpc('admin_save_consultant_slot',{p_id:null,p_consultant_id:cid,p_slot_date:gd,p_start_time:st,p_end_time:en,p_is_active:true});if(r.error)return note(r.error.message,true);note('زمان قابل رزرو ثبت شد.');$('jalaliDate').value='';$('selectedDate').textContent='هنوز تاریخی انتخاب نشده است.';$('start').value='';$('end').value='';renderCalendar();load()};$('list').onclick=async e=>{const id=e.target.dataset.del;if(!id)return;if(!confirm('این زمان حذف شود؟'))return;const r=await db.rpc('admin_delete_consultant_slot',{p_id:id});if(r.error)return note(r.error.message,true);note('زمان حذف شد.');load()};if(await guard()){renderCalendar();load()}</script></body></html>
