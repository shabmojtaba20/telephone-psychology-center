<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درخت حساب‌ها</title><style>body{font-family:Tahoma,Arial;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1250px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:13px}.grid input,.grid select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #d6dbe5;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;background:#4f46e5;color:white;padding:10px 14px;cursor:pointer;font:inherit}.gray{background:#64748b}.green{background:#15803d}.notice{padding:10px;border-radius:10px;background:#ecfdf5;color:#166534;margin-bottom:12px}.err{background:#fff1f2;color:#9f1239}.tree{line-height:1.9}.node{border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;padding:12px;background:#fafafa}.l1{background:#eef2ff}.l2{margin-right:25px}.l3{margin-right:50px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#e5e7eb;font-size:11px;margin-left:7px}.actions{float:left}@media(max-width:700px){.grid{grid-template-columns:1fr}.l2{margin-right:10px}.l3{margin-right:20px}}</style></head><body><div class="wrap"><div id="notice"></div><div class="card"><a class="btn gray" href="/admin-v5.html">بازگشت به پنل مالی</a><h1>📚 درخت حساب‌های مرکز</h1><p>ساختار حرفه‌ای حسابداری: <b>کل ← معین ← تفصیلی</b>. حساب‌های موجود سیستم نیز در همین ساختار سازمان‌دهی شده‌اند.</p></div><div class="card"><h2>➕ ایجاد حساب</h2><div class="grid"><label>کد حساب<input id="code" placeholder="مثلاً 1101"></label><label>نام حساب<input id="name" placeholder="مثلاً بانک ملت"></label><label>نوع حساب<select id="type"><option value="asset">دارایی</option><option value="liability">بدهی</option><option value="equity">حقوق مالکانه</option><option value="income">درآمد</option><option value="expense">هزینه</option></select></label><label>سطح حساب<select id="level" onchange="syncParent()"><option value="1">کل</option><option value="2" selected>معین</option><option value="3">تفصیلی</option></select></label><label>حساب بالادست<select id="parent"></select></label><label>ماهیت<select id="normal"><option value="">خودکار/نامشخص</option><option value="debit">بدهکار</option><option value="credit">بستانکار</option></select></label><label><input id="postable" type="checkbox" checked> قابل ثبت سند</label></div><div style="margin-top:12px"><button class="btn green" onclick="createAccount()">ثبت حساب</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🌳 ساختار حساب‌ها</h2><button class="btn" onclick="load()">🔄 بروزرسانی</button></div><div id="tree" class="tree">در حال دریافت...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),typeName=x=>({asset:'دارایی',liability:'بدهی',equity:'حقوق مالکانه',income:'درآمد',expense:'هزینه'}[x]||x);let accounts=[];function note(t,e=false){$('notice').className='notice'+(e?' err':'');$('notice').textContent=t}async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html?redirect=/finance-accounts.html');return false}const{data:ok}=await db.rpc('has_admin_role_permission',{p_role:'finance_manager',p_permission:'finance.manage'});if(ok!==true){note('این حساب مجوز مدیریت حساب‌ها را ندارد.',true);return false}return true}function syncParent(){const l=Number($('level').value);$('parent').innerHTML='<option value="">انتخاب کنید</option>'+accounts.filter(a=>Number(a.account_level)===l-1).map(a=>'<option value="'+a.id+'">'+esc(a.account_code)+' — '+esc(a.account_name)+'</option>').join('');if(l===1)$('parent').disabled=true;else $('parent').disabled=false}async function load(){if(!(await guard()))return;const r=await db.rpc('get_finance_account_tree');if(r.error){note(r.error.message,true);return}accounts=r.data||[];syncParent();const roots=accounts.filter(a=>Number(a.account_level)===1);const html=roots.map(root=>'<div class="node l1"><b>'+esc(root.account_code)+' — '+esc(root.account_name)+'</b> <span class="tag">کل</span> <span class="tag">'+typeName(root.account_type)+'</span>' + accounts.filter(a=>a.parent_id===root.id).map(m=>'<div class="node l2"><b>'+esc(m.account_code)+' — '+esc(m.account_name)+'</b> <span class="tag">معین</span> '+(m.is_postable?'<span class="tag">قابل ثبت</span>':'')+accounts.filter(d=>d.parent_id===m.id).map(d=>'<div class="node l3"><b>'+esc(d.account_code)+' — '+esc(d.account_name)+'</b> <span class="tag">تفصیلی</span></div>').join('')+'</div>').join('')+'</div>').join('');$('tree').innerHTML=html||'<div>حسابی یافت نشد.</div>'}async function createAccount(){const level=Number($('level').value),parent=$('parent').value||null;const r=await db.rpc('create_finance_account',{p_account_code:$('code').value,p_account_name:$('name').value,p_account_type:$('type').value,p_parent_id:parent,p_account_level:level,p_is_postable:level===1?false:$('postable').checked,p_normal_balance:$('normal').value||null,p_description:null});if(r.error){note(r.error.message,true);return}note('حساب با موفقیت ایجاد شد.');$('code').value='';$('name').value='';await load()}load()</script></body></html>
