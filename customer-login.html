<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود حساب کاربری | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f4f7fb;font-family:Tahoma,Arial;color:#172033}.wrap{width:min(460px,calc(100% - 28px));margin:60px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 25px #0000000d}label{display:block;font-weight:700;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6dbe5;border-radius:10px;font:inherit}.btn{width:100%;border:0;border-radius:10px;background:#4f46e5;color:#fff;padding:12px;margin-top:16px;font:inherit;cursor:pointer}.notice{padding:11px;border-radius:10px;margin-top:12px;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.muted{color:#667085;font-size:13px}a{color:#4338ca}</style></head><body><main class="wrap"><section class="card"><h1>🔐 ورود به حساب کاربری</h1><p class="muted">برای مشاهده صورتحساب‌ها و ثبت رسید پرداخت، وارد حساب خود شوید.</p><div id="notice"></div><label>ایمیل</label><input id="email" type="email" autocomplete="username" placeholder="example@email.com"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="btn">ورود و ادامه</button><p class="muted"><a href="/">بازگشت به سایت</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'/submit-receipt.html';function msg(t,e=false){$('notice').className='notice'+(e?' err':'');$('notice').textContent=t}async function init(){const{data:{session}}=await db.auth.getSession();if(session)location.replace(next)}$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('ایمیل و رمز عبور را وارد کنید.',true);$('login').disabled=true;msg('در حال ورود…');try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;location.replace(next)}catch(e){msg(e.message||'ورود ناموفق بود.',true);$('login').disabled=false}};init();</script></body></html>
