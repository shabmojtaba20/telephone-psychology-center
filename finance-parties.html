<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرف حساب‌ها و تفصیلی</title><style>body{font-family:Tahoma,Arial;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid input,.grid select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #d6dbe5;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;background:#4f46e5;color:#fff;padding:10px 14px;cursor:pointer;font:inherit}.gray{background:#64748b}.green{background:#15803d}.notice{padding:10px;border-radius:10px;background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#9f1239}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:right}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:11px}.hidden{display:none}.money{font-variant-numeric:tabular-nums}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:12px}}.ledger{margin-top:15px}.summary{display:flex;gap:12px;flex-wrap:wrap}.box{background:#f8fafc;border-radius:12px;padding:10px 14px}</style></head><body><div class="wrap"><div id="notice"></div><div class="card"><a class="btn gray" href="/finance-accounts.html">بازگشت به حساب‌ها</a><h1>👥 طرف حساب‌ها و حساب تفصیلی</h1><p>برای هر مشاور یا مراجع، یک حساب سطح سوم ساخته می‌شود تا گردش بدهکار/بستانکار و مانده او مستقل قابل مشاهده باشد.</p></div><div class="card"><h2>➕ ایجاد حساب تفصیلی طرف حساب</h2><div class="grid"><label>نوع طرف حساب<select id="ptype" onchange="loadSources()"><option value="consultant">مشاور</option><option value="client">مراجع</option><option value="supplier">تأمین‌کننده</option><option value="other">سایر</option></select></label><label>حساب معین بالادست<select id="parent"></select></label><label id="sourceWrap">انتخاب طرف حساب<select id="source"></select></label><label>نام نمایشی<input id="name" placeholder="نام طرف حساب"></label><label>موبایل<input id="mobile"></label><label>ایمیل<input id="email" type="email"></label><label>کد تفصیلی اختیاری<input id="code" placeholder="مثلاً 21000001"></label></div><div style="margin-top:12px"><button class="btn green" onclick="createParty()">ثبت و ساخت تفصیلی</button></div></div><div class="card"><h2>📋 فهرست طرف حساب‌ها</h2><button class="btn" onclick="load()">🔄 بروزرسانی</button><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>نوع</th><th>طرف حساب</th><th>حساب تفصیلی</th><th>معین</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card ledger"><h2 id="ltitle">📒 دفتر طرف حساب</h2><div id="ledger">یک طرف حساب را انتخاب کنید.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]));let src={consultants:[],clients:[],parents:[]};let parties=[];function note(t,e=false){$('notice').className='notice'+(e?' err':'');$('notice').textContent=t}async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin-login.html?redirect=/finance-parties.html');return false}const{data:ok}=await db.rpc('has_admin_role_permission',{p_role:'finance_manager',p_permission:'finance.view'});if(ok!==true){note('این حساب مجوز مشاهده امور مالی را ندارد.',true);return false}return true}async function loadSources(){const type=$('ptype').value;$('parent').innerHTML=src.parents.map(p=>'<option value="'+p.id+'">'+esc(p.code)+' — '+esc(p.name)+'</option>').join('');const arr=type==='consultant'?src.consultants:type==='client'?src.clients:[];$('sourceWrap').classList.toggle('hidden',!arr.length);$('source').innerHTML=arr.map(x=>type==='consultant'?'<option value="'+x.id+'">'+esc(x.name)+'</option>':'<option value="'+x.user_id+'">'+esc(x.full_name||x.email)+' — '+esc(x.phone||'')+'</option>').join('');if(arr.length){const x=arr[0];$('name').value=type==='consultant'?x.name:(x.full_name||x.email||'');$('mobile').value=type==='consultant'?'':(x.phone||'');$('email').value=type==='consultant'?'':(x.email||'')}}async function createParty(){const type=$('ptype').value,selected=$('source').value||null;let consultant_id=null,user_id=null;if(type==='consultant')consultant_id=selected;if(type==='client')user_id=selected;const r=await db.rpc('create_finance_party',{p_party_type:type,p_display_name:$('name').value,p_parent_account_id:$('parent').value,p_consultant_id:consultant_id,p_user_id:user_id,p_mobile:$('mobile').value||null,p_email:$('email').value||null,p_account_code:$('code').value||null});if(r.error){note(r.error.message,true);return}note('طرف حساب و حساب تفصیلی با موفقیت ایجاد شد.');$('code').value='';await Promise.all([load(),loadSources()])}async function load(){if(!(await guard()))return;const a=await db.rpc('get_finance_parties');if(a.error){note(a.error.message,true);return}parties=a.data||[];$('rows').innerHTML=parties.map(p=>'<tr><td><span class="tag">'+esc({consultant:'مشاور',client:'مراجع',supplier:'تأمین‌کننده',other:'سایر'}[p.party_type])+'</span></td><td>'+esc(p.display_name)+'</td><td>'+esc(p.account_code)+' — '+esc(p.account_name)+'</td><td>'+esc(p.parent_id||'')+'</td><td><button class="btn" onclick="showLedger(\''+p.id+'\')">دفتر</button></td></tr>').join('')||'<tr><td colspan="5">طرف حسابی ثبت نشده است.</td></tr>';const s=await db.rpc('get_finance_party_sources');if(s.error){note(s.error.message,true);return}src=s.data||{consultants:[],clients:[],parents:[]};loadSources()}async function showLedger(id){const r=await db.rpc('get_finance_party_ledger',{p_party_id:id});if(r.error){note(r.error.message,true);return}const d=r.data, t=d.totals||{};$('ltitle').textContent='📒 دفتر: '+(d.party?.display_name||'');$('ledger').innerHTML='<div class="summary"><div class="box">بدهکار: <b class="money">'+Number(t.debit||0).toLocaleString('fa-IR')+'</b></div><div class="box">بستانکار: <b class="money">'+Number(t.credit||0).toLocaleString('fa-IR')+'</b></div><div class="box">مانده: <b class="money">'+Number(t.balance||0).toLocaleString('fa-IR')+'</b></div></div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>شماره</th><th>تاریخ</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مرجع</th></tr></thead><tbody>'+(d.entries||[]).map(e=>'<tr><td>'+esc(e.document_no)+'</td><td>'+esc(e.document_date)+'</td><td>'+esc(e.line_description||e.description)+'</td><td>'+Number(e.debit||0).toLocaleString('fa-IR')+'</td><td>'+Number(e.credit||0).toLocaleString('fa-IR')+'</td><td>'+esc(e.reference)+'</td></tr>').join('')+'</tbody></table></div>'}load()</script></body></html>
