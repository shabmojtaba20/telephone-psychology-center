<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به پنل مدیریت | مرکز مشاوره تلفنی روان</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Tahoma,Arial;color:#182033}.card{width:min(420px,calc(100% - 32px));box-sizing:border-box;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 12px 35px #00000012}h1{font-size:22px;margin:0 0 8px}p{color:#6b7280;font-size:13px}label{display:block;font-size:13px;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9dee8;border-radius:10px;font:inherit}.pass{display:flex;gap:8px}.pass input{flex:1}.toggle{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:0 12px;cursor:pointer}.btn{width:100%;border:0;border-radius:10px;padding:12px;margin-top:18px;background:#5b5bd6;color:#fff;font:inherit;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:22px;margin-top:12px!important}.ok{color:#15803d!important}.err{color:#b91c1c!important}.home{display:block;text-align:center;margin-top:14px;color:#5b5bd6;text-decoration:none;font-size:13px}</style></head><body><main class="card"><h1>ورود به پنل مدیریت</h1><p>برای ورود فقط ایمیل و رمز عبور مدیر را وارد کنید.</p><form id="form"><label for="email">ایمیل</label><input id="email" type="email" value="shabihi@chmail.ir" autocomplete="username" required><label for="password">رمز عبور</label><div class="pass"><input id="password" type="password" autocomplete="current-password" required><button class="toggle" type="button" id="toggle">نمایش</button></div><button class="btn" id="login" type="submit">ورود</button><p id="msg" class="msg"></p></form><a class="home" href="/">بازگشت به سایت</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id),btn=$('login'),msg=$('msg');$('toggle').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';$('toggle').textContent=$('password').type==='password'?'نمایش':'مخفی'};$('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='در حال بررسی...';btn.disabled=true;const email=$('email').value.trim().toLowerCase(),password=$('password').value;try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const{data:isAdmin,error:adminError}=await sb.rpc('is_admin');if(adminError)throw new Error('بررسی دسترسی مدیر انجام نشد. لطفاً دوباره تلاش کنید.');if(isAdmin!==true){await sb.auth.signOut();throw new Error('این حساب مجوز ورود به پنل مدیریت را ندارد.');}msg.className='msg ok';msg.textContent='ورود موفق بود؛ در حال انتقال...';location.replace('/admin-v4.html?v='+Date.now())}catch(err){msg.className='msg err';const m=String(err.message||'');msg.textContent=m.includes('Invalid login credentials')?'ایمیل یا رمز عبور صحیح نیست.':m}finally{btn.disabled=false}}</script></body></html>
