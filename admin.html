<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | مرکز مشاوره تلفنی روان</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f7f8fc;color:#172033;line-height:1.8}.wrap{max-width:1100px;margin:auto;padding:25px 15px 70px}.panel{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px;font-family:inherit}.btn{border:0;border-radius:9px;padding:10px 15px;background:#6557d8;color:#fff;cursor:pointer;font-family:inherit}.secondary{background:#eef2ff;color:#4f46e5}.danger{background:#b91c1c}.warning{background:#d97706}.hidden{display:none!important}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:9px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:0;border-radius:9px;padding:10px 14px;background:#eee;cursor:pointer;font-family:inherit}.tab.active{background:#6557d8;color:#fff}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.msg{margin-top:8px}.ok{color:#166534;background:#dcfce7;padding:8px;border-radius:8px}.err{color:#b91c1c;background:#fee2e2;padding:8px;border-radius:8px}.consultant-photo{width:90px;height:90px;object-fit:cover;border-radius:50%;margin-left:12px;vertical-align:middle}.doc{display:inline-block;margin:5px 0;color:#4f46e5}.status{font-weight:bold}.active{color:#166534}.inactive{color:#b91c1c}</style></head><body><main class="wrap"><div class="panel"><div class="toolbar"><div><h1>پنل مدیریت مرکز</h1><p>مدیریت مطالب، تصاویر، خدمات، مشاوران و نوبت‌ها</p></div><div><a class="btn secondary" href="/" target="_blank">مشاهده سایت</a> <button class="btn danger" id="logout">خروج</button></div></div></div><section id="login" class="panel hidden"><h2>ورود مدیر</h2><input id="email" type="email" value="shabihi@chmail.ir"><input id="password" type="password" placeholder="رمز عبور"><button class="btn" id="loginBtn">ورود</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="tabs"><button class="tab active" data-tab="consultants">مشاوران</button><button class="tab" data-tab="availability">ساعات کاری</button><button class="tab" data-tab="appointments">نوبت‌ها</button></div><div id="consultantsTab"><div class="panel"><h2>افزودن مشاور</h2><div class="grid"><div><label>نام مشاور</label><input id="cName" placeholder="نام و نام خانوادگی"></div><div><label>تخصص</label><input id="cSpecialty" placeholder="مثلاً روان‌شناس بالینی"></div><div><label>ترتیب نمایش</label><input id="cSort" type="number" value="0"></div></div><label>مدرک / تحصیلات</label><input id="cEducation" placeholder="مثلاً کارشناسی ارشد روان‌شناسی بالینی"><label>معرفی</label><textarea id="cBio" rows="3"></textarea><label>عکس مشاور</label><input id="cPhoto" type="file" accept="image/*"><label>مدرک تحصیلی (تصویر یا PDF)</label><input id="cDoc" type="file" accept="image/*,.pdf"><button class="btn" id="addConsultant">ثبت مشاور</button><p id="cMsg"></p></div><div class="panel"><h2>مشاوران ثبت‌شده</h2><div id="consultants"></div></div></div><div id="availabilityTab" class="hidden"><div class="panel"><h2>برنامه هفتگی مشاور</h2><p>ساعات آزاد هر مشاور را برای هر روز هفته ثبت کنید.</p><select id="aConsultant"></select><div class="grid"><div><label>روز هفته</label><select id="weekday"><option value="6">شنبه</option><option value="0">یکشنبه</option><option value="1">دوشنبه</option><option value="2">سه‌شنبه</option><option value="3">چهارشنبه</option><option value="4">پنجشنبه</option><option value="5">جمعه</option></select></div><div><label>از ساعت</label><input id="startTime" type="time" value="09:00"></div><div><label>تا ساعت</label><input id="endTime" type="time" value="17:00"></div></div><button class="btn" id="addAvailability">افزودن ساعت آزاد</button><p id="aMsg"></p></div><div class="panel"><h2>ساعات ثبت‌شده</h2><div id="availability"></div></div></div><div id="appointmentsTab" class="hidden"><div class="panel"><h2>نوبت‌ها</h2><div id="appointments"></div></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=id=>document.getElementById(id);const days=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];async function isAdmin(){const r=await supabase.rpc('is_admin');if(r.error)throw r.error;return r.data===true}async function init(){try{const{data:{session}}=await supabase.auth.getSession();if(session&&await isAdmin()){login.classList.add('hidden');app.classList.remove('hidden');await loadAll()}else login.classList.remove('hidden')}catch(e){login.classList.remove('hidden');loginMsg.textContent=e.message}}loginBtn.onclick=async()=>{loginMsg.textContent='در حال ورود…';const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return loginMsg.textContent=error.message;await init()};logout.onclick=async()=>{await supabase.auth.signOut();location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['consultants','availability','appointments'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='availability')loadAvailability()});async function uploadFile(file,folder){if(!file)return null;const ext=file.name.split('.').pop().toLowerCase();const path=folder+'/'+crypto.randomUUID()+'.'+ext;const{error}=await supabase.storage.from('site-media').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return supabase.storage.from('site-media').getPublicUrl(path).data.publicUrl}async function loadAll(){await loadConsultants();await loadAppointments();await loadAvailability()}async function loadConsultants(){const{data,error}=await supabase.from('consultants').select('*').order('sort_order');if(error){consultants.innerHTML=error.message;return}aConsultant.innerHTML=(data||[]).map(c=>`<option value="${c.id}">${c.name}${c.is_active?'':' (غیرفعال)'}</option>`).join('');consultants.innerHTML=(data||[]).map(c=>`<div class="item">${c.photo_url?`<img class="consultant-photo" src="${c.photo_url}" alt="${c.name}">`:''}<b>${c.name}</b> — ${c.specialty||'بدون تخصص'}<br><span>${c.education||'مدرک تحصیلی ثبت نشده'}</span><br><span>${c.bio||''}</span>${c.education_document_url?`<br><a class="doc" href="${c.education_document_url}" target="_blank">📄 مشاهده مدرک تحصیلی</a>`:''}<br><span class="status ${c.is_active?'active':'inactive'}">${c.is_active?'● فعال':'● غیرفعال'}</span><br><button class="btn ${c.is_active?'warning':''}" data-toggle="${c.id}" data-active="${c.is_active}">${c.is_active?'غیرفعال کردن':'فعال کردن'}</button> <button class="btn danger" data-remove="${c.id}" data-name="${c.name}">حذف مشاور</button></div>`).join('')||'هنوز مشاوری ثبت نشده است.';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const next=b.dataset.active!=='true';if(!confirm(next?'مشاور فعال شود؟':'مشاور غیرفعال شود؟'))return;const{error}=await supabase.from('consultants').update({is_active:next}).eq('id',b.dataset.toggle);if(error)alert(error.message);else loadConsultants()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('مشاور «'+b.dataset.name+'» حذف شود؟ این عملیات قابل برگشت نیست.'))return;const{error}=await supabase.from('consultants').delete().eq('id',b.dataset.remove);if(error){alert('حذف انجام نشد: '+error.message);return}cMsg.className='ok';cMsg.textContent='مشاور حذف شد.';loadConsultants();loadAvailability()})}addConsultant.onclick=async()=>{try{if(!cName.value.trim())return cMsg.textContent='نام مشاور الزامی است.';cMsg.textContent='در حال بارگذاری فایل‌ها…';const photo=await uploadFile(cPhoto.files[0],'consultants/photos');const doc=await uploadFile(cDoc.files[0],'consultants/documents');const{error}=await supabase.from('consultants').insert({name:cName.value.trim(),specialty:cSpecialty.value.trim()||null,education:cEducation.value.trim()||null,bio:cBio.value.trim()||null,photo_url:photo,education_document_url:doc,sort_order:Number(cSort.value)||0,is_active:true});if(error)throw error;cMsg.className='ok';cMsg.textContent='مشاور با موفقیت ثبت شد.';['cName','cSpecialty','cEducation','cBio'].forEach(x=>$(x).value='');cPhoto.value='';cDoc.value='';await loadConsultants()}catch(e){cMsg.className='err';cMsg.textContent=e.message}};addAvailability.onclick=async()=>{const{error}=await supabase.from('consultant_availability').insert({consultant_id:aConsultant.value,weekday:Number(weekday.value),start_time:startTime.value,end_time:endTime.value,is_active:true});aMsg.className=error?'err':'ok';aMsg.textContent=error?error.message:'ساعت کاری ثبت شد.';if(!error)loadAvailability()};async function loadAvailability(){const{data,error}=await supabase.from('consultant_availability').select('id,consultant_id,weekday,start_time,end_time,is_active,consultants(name)').order('weekday').order('start_time');availability.innerHTML=error?error.message:(data||[]).map(x=>`<div class="item"><b>${x.consultants?.name||''}</b> — ${days[x.weekday]} — ${x.start_time.slice(0,5)} تا ${x.end_time.slice(0,5)} <button class="btn danger" data-del="${x.id}">حذف</button></div>`).join('')||'هنوز ساعتی ثبت نشده است.';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const{error}=await supabase.from('consultant_availability').delete().eq('id',b.dataset.del);if(error)alert(error.message);else loadAvailability()})}async function loadAppointments(){const{data,error}=await supabase.from('appointments').select('id,scheduled_at,status,notes,consultant_id,services(name),consultants(name)').order('scheduled_at');appointments.innerHTML=error?error.message:(data||[]).map(a=>`<div class="item"><b>${a.services?.name||'خدمت'}</b><br>مشاور: ${a.consultants?.name||'انتخاب نشده'}<br>زمان: ${new Date(a.scheduled_at).toLocaleString('fa-IR')}<br>وضعیت: ${a.status}<br>${a.notes||''}<br><button class="btn" data-confirm="${a.id}">تأیید</button> <button class="btn danger" data-cancel="${a.id}">لغو</button></div>`).join('')||'هنوز نوبتی ثبت نشده است.';document.querySelectorAll('[data-confirm],[data-cancel]').forEach(b=>b.onclick=async()=>{const status=b.dataset.confirm?'confirmed':'cancelled';const{error}=await supabase.from('appointments').update({status}).eq('id',b.dataset.confirm||b.dataset.cancel);if(error)alert(error.message);else loadAppointments()})}init();</script></body></html>
