<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>پنل مدیریت</title><style>body{font-family:Tahoma,Arial;margin:0;background:#f7f8fc;color:#20242c}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px;font-family:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:#6d5dfc;color:#fff;cursor:pointer}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:9px 0}.muted{color:#6b7280}.hidden{display:none}.err{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px}.ok{color:#166534;background:#dcfce7;padding:10px;border-radius:8px}</style></head><body><main class="wrap"><div class="panel"><h1>پنل مدیریت مرکز</h1><p id="status" class="muted">در حال بررسی دسترسی…</p><a href="/">بازگشت به سایت</a></div><section id="login" class="panel hidden"><h2>ورود مدیر</h2><p>ایمیل مدیر را وارد کنید تا لینک ورود ارسال شود.</p><input id="email" type="email" value="shabmojtaba20@gmail.com"><button class="btn" id="send">ارسال لینک ورود</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="panel"><h2>ایجاد خدمت جدید</h2><div class="grid"><div><label>نام خدمت</label><input id="name"></div><div><label>مدت (دقیقه)</label><input id="duration" type="number" value="30"></div><div><label>قیمت (تومان)</label><input id="price" type="number" placeholder="اختیاری"></div></div><label>توضیحات</label><textarea id="description" rows="3"></textarea><button class="btn" id="add">افزودن خدمت</button><p id="msg"></p></div><div class="panel"><h2>خدمات</h2><div id="services"></div></div><div class="panel"><h2>نوبت‌ها</h2><div id="appointments"></div></div></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
const $=x=>document.getElementById(x), msg=t=>$('msg').textContent=t;
async function check(){try{const {data:{user},error}=await supabase.auth.getUser();if(error)throw error;if(!user){$('status').textContent='ورود مدیر لازم است.';$('login').classList.remove('hidden');return}const {data,isAdminError}=await (async()=>{const r=await supabase.rpc('is_admin');return {data:r.data,isAdminError:r.error}})();if(isAdminError)throw isAdminError;if(data!==true){$('status').textContent='این حساب دسترسی مدیر ندارد.';$('login').classList.remove('hidden');return}$('status').textContent='دسترسی مدیر تأیید شد.';$('app').classList.remove('hidden');await Promise.all([loadServices(),loadAppointments()])}catch(e){$('status').textContent='خطا در اتصال به Supabase';$('login').classList.remove('hidden');$('loginMsg').className='err';$('loginMsg').textContent=e?.message||String(e)}}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return;$('loginMsg').className='';$('loginMsg').textContent='در حال ارسال لینک…';try{const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.href}});if(error)throw error;$('loginMsg').className='ok';$('loginMsg').textContent='لینک ورود ارسال شد. پس از ورود، همین صفحه را باز کنید.'}catch(e){$('loginMsg').className='err';$('loginMsg').textContent='خطای ورود: '+(e?.message||String(e))}};
$('add').onclick=async()=>{const name=$('name').value.trim();if(!name)return msg('نام خدمت الزامی است.');const {data:sv}=await supabase.from('services').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();const {error}=await supabase.from('services').insert({name,description:$('description').value.trim()||null,duration_minutes:Number($('duration').value)||30,price:$('price').value?Number($('price').value):null,is_active:true,sort_order:(sv?.sort_order||0)+1});msg(error?error.message:'خدمت ایجاد شد.');if(!error){$('name').value='';$('description').value='';$('price').value='';loadServices()}};
async function loadServices(){const {data,error}=await supabase.from('services').select('*').order('sort_order');$('services').innerHTML=error?error.message:(data||[]).map(s=>`<div class="item"><b>${s.name}</b> — ${s.duration_minutes} دقیقه — ${s.price==null?'قیمت توافقی':Number(s.price).toLocaleString('fa-IR')+' تومان'}<br><span class="muted">${s.description||''}</span></div>`).join('')||'هنوز خدمتی ثبت نشده است.'}
async function loadAppointments(){const {data,error}=await supabase.from('appointments').select('id,scheduled_at,status,notes,service_id,services(name)').order('scheduled_at');$('appointments').innerHTML=error?error.message:(data&&data.length?data.map(a=>`<div class="item"><b>${a.services?.name||'خدمت'}</b><br>${new Date(a.scheduled_at).toLocaleString('fa-IR')}<br>وضعیت: ${a.status}<br>${a.notes||''}<br><button class="btn" data-id="${a.id}" data-status="confirmed">تأیید</button> <button class="btn" data-id="${a.id}" data-status="cancelled">لغو</button></div>`).join(''):'هنوز نوبتی ثبت نشده است.');document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const {error}=await supabase.from('appointments').update({status:b.dataset.status}).eq('id',b.dataset.id);if(error)alert(error.message);else loadAppointments()})}
check();
</script></body></html>
