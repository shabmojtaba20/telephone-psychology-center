<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دوره‌ها و کارگاه‌های من | مرکز مشاوره تلفنی روان</title><style>body{margin:0;background:#f7f8fc;color:#172033;font-family:Tahoma,Arial,sans-serif;line-height:1.9}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 15px;background:#4f46e5;color:#fff;cursor:pointer;text-decoration:none;font:inherit}.btn.alt{background:#eef2ff;color:#4338ca}.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;padding:30px;border-radius:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 7px 22px #1118270a}.muted{color:#667085;font-size:13px}.badge{display:inline-block;background:#ecfdf3;color:#15803d;border-radius:999px;padding:3px 9px;font-size:11px}.badge.warn{background:#fff7ed;color:#c2410c}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.tag{background:#f3f4f6;border-radius:999px;padding:3px 8px;font-size:11px}.empty{padding:22px;text-align:center;color:#667085;background:#fff;border:1px dashed #d9dee8;border-radius:15px}.section{margin:24px 0}.cover{width:100%;height:150px;object-fit:cover;border-radius:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:12px;border-radius:12px;margin:14px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>🎓 دوره‌ها و کارگاه‌های من</h1><p class="muted">ثبت‌نام‌ها، مطالب خریداری‌شده و گواهی‌های شما در یکجا.</p></div><div><a class="btn alt" href="/education.html">آموزش و کارگاه‌ها</a> <a class="btn" href="/">سایت اصلی</a></div></div><section class="hero"><h2 id="hello">حساب آموزشی شما</h2><p>فقط اطلاعات متعلق به حساب واردشده نمایش داده می‌شود.</p></section><div id="error" class="error" style="display:none"></div><section class="section"><h2>📚 مطالب خریداری‌شده</h2><div id="purchases" class="grid"></div></section><section class="section"><h2>🎓 کارگاه‌های من</h2><div id="workshops" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m])),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان',date=v=>v?new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tehran'}).format(new Date(v)):'-';function showError(t){$('error').textContent=t;$('error').style.display='block'}async function fileLink(path){const{data,error}=await db.storage.from('educational-files').createSignedUrl(path,600);if(error||!data?.signedUrl)throw new Error('لینک امن فایل ساخته نشد.');location.href=data.signedUrl}async function load(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='/';return}$('hello').textContent='سلام، '+(session.user.user_metadata?.full_name||session.user.email||'کاربر')+' 👋';const[pq,wq]=await Promise.all([db.from('educational_purchases').select('id,content_id,status,amount,reference_id,paid_at,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}),db.from('workshop_registrations').select('id,workshop_id,payment_status,joined_at,attendance_status,attended_at,certificate_issued_at,certificate_number,reference_id,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false})]);if(pq.error||wq.error){showError('بارگذاری اطلاعات آموزشی انجام نشد.');return}const purchases=pq.data||[], regs=wq.data||[];const contentIds=[...new Set(purchases.map(x=>x.content_id))], workshopIds=[...new Set(regs.map(x=>x.workshop_id))];let contents=[],workshops=[];if(contentIds.length){const r=await db.from('educational_contents').select('id,title,description,content_type,file_path,thumbnail_url,price').in('id',contentIds);if(r.error){showError('اطلاعات مطالب آموزشی ناقص است.');return}contents=r.data||[]}if(workshopIds.length){const r=await db.from('workshops').select('id,title,description,cover_url,starts_at,ends_at,status,meeting_type,instructor_name,duration_minutes').in('id',workshopIds);if(r.error){showError('اطلاعات کارگاه‌ها ناقص است.');return}workshops=r.data||[]}renderPurchases(purchases,contents);renderWorkshops(regs,workshops)}function renderPurchases(rows,contents){if(!rows.length){$('purchases').innerHTML='<div class="empty">هنوز خرید آموزشی ثبت‌شده‌ای ندارید.</div>';return}$('purchases').innerHTML=rows.map(p=>{const c=contents.find(x=>x.id===p.content_id);const paid=p.status==='paid';return `<article class="card">${c?.thumbnail_url?`<img class="cover" src="${esc(c.thumbnail_url)}" alt="">`:''}<span class="badge ${paid?'':'warn'}">${paid?'پرداخت‌شده':'در انتظار پرداخت'}</span><h3>${esc(c?.title||'مطلب آموزشی')}</h3><p class="muted">نوع: ${esc(c?.content_type||'-')} · مبلغ: ${money(p.amount)}</p><p class="muted">تاریخ: ${date(p.paid_at||p.created_at)}</p><div class="actions">${paid&&c?.file_path?`<button class="btn" onclick="openFile('${encodeURIComponent(c.file_path)}')">دریافت امن فایل</button>`:''}${p.reference_id?`<span class="tag">کد پیگیری: ${esc(p.reference_id)}</span>`:''}</div></article>`}).join('')}function renderWorkshops(regs,workshops){if(!regs.length){$('workshops').innerHTML='<div class="empty">هنوز در کارگاهی ثبت‌نام نکرده‌اید.</div>';return}$('workshops').innerHTML=regs.map(r=>{const w=workshops.find(x=>x.id===r.workshop_id);const paid=r.payment_status==='paid'||r.payment_status==='free';const cert=r.certificate_number&&r.certificate_issued_at;const live=w?.status==='live';return `<article class="card">${w?.cover_url?`<img class="cover" src="${esc(w.cover_url)}" alt="">`:''}<span class="badge ${paid?'':'warn'}">${paid?'ثبت‌نام تأییدشده':'وضعیت: '+esc(r.payment_status||'-')}</span><h3>${esc(w?.title||'کارگاه')}</h3><div class="meta"><span class="tag">${w?.meeting_type==='video'?'🎥 آنلاین تصویری':'🎙️ آنلاین'}</span>${w?.instructor_name?`<span class="tag">👤 ${esc(w.instructor_name)}</span>`:''}${r.attendance_status?`<span class="tag">حضور: ${esc(r.attendance_status)}</span>`:''}</div><p class="muted">🗓 ${date(w?.starts_at)}${w?.ends_at?' تا '+date(w.ends_at):''}</p><div class="actions">${live&&paid?'<span class="tag">کارگاه اکنون در حال برگزاری است؛ لینک ورود توسط مرکز اعلام می‌شود.</span>':''}${r.attended_at?`<span class="tag">حضور ثبت‌شده: ${date(r.attended_at)}</span>`:''}${cert?`<a class="btn" href="/certificate.html?code=${encodeURIComponent(r.certificate_number)}">مشاهده/استعلام گواهی</a>`:''}</div></article>`}).join('')}window.openFile=async encoded=>{try{const path=decodeURIComponent(encoded);await fileLink(path)}catch(e){alert(e.message)}};load().catch(e=>showError('خطای غیرمنتظره در بارگذاری حساب آموزشی.'));</script></body></html>
