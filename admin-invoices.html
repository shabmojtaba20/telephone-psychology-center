<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت صورتحساب‌ها | مرکز مشاوره تلفنی روان</title>
<style>
body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;color:#4b5563}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d9dee8;border-radius:9px;padding:10px;margin:5px 0 10px;font:inherit}.btn{border:0;border-radius:9px;padding:9px 14px;background:#5b5bd6;color:#fff;cursor:pointer}.btn.gray{background:#64748b}.btn.red{background:#b91c1c}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:right;white-space:nowrap}.notice{display:none;padding:10px;border-radius:9px;background:#ecfdf5;color:#166534;margin:12px 0}.err{background:#fff1f2;color:#9f1239}.muted{color:#6b7280;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>صورتحساب‌های مرکز</h1><div class="muted">مدیریت مستقیم جدول invoices در Supabase</div></div><div><button class="btn gray" onclick="location.href='admin-professional.html'">بازگشت به پنل</button><button class="btn red" id="logout">خروج</button></div></div>
<div id="notice" class="notice"></div>
<div class="card"><h2 id="formTitle">صدور صورتحساب جدید</h2><input type="hidden" id="id"><div class="grid"><label>شماره صورتحساب<input id="number" required></label><label>عنوان<input id="title" required></label><label>مبلغ (تومان)<input id="amount" type="number" min="0" required></label><label>وضعیت<select id="status"><option value="draft">پیش‌نویس</option><option value="issued">صادر شده</option><option value="paid">پرداخت شده</option><option value="cancelled">لغو شده</option></select></label><label>تاریخ سررسید<input id="due" type="datetime-local"></label></div><label>یادداشت<textarea id="notes"></textarea></label><button class="btn" id="save">ذخیره صورتحساب</button> <button class="btn gray" id="cancel" style="display:none">انصراف</button></div>
<div class="card"><div class="top"><h2>فهرست صورتحساب‌ها</h2><span class="muted" id="count">۰ صورتحساب</span></div><div class="tablewrap"><table class="table"><thead><tr><th>شماره</th><th>عنوان</th><th>مبلغ</th><th>وضعیت</th><th>صدور</th><th>سررسید</th><th>پرداخت</th><th>عملیات</th></tr></thead><tbody id="list"></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t,bad=false){const e=$('notice');e.textContent=t;e.className='notice'+(bad?' err':'');e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('/admin.html');return false}const r=await db.rpc('is_admin');if(r.error||r.data!==true){note('این حساب دسترسی مدیر ندارد.',true);await db.auth.signOut();return false}return true}
function reset(){['id','number','title','amount','due','notes'].forEach(x=>$(x).value='');$('status').value='draft';$('formTitle').textContent='صدور صورتحساب جدید';$('cancel').style.display='none'}
function localValue(v){if(!v)return '';const d=new Date(v);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
async function load(){if(!(await guard()))return;const r=await db.from('invoices').select('id,invoice_number,title,amount,status,issued_at,due_at,paid_at,notes').order('issued_at',{ascending:false});if(r.error){note(r.error.message,true);return}const a=r.data||[];$('count').textContent=money(a.length)+' صورتحساب';$('list').innerHTML=a.length?a.map(x=>`<tr><td>${esc(x.invoice_number)}</td><td>${esc(x.title)}</td><td>${money(x.amount)} تومان</td><td>${esc(x.status)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleString('fa-IR'):''}</td><td>${x.due_at?new Date(x.due_at).toLocaleString('fa-IR'):''}</td><td>${x.paid_at?new Date(x.paid_at).toLocaleString('fa-IR'):'—'}</td><td><button class="btn" data-edit="${x.id}">ویرایش</button> <button class="btn red" data-del="${x.id}">حذف</button></td></tr>`).join(''):'<tr><td colspan="8" style="text-align:center">هنوز صورتحسابی ثبت نشده است.</td></tr>'}
$('save').onclick=async()=>{if(!(await guard()))return;const id=$('id').value;const status=$('status').value;const v={invoice_number:$('number').value.trim(),title:$('title').value.trim(),amount:Number($('amount').value||0),status,due_at:$('due').value?new Date($('due').value).toISOString():null,notes:$('notes').value.trim()};if(!v.invoice_number||!v.title)return note('شماره و عنوان صورتحساب الزامی است.',true);if(status==='paid')v.paid_at=new Date().toISOString();else if(!id)v.paid_at=null;let r=id?await db.from('invoices').update(v).eq('id',id):await db.from('invoices').insert({...v,issued_at:new Date().toISOString()});if(r.error)note(r.error.message,true);else{note(id?'صورتحساب ویرایش شد.':'صورتحساب صادر شد.');reset();load()}}
$('cancel').onclick=reset;$('logout').onclick=async()=>{await db.auth.signOut();location.replace('/admin.html')};
$('list').addEventListener('click',async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit){const r=await db.from('invoices').select('*').eq('id',edit).single();if(r.error)return note(r.error.message,true);const x=r.data;$('id').value=x.id;$('number').value=x.invoice_number||'';$('title').value=x.title||'';$('amount').value=x.amount||0;$('status').value=x.status||'draft';$('due').value=localValue(x.due_at);$('notes').value=x.notes||'';$('formTitle').textContent='ویرایش صورتحساب';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}if(del){if(!confirm('این صورتحساب حذف شود؟'))return;const r=await db.from('invoices').delete().eq('id',del);if(r.error)note(r.error.message,true);else{note('صورتحساب حذف شد.');load()}}});
load();
</script>
</body></html>
