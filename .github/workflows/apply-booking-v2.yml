name: apply booking v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire booking v2
        run: |
          if grep -q 'booking-v2.js' index.html; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'booking-v2.js' not in s:
              s=s.replace('</body>','<script type="module" src="/booking-v2.js"></script></body>',1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: multi-session booking checkout"
          git push