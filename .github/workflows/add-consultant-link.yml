name: Add consultant and finance panel links

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore homepage navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          changed = False

          # Keep the account button session-aware; do not hard-code its label.
          if '<button id="accountBtn">' not in s:
              raise SystemExit('Account button marker not found')

          # Ensure role-panel links exist in the header.
          admin = '<a class="btn" href="/admin.html">پنل مدیریت</a>'
          consultant = '<a class="btn" href="/consultant-panel.html">پنل مشاور</a>'
          finance = '<a class="btn" href="/admin-v5.html">پنل مالی</a>'
          if admin not in s:
              raise SystemExit('Admin panel link marker not found')
          if consultant not in s:
              s = s.replace(admin, admin + consultant, 1)
              changed = True
          if finance not in s:
              s = s.replace(consultant, consultant + finance, 1)
              changed = True

          # Restore panel links in the footer (without a profile button).
          footer_marker = '<footer class="footer"><div class="c"><h3>مرکز مشاوره تلفنی روان</h3><p>رزرو نوبت و پرداخت آنلاین خدمات مشاوره.</p>'
          footer_nav = '<nav class="footer-panel-links" aria-label="دسترسی به پنل‌ها"><a href="/admin.html">پنل مدیریت</a><a href="/admin-v5.html">پنل مالی</a><a href="/consultant-panel.html">پنل مشاور</a></nav>'
          if 'class="footer-panel-links"' not in s:
              if footer_marker not in s:
                  raise SystemExit('Footer marker not found')
              s = s.replace(footer_marker, footer_marker + footer_nav, 1)
              changed = True

          # Make role links visible on mobile while preserving the existing responsive navigation.
          css_marker = '@media(max-width:700px){.links a{display:none}.steps{grid-template-columns:1fr}.nav{min-height:60px}}'
          css_replacement = '@media(max-width:700px){.links a{display:none}.links a.btn{display:inline-block!important}.steps{grid-template-columns:1fr}.nav{min-height:60px}}'
          if css_marker in s:
              s = s.replace(css_marker, css_replacement, 1)
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change needed"
            exit 0
          fi
          git commit -m "fix: restore panel navigation without overriding account UI"
          git push
