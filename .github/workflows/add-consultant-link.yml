name: Add consultant and finance panel links

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add consultant and finance panel links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<a class="btn" href="/admin.html">پنل مدیریت</a>'
          consultant = '<a class="btn" href="/consultant-panel.html">پنل مشاور</a>'
          finance = '<a class="btn" href="/admin-v5.html">پنل مالی</a>'
          if marker not in s:
              raise SystemExit('Admin panel link marker not found')
          changed = False
          if consultant not in s:
              s = s.replace(marker, marker + consultant, 1)
              changed = True
          if finance not in s:
              anchor = consultant if consultant in s else marker
              s = s.replace(anchor, anchor + finance, 1)
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change needed"
            exit 0
          fi
          git commit -m "feat: add consultant and finance panel links to homepage"
          git push