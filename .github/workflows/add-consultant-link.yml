name: Add consultant panel link

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add consultant panel link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<a class="btn" href="/admin.html">پنل مدیریت</a>'
          link = '<a class="btn" href="/consultant-panel.html">پنل مشاور</a>'
          if link not in s:
              if marker not in s:
                  raise SystemExit('Admin panel link marker not found')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change needed"
            exit 0
          fi
          git commit -m "feat: add consultant panel link to homepage"
          git push