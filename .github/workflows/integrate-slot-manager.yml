name: Integrate predefined slot manager
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-slot-manager.yml'
      - '.slot-manager-trigger'
permissions:
  contents: write
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'SCHEDULE_INTEGRATE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate schedule link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-professional.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="group"><button class="group-title">📅 نوبت‌ها <span>⌄</span></button><div class="sub"><button data-page="appointments">مدیریت نوبت‌ها</button></div></div>'
          new='<div class="group"><button class="group-title">📅 نوبت‌ها <span>⌄</span></button><div class="sub"><button data-page="appointments">مدیریت نوبت‌ها</button><button type="button" onclick="location.href=\'appointment-slots.html\'">🗓️ تعیین تاریخ و ساعت نوبت</button></div></div>'
          if old not in s:
              raise SystemExit('target navigation block not found')
          s=s.replace(old,new,1)
          old2='<section id="appointments" class="section"><div class="card"><h2>مدیریت نوبت‌ها</h2>'
          new2='<section id="appointments" class="section"><div class="card"><div class="top" style="margin-bottom:10px"><div><h2 style="margin:0">مدیریت نوبت‌ها</h2><span class="muted">نوبت‌های ثبت‌شده و زمان‌های قابل رزرو را از همین بخش مدیریت کنید.</span></div><button class="btn secondary" type="button" onclick="location.href=\'appointment-slots.html\'">🗓️ مدیریت زمان‌های از پیش تعیین‌شده</button></div>'
          if old2 not in s:
              raise SystemExit('target appointment section not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-professional.html
          git commit -m 'feat: link predefined slot manager from admin panel'
          git push