name: Wire payment bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject payment bridge
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script type="module" src="/payment-bridge.js"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '</body>')
              p.write_text(s, encoding='utf-8')
              print('payment bridge injected')
          else:
              print('payment bridge already present')
      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: connect booking payment button'
          git push
