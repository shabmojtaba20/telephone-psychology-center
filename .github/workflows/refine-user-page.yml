name: Refine user page
on:
  push:
    branches: [main]
    paths:
      - '.user-page-refine-trigger'
permissions:
  contents: write
jobs:
  refine:
    if: contains(github.event.head_commit.message, 'USER_PAGE_REFINE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='<a href="#services">خدمات</a><a href="#consultants">مشاوران</a><a href="#payment">پرداخت</a>'
          nav_new='<a href="#services">خدمات</a><a href="#education">آموزش و مطالب</a><a href="#consultants">مشاوران</a><a href="#payment">سوابق پرداخت</a>'
          if nav in s and nav_new not in s:
              s=s.replace(nav,nav_new,1)
          services='</section><section id="booking" class="section hidden">'
          education='''</section><section id="education" class="section"><div class="c"><div class="head"><h2>📚 آموزش و مطالب کاربردی</h2><p class="muted">مطالب آموزشی و کارگاه‌های تخصصی برای آگاهی، رشد و آرامش بیشتر.</p></div><div class="panel" style="background:linear-gradient(135deg,#f0efff,#ffffff);display:grid;grid-template-columns:1.4fr .8fr;gap:18px;align-items:center"><div><h3 style="margin-top:0">دانش بیشتر، مسیر بهتر</h3><p class="muted">از آموزش‌های رایگان و محتوای تخصصی مرکز استفاده کنید یا در کارگاه‌های فعال ثبت‌نام کنید.</p><a class="btn" href="/education.html">مشاهده مطالب و کارگاه‌ها</a></div><div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px"><b>📖 مطالب آموزشی</b><p class="muted">محتوای کاربردی و قابل دریافت</p><b>🎓 کارگاه‌های تخصصی</b><p class="muted">آموزش‌های آنلاین و تعاملی</p></div></div></div></section><section id="booking" class="section hidden">'''
          if services in s and 'id="education"' not in s:
              s=s.replace(services,education,1)
          old='''<section id="payment" class="section"><div class="c"><div class="head"><h2>پرداخت و اطلاعات مالی</h2><p class="muted">اطلاعات پرداخت مرکز و صورتحساب نوبت شما.</p></div><div class="panel"><div id="paymentInfo">در حال دریافت اطلاعات مالی مرکز…</div><div class="paybox"><h3>صورتحساب</h3><p>پس از ثبت نوبت، صورتحساب مربوط به همان نوبت در فرآیند رزرو نمایش داده می‌شود.</p><a class="btn" href="#booking">رفتن به رزرو نوبت</a></div></div></div></section>'''
          new='''<section id="payment" class="section"><div class="c"><div class="head"><h2>💳 سوابق پرداخت من</h2><p class="muted">برای حفظ حریم خصوصی، فقط تاریخ رزرو، نام مشاور و مبلغ پرداخت‌شده نمایش داده می‌شود.</p></div><div class="panel"><div id="userPayments"><div class="muted">برای مشاهده سوابق پرداخت، وارد حساب کاربری شوید.</div></div></div></div></section>'''
          if old in s:
              s=s.replace(old,new,1)
          marker='</script>'
          js='''<script>\nasync function loadUserPaymentHistory(){try{const {data:{session}}=await s.auth.getSession();const box=$("userPayments");if(!box)return;if(!session){box.innerHTML='<div class="muted">برای مشاهده سوابق پرداخت، وارد حساب کاربری شوید.</div>';return}const {data,error}=await s.from('appointments').select('scheduled_at,amount,payment_status,consultants(name)').eq('user_id',session.user.id).eq('payment_status','paid').order('scheduled_at',{ascending:false});if(error){box.innerHTML='<div class="muted">سوابق پرداخت در حال حاضر قابل دریافت نیست.</div>';return}const rows=data||[];box.innerHTML=rows.length?rows.map(x=>`<div class="row"><span>تاریخ رزرو<br><b>${faDateTime(x.scheduled_at)}</b></span><span>مشاور<br><b>${String(x.consultants?.name||'—')}</b></span><span>مبلغ پرداخت‌شده<br><b>${Number(x.amount||0).toLocaleString('fa-IR')} تومان</b></span></div>`).join(''):'<div class="muted">هنوز پرداخت موفقی برای حساب شما ثبت نشده است.</div>'}catch(e){const box=$("userPayments");if(box)box.innerHTML='<div class="muted">خطا در دریافت سوابق پرداخت.</div>'}}\ns.auth.onAuthStateChange(()=>setTimeout(loadUserPaymentHistory,0));loadUserPaymentHistory();\n</script>'''
          if 'loadUserPaymentHistory' not in s:
              s=s.replace(marker,js+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: refine education placement and user payment history'
          git push
