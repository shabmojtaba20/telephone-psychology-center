name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: npm run build

      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: telephone-psychology-center
          directory: .
          branch: main

# Canonical production deployment path: Cloudflare Pages via GitHub Actions.
# Do not use `npx wrangler deploy` from the Cloudflare Pages dashboard for this project.
