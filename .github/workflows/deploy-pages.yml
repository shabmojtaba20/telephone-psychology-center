name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair user booking/login script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(';loadServices();loadConsultants();loadPayment();updateBookingAuth();<script>\nasync function loadUserPaymentHistory', ';loadServices();loadConsultants();loadPayment();updateBookingAuth();\nasync function loadUserPaymentHistory')
          s=s.replace(";$('paymentInfo').innerHTML=h||'<p>اطلاعات مالی برای نمایش ثبت نشده است.</p>';", ";")
          s=s.replace('</script></script></body>', '</script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair user booking and login flow'
          git push
      - name: Build site
        run: npm run build
      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: telephone-psychology-center
          directory: .
          branch: main

# production deployment trigger
