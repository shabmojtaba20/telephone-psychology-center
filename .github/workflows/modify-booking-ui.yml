name: modify booking ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  modify:
    if: ${{ !contains(github.event.head_commit.message, 'feat: multi-session booking checkout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          style='''<style>.slot-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:8px 0 16px}.day-btn{border:1px solid #d9dee8;background:#fff;border-radius:12px;padding:10px;cursor:pointer;font:inherit}.day-btn.active{border-color:#5b5bd6;background:#eef2ff;color:#4338ca;font-weight:800}.day-btn small{display:block;color:#667085;font-weight:400}.slot-times{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.time-option{display:flex;align-items:center;gap:8px;border:1px solid #d9dee8;background:#fff;border-radius:11px;padding:10px;cursor:pointer}.time-option.selected{border-color:#5b5bd6;background:#f5f3ff}.time-option input{width:auto;margin:0}.booking-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.booking-summary>div{background:#fff;border:1px solid #e5e7ef;border-radius:12px;padding:12px;text-align:center}.booking-summary strong{display:block;font-size:20px;color:#4338ca}.pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-btn{width:100%}.pay-btn.secondary{background:#fff;color:#4338ca!important;border:1px solid #5b5bd6}.mini-list{margin:8px 0;padding:0;list-style:none}.mini-list li{padding:6px 0;border-bottom:1px solid #eee}.modal-card.wide{width:min(520px,100%)}@media(max-width:700px){.pay-actions,.booking-summary{grid-template-columns:1fr}}</style>'''
          if '.slot-days{' not in s:
              s=s.replace('</style>',style+'</style>',1)

          old_booking='''<div id="bookingForm" class="hidden"><div class="steps"><div class="step active">۱. نوبت</div><div class="step">۲. پرداخت</div><div class="step">۳. تأیید</div></div><label>مشاور</label><select id="consultant"><option value="">انتخاب مشاور</option></select><label>نوبت‌های قابل رزرو</label><select id="slot"><option value="">ابتدا مشاور را انتخاب کنید</option></select><div id="scheduledAtFa" class="date-preview">تاریخ و ساعت شمسی پس از انتخاب نوبت نمایش داده می‌شود.</div><input id="scheduledAt" type="hidden"><label>علت مراجعه / توضیح کوتاه <span class="muted">(اختیاری)</span></label><textarea id="clientReason" rows="4" maxlength="2000" placeholder="مثلاً مدتی است اضطراب، استرس یا مشکل تمرکز دارم..."></textarea><div class="hint">این توضیح برای آماده‌سازی مشاور استفاده می‌شود. هوش مصنوعی فقط یک سرفصل و خلاصه اولیه غیرتشخیصی برای مشاور تهیه خواهد کرد.</div><label>توضیحات تکمیلی <span class="muted">(اختیاری)</span></label><textarea id="notes" rows="3"></textarea><button class="btn" id="bookBtn">ثبت نوبت و ادامه پرداخت</button><div id="bookMsg"></div><div id="paymentStep" class="paybox hidden"><h3>پرداخت نوبت</h3><p>مبلغ قابل پرداخت: <strong id="payAmount"></strong> تومان</p><div id="publicPaymentInfo"></div><button class="btn" id="onlinePay">پرداخت الکترونیک</button></div></div>'''
          new_booking='''<div id="bookingForm" class="hidden"><div class="steps"><div class="step active">۱. انتخاب جلسات</div><div class="step">۲. پرداخت</div><div class="step">۳. تأیید</div></div><label>مشاور</label><select id="consultant"><option value="">انتخاب مشاور</option></select><div class="panel" style="padding:15px;margin:10px 0"><h3 style="margin-top:0">۱) روز موردنظر را انتخاب کنید</h3><div id="slotDays" class="slot-days"><span class="muted">ابتدا مشاور را انتخاب کنید.</span></div><h3>۲) ساعت‌های آزاد همان روز</h3><div id="slotTimes" class="slot-times"><span class="muted">پس از انتخاب روز، ساعت‌ها نمایش داده می‌شوند.</span></div><div id="selectedSessions" class="hint">هیچ جلسه‌ای انتخاب نشده است.</div></div><label>علت مراجعه / توضیح کوتاه <span class="muted">(اختیاری)</span></label><textarea id="clientReason" rows="4" maxlength="2000" placeholder="مثلاً مدتی است اضطراب، استرس یا مشکل تمرکز دارم..."></textarea><div class="hint">این توضیح برای آماده‌سازی مشاور استفاده می‌شود. هوش مصنوعی فقط یک سرفصل و خلاصه اولیه غیرتشخیصی برای مشاور تهیه خواهد کرد.</div><label>توضیحات تکمیلی <span class="muted">(اختیاری)</span></label><textarea id="notes" rows="3"></textarea><button class="btn" id="bookBtn">ثبت نوبت و ادامه پرداخت</button><div id="bookMsg"></div><div id="paymentStep" class="paybox hidden"><h3>ادامه پرداخت</h3><div class="booking-summary"><div><span>تعداد جلسات رزرو شده</span><strong id="payCount">۰</strong></div><div><span>مبلغ قابل پرداخت</span><strong><span id="payAmount">۰</span> تومان</strong></div></div><div class="pay-actions"><button class="btn pay-btn" id="onlinePay">پرداخت از طریق درگاه الکترونیک</button><button class="btn pay-btn secondary" id="cardPay">پرداخت کارت به کارت</button></div><div id="paymentMsg"></div></div></div>'''
          if old_booking not in s: raise SystemExit('booking html pattern not found')
          s=s.replace(old_booking,new_booking,1)

          modal='''<div id="cardPayModal" class="modal hidden"><div class="modal-card wide"><div class="modal-head"><h2>پرداخت کارت به کارت</h2><button class="close" id="closeCardPay">بستن</button></div><div id="cardPayInfo" class="paybox">در حال دریافت اطلاعات کارت مرکز…</div><label>کد پیگیری / شماره رسید</label><input id="cardTracking" inputmode="numeric" placeholder="کد پیگیری تراکنش را وارد کنید"><label>۴ رقم آخر کارت پرداخت‌کننده <span class="muted">(اختیاری)</span></label><input id="payerCardLast4" inputmode="numeric" maxlength="4" placeholder="مثلاً ۱۲۳۴"><div class="hint">شماره کارت کامل، رمز دوم، CVV2 یا رمز پویا را در این فرم وارد نکنید.</div><button class="btn" id="submitCardPay">ثبت رسید پرداخت</button><div id="cardPayMsg"></div></div></div>'''
          if 'id="cardPayModal"' not in s: s=s.replace('<div id="authModal" class="modal hidden">',modal+'<div id="authModal" class="modal hidden">',1)

          start=s.index('async function loadSlots(){')
          end=s.index("async function loadPayment(){",start)
          slots='''async function loadSlots(){const cid=$("consultant").value;$("slotDays").innerHTML=cid?'<span class="muted">در حال دریافت روزهای آزاد…</span>':'<span class="muted">ابتدا مشاور را انتخاب کنید.</span>';$('slotTimes').innerHTML='<span class="muted">پس از انتخاب روز، ساعت‌ها نمایش داده می‌شوند.</span>';$('selectedSessions').textContent='هیچ جلسه‌ای انتخاب نشده است.';selectedSlots.clear();availableSlots=[];if(!cid)return;const{data,error}=await s.rpc('get_public_consultant_slots',{p_consultant_id:cid});if(error){$('slotDays').innerHTML='<span class="muted">خطا در دریافت نوبت‌ها</span>';return}availableSlots=data||[];const groups={};availableSlots.forEach(x=>(groups[x.slot_date]??=[]).push(x));const dates=Object.keys(groups);$('slotDays').innerHTML=dates.length?dates.map((date,i)=>{const iso=date+'T12:00:00+03:30';return`<button type="button" class="day-btn${i===0?' active':''}" data-date="${date}">${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Tehran'}).format(new Date(iso))}<small>${date}</small></button>`}).join(''):'<span class="muted">برای این مشاور فعلاً نوبت آزادی ثبت نشده است.</span>';if(dates.length)renderSlotTimes(dates[0]);document.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.day-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderSlotTimes(b.dataset.date)})}
function renderSlotTimes(date){const rows=availableSlots.filter(x=>x.slot_date===date);$('slotTimes').innerHTML=rows.length?rows.map(x=>{const iso=x.slot_date+'T'+String(x.start_time).slice(0,5)+':00+03:30', checked=selectedSlots.has(x.id);return`<label class="time-option${checked?' selected':''}"><input type="checkbox" value="${x.id}" data-time="${iso}" ${checked?'checked':''}><span>${faDateTime(iso).split('، ').pop()||faDateTime(iso)}</span></label>`}).join(''):'<span class="muted">ساعت آزادی برای این روز باقی نمانده است.</span>';document.querySelectorAll('#slotTimes input').forEach(i=>i.onchange=()=>{if(i.checked)selectedSlots.add(i.value);else selectedSlots.delete(i.value);i.closest('.time-option').classList.toggle('selected',i.checked);updateSelectionSummary()})}
function updateSelectionSummary(){const rows=availableSlots.filter(x=>selectedSlots.has(x.id));$('selectedSessions').innerHTML=rows.length?`<ul class="mini-list">${rows.map(x=>`<li>${faDateTime(x.slot_date+'T'+String(x.start_time).slice(0,5)+':00+03:30')}</li>`).join('')}</ul><b>${rows.length.toLocaleString('fa-IR')} جلسه انتخاب شده است.</b>`:'هیچ جلسه‌ای انتخاب نشده است.'}
$('consultant').addEventListener('change',loadSlots);
'''
          s=s[:start]+slots+s[end:]

          s=s.replace("let selected=null,session=null;","let selected=null,session=null,availableSlots=[],selectedSlots=new Set(),currentOrder=null;")

          start=s.index("$('bookBtn').onclick=")
          end=s.index("$('onlinePay').onclick=",start)
          book='''$('bookBtn').onclick=async()=>{if(!session)return $('authModal').classList.remove('hidden');if(!selected||!$('consultant').value||selectedSlots.size===0)return msg('bookMsg','لطفاً مشاور و حداقل یک جلسه از روز و ساعت‌های آزاد را انتخاب کنید.');const clientReason=$('clientReason').value.trim()||null,notes=$('notes').value.trim()||null;const{data,error}=await s.rpc('create_multi_session_booking',{p_service_id:selected.id,p_consultant_id:$('consultant').value,p_slot_ids:Array.from(selectedSlots),p_client_reason:clientReason,p_notes:notes});if(error)return msg('bookMsg',error.message.includes('no longer available')?'یکی از نوبت‌های انتخاب‌شده دیگر در دسترس نیست؛ لطفاً دوباره انتخاب کنید.':'ثبت نوبت انجام نشد. لطفاً دوباره تلاش کنید.',false);currentOrder=Array.isArray(data)?data[0]:data;$('payAmount').textContent=Number(currentOrder?.total_amount||0).toLocaleString('fa-IR');$('payCount').textContent=Number(currentOrder?.session_count||selectedSlots.size).toLocaleString('fa-IR');$('paymentStep').classList.remove('hidden');$('paymentStep').scrollIntoView({behavior:'smooth'});msg('bookMsg','نوبت‌های انتخاب‌شده با موفقیت رزرو شدند؛ اکنون روش پرداخت را انتخاب کنید.',true)};
'''
          s=s[:start]+book+s[end:]

          old_online="$('onlinePay').onclick=()=>msg('bookMsg','درگاه آنلاین پس از فعال‌سازی در پنل مدیریت متصل می‌شود.',false);"
          new_online="$('onlinePay').onclick=()=>msg('paymentMsg','درگاه الکترونیک آماده اتصال است؛ برای جلوگیری از پرداخت جعلی، انتقال به شاپرک فقط پس از فعال‌سازی کلید درگاه در سمت سرور انجام می‌شود.',false);$('cardPay').onclick=async()=>{if(!currentOrder)return;const{data,error}=await s.rpc('get_public_card_payment_settings');const row=Array.isArray(data)?data[0]:data;if(error||!row)return msg('paymentMsg','اطلاعات کارت به کارت مرکز هنوز تکمیل نشده است.',false);$('cardPayInfo').innerHTML=`<b>مبلغ قابل پرداخت: ${Number(currentOrder.total_amount||0).toLocaleString('fa-IR')} تومان</b><div class=\"row\"><span>بانک</span><b>${row.bank_name||'—'}</b></div><div class=\"row\"><span>شماره کارت</span><b>${row.card_number||'—'}</b></div><div class=\"row\"><span>صاحب کارت</span><b>${row.card_holder||'—'}</b></div><p class=\"muted\">${row.instructions||'پس از انتقال وجه، کد پیگیری را ثبت کنید.'}</p>`;$('cardPayModal').classList.remove('hidden')};$('closeCardPay').onclick=()=>$('cardPayModal').classList.add('hidden');$('submitCardPay').onclick=async()=>{if(!currentOrder)return;const tracking=$('cardTracking').value.trim(),last4=$('payerCardLast4').value.trim();if(!tracking)return $('cardPayMsg').textContent='کد پیگیری را وارد کنید.';if(last4&&!/^\\d{4}$/.test(last4))return $('cardPayMsg').textContent='۴ رقم آخر کارت صحیح نیست.';const{error}=await s.rpc('submit_card_payment_for_order',{p_order_id:currentOrder.order_id,p_tracking_code:tracking,p_payer_card_last4:last4||null,p_receipt_path:null});if(error)return $('cardPayMsg').textContent='ثبت رسید انجام نشد: '+error.message;$('cardPayMsg').className='msg ok';$('cardPayMsg').textContent='رسید پرداخت ثبت شد و پس از بررسی مالی، نوبت‌ها تأیید می‌شوند.';setTimeout(()=>{$('cardPayModal').classList.add('hidden')},1200)};"
          if old_online not in s: raise SystemExit('online handler pattern not found')
          s=s.replace(old_online,new_online,1)

          # Prevent stale financial details loader from rendering into the checkout.
          s=s.replace('loadServices();loadConsultants();loadPayment();updateBookingAuth();','loadServices();loadConsultants();updateBookingAuth();')

          p.write_text(s)
          PY
      - name: Commit modified booking flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: multi-session booking checkout"
          git push
