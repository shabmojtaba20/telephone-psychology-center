<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>بررسی ورود مشاور</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0;padding:20px}.box{max-width:720px;margin:30px auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #0001}h1{font-size:22px}.state{padding:14px;border-radius:10px;background:#eef2ff;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.ok{background:#dcfce7;color:#166534}.err{background:#ffe4e6;color:#9f1239}a,button{font:inherit;padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:white;text-decoration:none;display:inline-block;margin:5px;cursor:pointer}</style></head><body><main class="box"><h1>عیب‌یابی ورود پنل مشاور</h1><p>این صفحه نسخه و وضعیت نشست ورود و اتصال نقش مشاور را جداگانه بررسی می‌کند.</p><div id="version" class="state">نسخه تشخیصی: auth-check-2026-09-19-1</div><div id="status" class="state">در انتظار آماده‌شدن Supabase Auth…</div><div id="role" class="state">بررسی نقش هنوز آغاز نشده است.</div><p><a href="/consultant-panel-professional.html?check=20260919">بازگشت به پنل مشاور</a> <a href="/admin.html">صفحه ورود</a></p><button id="retry">بررسی دوباره</button></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX');const status=document.getElementById('status'),role=document.getElementById('role');function show(el,text,kind=''){el.textContent=text;el.className='state '+kind}let started=false;async function verify(session,event){if(started)return;started=true;show(status,'رویداد Auth: '+event+'\n'+(session?.user?'نشست شناسایی شد.':'نشست کاربری وجود ندارد.'),session?.user?'ok':'err');if(!session?.user){show(role,'وضعیت نقش: وارد نشده‌اید. از صفحه ورود مشاور/مدیریت وارد شوید.','err');return}show(role,'کاربر وارد شده است؛ در حال فراخوانی get_my_consultant_dashboard…');try{const result=await Promise.race([supabase.rpc('get_my_consultant_dashboard'),new Promise((_,reject)=>setTimeout(()=>reject(new Error('مهلت درخواست RPC تمام شد (12 ثانیه).')),12000))]);if(result.error){show(role,'خطای RPC نقش مشاور:\n'+result.error.message,'err');return}if(!result.data?.length){show(role,'نشست معتبر است، اما RPC هیچ پروفایل مشاوری برای این حساب برنگرداند.','err');return}const d=result.data[0];show(role,'نقش مشاور تأیید شد.\nنام: '+(d.consultant_name||'—')+'\nتخصص: '+(d.specialty||'—')+'\nنوبت‌های آینده: '+(d.upcoming_count??'—')+'\nنوبت‌های انجام‌شده: '+(d.completed_count??'—'),'ok')}catch(e){show(role,'خطا هنگام بررسی نقش:\n'+(e?.message||String(e)),'err')}}supabase.auth.onAuthStateChange((event,session)=>{if(event==='INITIAL_SESSION'||event==='SIGNED_IN')setTimeout(()=>verify(session,event),0)});setTimeout(()=>{if(!started){show(status,'رویداد اولیه Auth هنوز دریافت نشده است. ممکن است بارگذاری کتابخانه یا نشست مرورگر متوقف شده باشد.','err');show(role,'بررسی نقش انجام نشد.','err')}},15000);document.getElementById('retry').onclick=()=>{started=false;show(status,'در حال خواندن مجدد نشست…');show(role,'در انتظار نتیجه…');supabase.auth.getSession().then(({data,error})=>{if(error){show(status,'خطای دریافت نشست: '+error.message,'err');return}verify(data.session,'manual getSession')}).catch(e=>show(status,'خطا: '+(e?.message||e),'err'))};</script></body></html>
