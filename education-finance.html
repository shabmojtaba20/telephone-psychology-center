<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش مالی آموزش</title><style>body{margin:0;background:#f6f8fc;color:#172033;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;background:#4f46e5;color:#fff;cursor:pointer;text-decoration:none;font:inherit}.btn.alt{background:#eef2ff;color:#4338ca}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.field{padding:10px;border:1px solid #d7dce5;border-radius:9px;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:18px;border:1px solid #e5e7eb;border-radius:14px}.stat b{display:block;font-size:23px;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right}th{background:#f8fafc;font-size:12px}.muted{color:#667085;font-size:13px}@media(max-width:650px){.filters,.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>📊 گزارش مالی آموزش</h1><p class="muted">درآمد واقعی مطالب آموزشی و کارگاه‌ها بر اساس پرداخت‌های موفق</p></div><div><a class="btn alt" href="/education-dashboard.html">داشبورد آموزش</a> <a class="btn alt" href="/admin-professional.html">پنل مدیریت</a></div></div><div class="card"><div class="filters"><input id="from" class="field" type="date"><input id="to" class="field" type="date"><button id="run" class="btn">نمایش گزارش</button></div></div><div id="stats" class="stats"></div><div class="card"><h2>درآمد مطالب آموزشی</h2><div id="contents"></div></div><div class="card"><h2>درآمد کارگاه‌ها</h2><div id="workshops"></div></div><div id="msg" class="muted"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://aserkyiwwyggtixckjsv.supabase.co','sb_publishable_7THOazCrwgQGvRPGC8grgA_6J1E_9HX'),$=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){const g=await db.rpc('has_admin_permission',{p_permission:'education.manage'});if(g.error||g.data!==true){$('msg').textContent='دسترسی غیرمجاز';return}const f=$('from').value,t=$('to').value,r=await db.rpc('get_education_finance_report',{p_from:f?new Date(f+'T00:00:00').toISOString():null,p_to:t?new Date(t+'T23:59:59').toISOString():null});if(r.error){$('msg').textContent=r.error.message;return}const d=r.data,ct=d.totals||{};$('stats').innerHTML='<div class="stat">درآمد مطالب<b>'+money(ct.content_revenue)+'</b></div><div class="stat">درآمد کارگاه‌ها<b>'+money(ct.workshop_revenue)+'</b></div><div class="stat">کل درآمد آموزش<b>'+money(Number(ct.content_revenue||0)+Number(ct.workshop_revenue||0))+'</b></div>';
const cs=d.contents||[],ws=d.workshops||[];$('contents').innerHTML=cs.length?'<table><thead><tr><th>محتوا</th><th>نوع</th><th>فروش موفق</th><th>درآمد</th></tr></thead><tbody>'+cs.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.content_type)+'</td><td>'+Number(x.sales||0).toLocaleString('fa-IR')+'</td><td>'+money(x.revenue)+'</td></tr>').join('')+'</tbody></table>':'موردی وجود ندارد.';
$('workshops').innerHTML=ws.length?'<table><thead><tr><th>کارگاه</th><th>وضعیت</th><th>ثبت‌نام</th><th>پرداخت موفق</th><th>درآمد</th></tr></thead><tbody>'+ws.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.status)+'</td><td>'+Number(x.registrations||0).toLocaleString('fa-IR')+'</td><td>'+Number(x.paid||0).toLocaleString('fa-IR')+'</td><td>'+money(x.revenue)+'</td></tr>').join('')+'</tbody></table>':'موردی وجود ندارد.'}
$('run').onclick=load;load();</script></body></html>
